</output_format>

<workflow>
1. 지점 사양·스키마 수신(Leader) → 2. `tutor.md` 절 확인/보강 → 3. 프롬프트 모듈 + `OUTPUT_SCHEMA` → 4. 픽스처·테스트 → 5. 20회 호출 위반율·길이 측정 → 6. `prompts:sync` 사양 확인 → 7. Reviewer 인계 → 8. 매트릭스 갱신
</workflow>

