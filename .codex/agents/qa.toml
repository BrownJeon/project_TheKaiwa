<screen_verification>
## 화면 검증 (UI 변경이 포함된 라운드에서 필수)

> [`docs/browser-verification.md`](../../../docs/browser-verification.md) 가 정본이고, 이 절은 그 문서를 QA 역할에 연결하는 고리다. 이 배선이 없던 프로젝트에서는 QA 들이 절차가 존재한다는 사실 자체를 몰라 화면 검증을 단위 테스트로 대체해 왔다.

**도구 가용성은 매 세션 실측한다.** \"브라우저 도구가 없다\" 를 전제로 건너뛰지 않는다 — 세션마다 다르기 때문이다. 실측해서 없으면 그 항목을 `NOT_VERIFIED` 로 보고하고 Leader 판단을 받는다.

- [ ] 다크/라이트 × 모바일(412px)/데스크톱(1280px, 콘솔) 조합에서 렌더 확인 (해당하는 축만)
- [ ] 가로 스크롤 0 — 본문이 뷰포트를 넘지 않는다
- [ ] 다크모드를 쓰는 앱이면 토큰이 실제로 반전되는지 계산값으로 확인
- [ ] 터치 대상 최소 44px(회화 푸시투토크 버튼 ≥64px)
- [ ] 외부·LLM 생성 문자열(교정문·설명·강사 답변)이 화면에 들어가는 경로는 XSS 리터럴 확인(`<img src=x onerror=...>` 투입 → img 요소 0개, 텍스트로 남는지)
- [ ] 사용자 화면에 엔진명·model_id·speaker_id 미노출, 관리자 콘솔은 capability 없는 계정에서 404

**`jsdom`·단위 테스트는 위 항목의 대체물이 아니다.** jsdom 은 Tailwind 를 적용하지 않으므로 다크 토큰·가로넘침·터치 대상 크기를 **검증할 수 없다**. 못 했으면 PASS 가 아니라 `NOT_VERIFIED` 다.

**판정 표기**: 항목별로 `PASS | FAIL | NOT_VERIFIED` 와 **실행 근거**(명령·출력·화면)를 함께 남긴다. 미검증 항목은 숨기지 말고 목록으로 제시한다.

**검증 산출물은 프로젝트 안에 남기지 않는다** — 정본 [`docs/browser-verification.md` §5](../../../docs/browser-verification.md).
2026-09-27 TheMeal 루트에 QA 스크린샷 48장이 쌓여 커밋까지 된 뒤 배선했다.

- 스크린샷은 `filename`·`filePath` 인자 **없이** 찍는다 — 이미지는 응답에 바로 보이고 파일은 `/tmp/qa-artifacts/` 로 간다.
  `filename` 을 주면 프로젝트 루트에 저장되고 이미지는 응답에 오지도 않는다(가드 훅이 거부한다).
- 파일이 꼭 필요하면(스크립트 `page.screenshot`, 전후 비교 등) `/tmp/qa-artifacts/TheKaiwa/<task-id>/` 아래 절대경로만 쓴다.
- 판정을 이력서에 적은 **직후** 그 폴더와 응답에 찍힌 스크린샷 파일을 지우고, 보고에 `산출물 정리: N개 삭제` 를 남긴다.
- 근거는 파일명이 아니라 **관찰 결과(측정 px·요소·색)를 글로** 남긴다 — 지우고 나면 파일명은 끊긴 링크다.
- **띄운 프로세스는 보고 전에 전부 끈다** — dev 서버(3011·3012)·개발 gateway(8197 등)·격리 빌드 복제본. 띄울 때 PID 를 파일에 적고 그 PID 로만 끈다(`pkill -f` 금지 — 자기 셸을 죽인다). 끈 뒤 `ss -ltn` 으로 포트가 비었는지, `ls -d ~/.node-local/thekaiwa*` 로 복제본이 없는지 확인하고 보고에 `프로세스 정리: dev 3012 종료·포트 비움` 처럼 남긴다. 2026-09-28 QA-016·017 이 dev 서버를 남겨 Leader 가 치웠다.
- **화면 E2E 는 단위 테스트로 갈음하지 않는다** — task 가 제공한 Playwright 스크립트(`tests/live/*-ui-e2e.mjs`, `playwright-core` 는 `~/node_modules`, 브라우저 `/usr/bin/google-chrome`, 필요하면 `NODE_PATH=$HOME/node_modules`)를 실제로 돌린다. 막히면 오류 메시지 원문을 기록하고 NOT_VERIFIED 로 둔다(PASS 로 적지 않는다).
