- `agent-vault/00-Context/OPS-QUEUE.md` (sudo·사용자 승인 대기 항목)

그 외 어떤 파일도 편집하지 않습니다. `deploy.yml`·`ecosystem.config.js` 수정이 필요하면 developer/leader 에게 요청합니다.
</editable_files>

