# TheKaiwa (Next.js — AI 일본어 회화·교정·단어·평가 / 온디바이스 STT 폴백 WS / APK 배포본)
# 적용: docs/nginx/README.md (sudo 필요 — 사용자 실행). TheMeal vhost 패턴 + climb vhost 의 WebSocket 블록.
server {
    listen 443 ssl;
    server_name kaiwa.xn--lh0b87pnudm10a4vd.com;

    ssl_certificate     /etc/letsencrypt/live/xn--lh0b87pnudm10a4vd.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--lh0b87pnudm10a4vd.com/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # Next.js API Route는 PUT/PATCH/DELETE 사용 (CRS Rule 911100 우회)
    # id는 전역 유일 — 2026-09-26 스캔 결과 9001001~9001009 사용 중이라 9001010 채번
    modsecurity_rules '
        SecAction "id:9001010,phase:1,nolog,pass,t:none,setvar:tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE"
    ';

    # 발화 wav 업로드(≤2MB·≤60s, POST /api/v1/speech/utterances)·Voice Package zip(관리자, Phase 4 ≤512MB 는 그때 상향)
    client_max_body_size 32m;
    proxy_send_timeout   600s;

    # 실시간 STT 폴백(WebSocket) → speech/gateway (pm2 thekaiwa-speech-gateway, task-003 에서 기동)
    location /ws/speech {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # APK 배포본 — nginx alias 로 NFS 를 직접 읽지 않는다: nginx 워커(www-data)는 /home/brownjeon(750) 을 지나갈 수 없어
    # 403 이 난다(2026-09-26 실측). 다른 프로젝트와 같이 **앱 라우트**(GET /app/download/[file], DATA_ROOT/releases/ 스트리밍,
    # brownjeon 계정으로 실행)가 서빙하고 nginx 는 프록시만 한다. 대용량(≈30MB)이라 buffering 만 끈다.
    location /app/download/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # ReazonSpeech 온디바이스 모델 다운로드(≈160MB, Next.js /models/* 라우트가 DATA_ROOT 에서 스트리밍) — 본문 상한과 무관, 응답 타임아웃만 여유
    location /models/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 900s;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 회화 턴 SSE(POST /api/v1/chats/:id/turns)·잡 폴링: buffering 끄고 timeout 여유
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }
}
