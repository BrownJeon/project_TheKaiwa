}

/* 틀 배치: 휴대폰은 실제 CSS 폭·높이로 배치하고, 자리가 모자라면 같은 배율(--s)로 통째 축소.

.dtoast { position: fixed; left: 50%; bottom: 24px; z-index: 90; transform: translateX(-50%); max-width: calc(100vw - 32px); background: var(--ink); color: var(--surface); border-radius: 12px; padding: 10px 14px; font-size: 13px; box-shadow: 0 6px 18px rgba(0,0,0,.2); }

  return '<div class="sh"><h2>③ 문제 · 5문제</h2><p class="d13">답을 고르면 바로 정답과 설명이 나와요. 한 번만 고를 수 있어요.</p></div>' +

/* ⑤ 말하기 */
function kana(s) { return s.replace(/[ァ-ヶ]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0x60); }); }
function norm(s) { return kana(s.replace(/[\s、。，．！？!?「」『』・…ー〜~,.]/g, '')); }
function checkSaid(t, said) {
  var ns = norm(said);
  return t.tg.map(function (g) { return ns.indexOf(norm(g.ja)) >= 0 || ns.indexOf(norm(g.r)) >= 0; });
}
function stage5() {
  var i = S.spk.i, t = SPK[i], r = S.spk.res[i];

    return '<span class="qd ' + cls + '">' + (x ? (x.hits.every(Boolean) ? '✓' : '△') : k + 1) + '</span>';
  }).join('') + '</div>';

  }).join('') + '</ul>';
  var alert = S.sttErr === 'MIC_DENIED' ? '<div class="alert mt" role="alert"><p><b>마이크 사용이 막혀 있어요.</b></p><p class="mt4">주소창 왼쪽 아이콘(사이트 정보) → 권한 → 마이크 → 허용으로 바꾼 뒤 다시 눌러 주세요.</p><button type="button" class="alink" data-act="spk-text" data-k="dn-text">글자로 답하기</button></div>' : '';
  var result = '';
  if (r) {
    var missed = t.tg.filter(function (_, k) { return !r.hits[k]; });
    result = '<div class="said"><p class="bl">' + (r.src === 'text' ? '내가 쓴 답' : '내가 한 말') + '</p><p class="ja bub" lang="ja">' + esc(r.said) + '</p>' + (r.src === 'voice' && S.tts === 'ONLINE' ? '<br><button type="button" class="alink" data-act="play1" data-arg="me' + i + '" data-k="pme">' + (playing('me' + i) ? ICON.stop + '&nbsp;멈춤' : ICON.play + '&nbsp;내 목소리') + '</button>' : '') + '</div>' +
      '<p class="res' + (missed.length ? '' : ' g') + '" role="status">' + (missed.length ? '모범 답안과 비교해 보세요 · 아직 안 쓴 표현 ' + missed.map(function (g) { return J(g.ja); }).join(', ') : '✓ 목표 표현을 모두 썼어요') + '</p>' +
      '<div class="box mt8"><p class="bl g">모범 답안</p><p class="ja" lang="ja">' + t.m.ja + '</p>' + (S.reading ? '<p class="rd" lang="ja">' + t.m.r + '</p>' : '') + '<p class="ko">' + t.m.ko + '</p>' + playWide('s' + i, '모범 답안 듣기') + '</div>';
  } else {
    result = '<div class="livebox" data-live="pbox" aria-hidden="true"><span class="d13">' + (S.spk.text ? '아래 입력창에 일본어로 써서 답해요' : '버튼을 누른 채로 말하면 여기에 알아들은 말이 나와요') + '</span></div>' +
      '<button type="button" class="alink" data-act="spk-skip" data-k="sskip">이 과제 건너뛰기</button>';
  }
  var foot = '';
  if (r) {
    if (i < 2) foot = '<button type="button" class="btn primary full" data-act="spk-next" data-k="snext">다음 과제</button>';
    else if (!reviewing()) foot = '<div>' + (S.doneErr ? '<div class="alert" role="alert" style="margin-bottom:8px"><p><b>수업 기록을 남기지 못했어요.</b> 다시 눌러 주세요.</p><p class="mt4">여러 번 눌러도 기록은 한 번만 남아요.</p></div>' : '') +

  }
  var nav = reviewing() ? '<div class="btnrow" style="margin-top:0">' + SPK.map(function (_, k) { return '<button type="button" class="btn ' + (k === i ? 'soft' : 'ghost') + ' h44" data-act="spk-go" data-arg="' + k + '">과제 ' + (k + 1) + '</button>'; }).join('') + '</div>' : '';
  return '<div class="sh"><h2>⑤ 말하기 · 과제 3개</h2><p class="d13">목표 표현을 넣어 말해 보세요. 아래 버튼을 누른 채로 말하고, 다 말하면 손을 떼요.</p></div>' +
    '<div class="qtop tight"><span class="qn">과제 ' + (i + 1) + ' / 3</span>' + dots + '</div>' + nav +
    '<section class="card tight" data-sk="scard"><p class="sit">' + t.ko + '</p><p class="cap mt8">목표 표현</p>' + chips + alert + result + '</section>' + foot;
}

/* ════════ 종료 카드 · 이어 말하기 · 없음 ════════ */
function usedMissed() {
  var used = [], missed = [];
  SPK.forEach(function (t, i) {
    var r = S.spk.res[i];
    t.tg.forEach(function (g, k) {
      var hit = r && r.hits[k];
      var list = hit ? used : missed;
      if (!list.some(function (x) { return x.ja === g.ja; })) list.push(g);
    });
  });
  missed = missed.filter(function (g) { return !used.some(function (u) { return u.ja === g.ja; }); });
  return { used: used, missed: missed };
}
/* 복습 종료 카드의 "다음 복습" — 판단 대기 · 선생님 판단 · 판단 실패(지난 간격) */
function nextReviewCard() {

}
function syncTop() {
  Array.prototype.forEach.call(document.querySelectorAll('#d-w button'), function (b) {
    var v = b.getAttribute('data-w');
    b.setAttribute('aria-pressed', v === 'all' ? S.triple : (!S.triple && +v === S.w));
    if (v === 'all') { if (isCompare()) b.setAttribute('aria-disabled', 'true'); else b.removeAttribute('aria-disabled'); }
  });
  Array.prototype.forEach.call(document.querySelectorAll('#d-f button'), function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-f') === S.fit); });
  Array.prototype.forEach.call(document.querySelectorAll('#d-h button'), function (b) { b.setAttribute('aria-pressed', +b.getAttribute('data-h') === S.h); });
}

/* ════════ 이벤트 ════════ */
document.addEventListener('click', function (e) {
  var nv = e.target.closest('[data-nav]');
  if (nv) { if (narrow()) navOpen = false; go(nv.getAttribute('data-nav')); if (narrow()) stageEl.scrollIntoView({ block: 'start' }); return; }
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var fr = el.closest('[data-frame]'); if (fr) lastFrame = +fr.getAttribute('data-frame');
  var act = el.getAttribute('data-act');
  if (act !== 'sheet-bg' && el.getAttribute('aria-disabled') === 'true') { var why = el.getAttribute('data-why'); if (why) toast(why); return; }
  var fn = ACT[act]; if (fn) fn(el.getAttribute('data-arg'), el, e);
});
document.addEventListener('change', function (e) {
  var r = e.target.closest('[data-dec]');
  if (!r) return;
  S.dec[r.getAttribute('data-dec')] = r.value; stopPlay(); render();
});
document.addEventListener('input', function (e) {
  var t = e.target, k = t.getAttribute && t.getAttribute('data-inp');
  if (!k) return;
  if (k === 'app') {
    S.app.text[S.app.i] = t.value;
    var n = cpLen(t.value);
    Array.prototype.forEach.call(document.querySelectorAll('[data-live="acount"]'), function (x) { x.textContent = n + ' / 200자'; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-k="acmp"]'), function (b) { if (n) { b.removeAttribute('aria-disabled'); } else { b.setAttribute('aria-disabled', 'true'); b.setAttribute('data-why', '먼저 문장을 써 보세요'); } });
  } else if (k === 'spk') {
    S.spk.draft = t.value;
  }
});
document.addEventListener('keydown', function (e) {
  var t = e.target;
  if (e.key === 'Enter' && t.getAttribute && t.getAttribute('data-memo') !== null && !e.isComposing) {
    e.preventDefault(); var fr = t.closest('[data-frame]'); if (fr) lastFrame = +fr.getAttribute('data-frame');
    addMemo(+t.getAttribute('data-memo'), fr); return;
  }
  if (e.key === 'Enter' && !e.shiftKey && t.getAttribute && t.getAttribute('data-inp') === 'spk' && !e.isComposing) { e.preventDefault(); ACT['spk-send'](); return; }
  if ((e.key === ' ' || e.key === 'Enter') && t.hasAttribute && t.hasAttribute('data-ptt') && !e.repeat) { e.preventDefault(); pttDown(); return; }
  if (e.key === 'Escape' && S.sheet) { ACT['sheet-close'](); }
});
document.addEventListener('keyup', function (e) {
  if ((e.key === ' ' || e.key === 'Enter') && e.target.hasAttribute && e.target.hasAttribute('data-ptt')) pttUp();
});
document.addEventListener('pointerdown', function (e) {
  var b = e.target.closest('[data-ptt]');
  if (!b || b.disabled || e.button !== 0 || !e.isPrimary) return;
  var fr = b.closest('[data-frame]'); if (fr) lastFrame = +fr.getAttribute('data-frame');
  e.preventDefault();
  try { b.setPointerCapture(e.pointerId); } catch (x) { /* 무시 */ }
  pttDown();
});
document.addEventListener('pointerup', function () { pttUp(); });
document.addEventListener('pointercancel', function () {
  if (S.ptt === 'recording') { clearInterval(timers.rec); S.ptt = 'idle'; S.hint = '녹음이 중간에 멈췄어요. 다시 눌러 주세요.'; render(); }
});
document.addEventListener('contextmenu', function (e) { if (e.target.closest('[data-ptt]')) e.preventDefault(); });

document.getElementById('d-w').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  var v = b.getAttribute('data-w');
  if (v === 'all' && isCompare()) { dtoast('비교 화면은 한 폭으로 보여요'); return; }
  if (v === 'all') S.triple = !S.triple; else { S.triple = false; S.w = +v; }
  render();
});
document.getElementById('d-f').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; S.fit = b.getAttribute('data-f'); render(); });
var rsz = null;
window.addEventListener('resize', function () { clearTimeout(rsz); rsz = setTimeout(applyScale, 120); });
document.getElementById('d-h').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; S.h = +b.getAttribute('data-h'); render(); });
document.getElementById('d-t').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  var v = b.getAttribute('data-t');
  if (v === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', v);
  Array.prototype.forEach.call(document.querySelectorAll('#d-t button'), function (x) { x.setAttribute('aria-pressed', x === b); });
});
document.getElementById('d-reset').addEventListener('click', function () { go('home-compare'); });

/* 시작: 주소 #<id> 가 있으면 그 상태로(QA·가이드 인용용) */
var start = (location.hash || '').replace('#', '');
var known = false; PRESETS.forEach(function (g) { g[1].forEach(function (p) { if (p[0] === start) known = true; }); });
go(known ? start : 'home-compare');
})();
</script>
