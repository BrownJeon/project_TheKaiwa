function syncLay() { Array.prototype.forEach.call(document.querySelectorAll('#d-lay button'), function (b) { b.setAttribute('aria-pressed', String(!!S[b.getAttribute('data-k')])); }); }
function setLayer(k, v) {
  S[k] = v;
  if (k === 'tr') S.to = {};
  syncLay();
  toast(TOASTS[k][v ? 1 : 0]);
  render();
}
function seg(id, fn) {
  document.getElementById(id).addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (b) fn(b);
  });
}
seg('d-w', function (b) { S.w = +b.getAttribute('data-v'); syncSeg('d-w', 'data-v', S.w); render(); });
seg('d-h', function (b) { S.h = +b.getAttribute('data-v'); syncSeg('d-h', 'data-v', S.h); render(); });
seg('d-view', function (b) { S.view = b.getAttribute('data-v'); syncSeg('d-view', 'data-v', S.view); render(); });
seg('d-lay', function (b) { var k = b.getAttribute('data-k'); setLayer(k, !S[k]); });
seg('d-mark', function (b) { S.mark = b.getAttribute('data-v') === 'on'; syncSeg('d-mark', 'data-v', S.mark ? 'on' : 'off'); render(); });
seg('d-t', function (b) {
  S.theme = b.getAttribute('data-v'); syncSeg('d-t', 'data-v', S.theme);
  if (S.theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', S.theme);
  render();
});
document.getElementById('d-reset').addEventListener('click', function () { S.open = {}; S.st = {}; S.to = {}; S.reveal = false; lastKey = ''; toast('데모를 처음 상태로 되돌렸어요'); render(); });

document.getElementById('decide').addEventListener('change', function (e) {
  var t = e.target;
  if (!t || !t.getAttribute('data-dq')) return;
  var id = t.getAttribute('data-dq');
  S.dec[id] = t.value;
  if (id === 'd2') S.open = {};
  render();
  var back = document.querySelector('#decide input[data-dq="' + id + '"][value="' + t.value + '"]');
  if (back) back.focus({ preventScroll: true });
});

document.getElementById('stage').addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var act = el.getAttribute('data-act'), k = el.getAttribute('data-k');
  switch (act) {
    case 'xn': S.open[k] = !isOpen(k); render(); break;
    case 'tg': setLayer(k, !S[k]); break;
    case 'tr1': { var id = el.getAttribute('data-id'), m = M[id]; S.to[id] = !trShown(m); render(); break; }
    case 'acc': S.st[k] = 'ACCEPTED'; toast('채택했어요 · 단어장에 넣는 시트는 지금과 같아 데모에선 건너뛰어요'); render('xn:' + k); break;
    case 'rej': S.st[k] = 'REJECTED'; toast('무시했어요 · 기록에 남지 않아요'); render('xn:' + k); break;
    case 'reveal': S.reveal = true; render('xn:talk-coach-e2'); break;
    case 'gsheet': location.hash = '#chip-sheet'; break;
    case 'later': location.hash = '#talk-later'; break;
    case 'close':
      if (S.scr === 'talk-later') location.hash = '#talk';
      else if (S.scr === 'chip-sheet') location.hash = '#chip';
      break;
    default: break;
  }
});
function onHash() {
  var h = (location.hash || '').slice(1);
  if (IDS.indexOf(h) >= 0) {
    S.scr = h;
    render();
    var stg = document.getElementById('stage'), r = stg.getBoundingClientRect();
    if (r.top < 0 || r.top > window.innerHeight * 0.6) stg.scrollIntoView({ block: 'start' });
  }
}
window.addEventListener('hashchange', onHash);

document.getElementById('devbody').innerHTML = devHtml();
if (IDS.indexOf((location.hash || '').slice(1)) >= 0) S.scr = location.hash.slice(1);
render();
})();
</script>
</body>
</html>
