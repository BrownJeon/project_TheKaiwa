}

/* 틀 배치: 휴대폰은 실제 CSS 폭·높이로 배치하고, 자리가 모자라면 같은 배율(--s)로 통째 축소.

.dtoast { position: fixed; left: 50%; bottom: 24px; z-index: 90; transform: translateX(-50%); max-width: calc(100vw - 32px); background: var(--ink); color: var(--surface); border-radius: 12px; padding: 10px 14px; font-size: 13px; box-shadow: 0 6px 18px rgba(0,0,0,.2); }

function verdict() {
  if (S.res.v) return S.res.v;
  var sc = scen(S.rp.id), n = userTurns();
  return { tAch: S.rp.tEnd || n >= 4, comm: n >= 2, used: sc.ex.filter(function (e) { return S.rp.used[e.id]; }).map(function (e) { return e.id; }),
    turns: n, hints: S.rp.hints, self: S.rp.selfFix };
}
function resScreen() {
  var sc = scen(S.rp.id), t = topic(sc.t);
  var head = bar('오늘로', 'go-today', '역할극 결과', t.title + ' · 9월 28일');
  var body;
  if (S.res.state === 'loading') {
    body = '<div class="gen-hero"><span class="spin" aria-hidden="true"></span><h2>선생님이 결과를 정리하고 있어요</h2><p class="d14" role="status">대화에서 목표를 이뤘는지, 어떤 표현을 썼는지 보고 있어요.</p><p class="cap">보통 몇 초면 끝나요</p></div>';
  } else if (S.res.state === 'fail') {
    body = '<div class="gen-hero"><span class="gi bad" aria-hidden="true">!</span><h2>결과를 기록하지 못했어요</h2><p class="d14">대화는 저장돼 있어요. 다시 시도하면 결과를 정리해 기록해요.</p><p class="cap">여러 번 눌러도 기록은 한 번만 남아요.</p></div>' +
      '<div><button type="button" class="btn primary full" data-act="res-retry" data-k="rs-retry">다시 시도</button><button type="button" class="btn ghost full mt8" data-act="go-today" data-k="rs-later">나중에 하기 · 오늘로</button>' +

  } else {
    var v = verdict(), used = v.used.length, n = sc.ex.length;

      '<li><span class="vk">핵심 표현</span><span class="vv' + (exprOK ? ' g' : '') + '">' + used + '/' + n + ' · ' + sc.req + '개 이상' + (exprOK ? ' ✓' : ' 필요') + '</span></li></ul>';

  'res': ['결과 카드', ['제목은 결정 (d): A = 선생님 판단 + 핵심 표현 조건을 둘 다 채워야 “목표를 달성했어요”, 선생님만 달성이면 “거의 다 왔어요”.', '판정 카드 한 장: 선생님 판단 · 뜻 전달 · 핵심 표현(N/4 · 2개 이상) → 쓴 표현 ✓ / 다음엔 써 볼 표현 → 한 줄 요약(내 말·힌트·스스로 고침).', '그 아래 “다음 상황” 예고 카드 → [다시 해 보기] · [오늘로]. 아직이면 [다시 해 보기]가 주 버튼이 돼요.', '기록 문장은 반복 학습(3~7일 안에 다시 권함)과 이어져요.']],
  'res-state': ['결과 정리 중 · 기록 실패', ['정리 중: 도는 표시 + “보통 몇 초면 끝나요”.', '기록 실패: 대화는 남아 있다고 먼저 알리고 [다시 시도] · [나중에 하기 · 오늘로]. 여러 번 눌러도 기록은 한 번만 남아요.']],
  'end-compare': ['수업 종료 카드 · 현재 vs 제안', ['바뀌는 곳은 한 군데: “다음 시간엔” 아래에 역할극 추천 카드 1개(검정 딱지 “제안에서 추가”는 설명용 표시).', '추천 = 이 주제의 상황 중 1개(오늘 배운 표현이 핵심 표현에 들어 있는 것). [역할극 해 보기] → 상황 확인 시트 → 수업과 이어진 역할극.', '주 버튼([다음 수업 만들기])은 그대로 두고 추천 버튼은 한 단계 약한 모양이에요. 자리는 첫 화면 아래, 승인된 [이어서 말하기] 바로 위예요.']],
  'lesson-end': ['수업 종료 카드 · 역할극 추천', ['[역할극 해 보기]를 누르면 상황 확인 시트가 열리고, 시작하면 회화방 첫 줄에 “오늘 수업에서 이어져요”가 붙어요.', '자유 회화 버튼(이 주제로 선생님과 이어서 말하기)은 그대로예요.']]
};
var DECS = [
  { k: 'a', t: '(a) 역할극 중 목표 카드', see: 'rp-mid', rec: 'B',
    A: ['늘 펼침', '역할·조건·표현을 대화 내내 펼쳐 둬요(직접 접을 수는 있어요).', ['목표를 계속 보면서 말해요'], ['대화 자리가 줄어요(780 높이에서 말풍선 자리 약 340px)', '말풍선보다 카드를 더 보게 돼요']],
    B: ['첫 마디 뒤 자동 접힘', '시작할 땐 펼쳐 있고, 내가 첫 마디를 하면 한 줄(목표 + 표현 2/4)로 접혀요. 누르면 다시 펼쳐요.', ['대화 자리가 넓어요(약 550px)', '한 줄에 목표와 진행이 남아요'], ['조건을 다시 보려면 한 번 눌러야 해요']] },
  { k: 'b', t: '(b) 진행 중 핵심 표현 체크', see: 'rp-mid', rec: 'A',
    A: ['보이기(숨길 수 있음)', '쓴 표현에 바로 ✓, 내 말풍선 아래에도 “✓ 썼어요”. 카드 안 버튼으로 숨길 수 있어요.', ['무엇을 더 써야 할지 바로 알아요', '표현 조건(2개 이상)을 채우기 쉬워요'], ['표현 채우기에 신경 쓰느라 대화가 딱딱해질 수 있어요']],
    B: ['숨기기(끝나고만 공개)', '진행 중엔 표현 목록만 보이고 ✓는 결과 카드에서 처음 보여요.', ['실제 대화처럼 자연스럽게 말해요'], ['조건을 채웠는지 몰라 “아직”이 늘 수 있어요']] },
  { k: 'c', t: '(c) 역할극 마치기', see: 'rp-teacher-end', rec: 'B',
    A: ['학습자만', '선생님은 제안하지 않아요. 언제나 [마치기]를 눌러 끝내요.', ['끝낼 때를 내가 정해요'], ['목표를 이룬 뒤에도 대화가 늘어지기 쉬워요', '언제 끝내면 되는지 초급자가 헷갈려요']],
    B: ['선생님도 마무리 제안', '선생님이 목표를 이뤘다고 보면 역할 대사로 마무리하고 [마치고 결과 보기]·[조금 더 하기] 띠가 떠요. [마치기]는 늘 있어요.', ['끝낼 때를 알기 쉬워요', '다음 상황 예고로 자연스럽게 넘어가요'], ['판단이 이르면 [조금 더 하기]를 한 번 눌러야 해요']] },
  { k: 'd', t: '(d) 결과 제목 — 두 판정이 다를 때', see: 'res-almost', rec: 'A',
    A: ['둘 다 채워야 “달성”', '선생님 판단과 핵심 표현 조건을 모두 채워야 “목표를 달성했어요”. 선생님만 달성이면 “거의 다 왔어요”.', ['제목과 기록(반복 학습)이 같아요', '표현을 더 써 보게 이끌어요'], ['대화가 통했는데 제목이 한 단계 낮아요']],
    B: ['선생님 판단이 제목', '선생님이 달성이라고 하면 “목표를 달성했어요”, 표현 부족은 아래 한 줄로만 알려요.', ['대화가 통한 기분을 살려요'], ['제목은 “달성”인데 기록은 “아직”이라 다음 추천과 어긋나 보여요']] },
  { k: 'e', t: '(e) 주제 시트 안 순서', see: 'topic-sheet', rec: 'A',
    A: ['수업 먼저', '설명 → [수업 만들기] → 상황 역할극 목록 → 표현 12개(접힘).', ['배우고 → 써 보는 순서', '지금 시트의 [수업 만들기]가 먼저인 흐름 그대로'], ['360×780 에서 상황 첫 행이 첫 화면 끝에 걸려요(시트를 올려야 다 보여요)']],
    B: ['상황 먼저', '설명 → 상황 역할극 목록 → [수업 만들기] → 표현 12개(접힘).', ['역할극을 자주 하는 사람은 바로 골라요'], ['[수업 만들기] 자리가 바뀌어요', '수업 없이 역할극부터 하면 어려울 수 있어요']] }
];
function sideDemoActs() {
  var b = function (act, label) { return '<button type="button" class="dbtn" data-act="' + act + '">' + label + '</button>'; };
  var acts = [];
  if (S.view === 'rp' || (S.sheet === 'sc')) acts.push(b('d-tts', S.tts === 'ONLINE' ? '선생님 목소리 → 자막만' : '선생님 목소리 → 온라인'));
  if (S.sheet === 'sc') acts.push(b('d-start-fail', '다음 시작 1회 실패'));
  if (S.view === 'rp' && S.rp.lstate === 'ok') {
    acts.push(b('d-say', '다음 말 하기(대본)'));
    acts.push(b('d-mic-denied', S.sttErr ? '마이크 허용으로' : '마이크 막힘'), b('d-stt-empty', S.forceEmpty ? '인식 정상으로' : '다음 인식 빈 결과'), b('d-send-fail', '다음 보내기 1회 실패'), b('d-done-fail', '결과 기록 1회 실패'));
  }
  if (!acts.length) return '';
  return '<section class="dcard"><h2>시연 조작 <span class="dsub">(휴대폰 밖 · 실제 화면에는 없어요)</span></h2><div class="dacts">' + acts.join('') + '</div></section>';
}
function renderSide() {
  var n = NOTES[noteKey()] || NOTES.topics;
  var decs = DECS.map(function (d) {
    var opt = function (k) {
      var o = d[k], on = S.dec[d.k] === k, rec = d.rec === k;
      return '<label class="opt' + (rec ? ' rec' : '') + (on ? ' on' : '') + '"><input type="radio" name="dec-' + d.k + '" value="' + k + '" data-dec="' + d.k + '"' + (on ? ' checked' : '') + '>' +
        '<span class="opt-h">' + k + ' · ' + o[0] + (rec ? ' ' + badge('good', 'designer 권고') : '') + '</span><span class="opt-d">' + o[1] + '</span><ul>' +
        o[2].map(function (x) { return '<li class="p">' + x + '</li>'; }).join('') + o[3].map(function (x) { return '<li class="m">' + x + '</li>'; }).join('') + '</ul><span class="sel">' + (on ? '● 데모에 적용 중' : '○ 눌러서 데모에 적용') + '</span></label>';
    };
    return '<article class="dec"><h3>' + d.t + '</h3><div class="dec-g">' + opt('A') + opt('B') + '</div><button type="button" class="dlink" data-nav="' + d.see + '">이 결정이 보이는 화면 열기 ›</button></article>';
  }).join('');
  sideEl.innerHTML = '<section class="dcard"><h2>이 화면</h2><p class="dk">' + n[0] + '</p><ul class="dn">' + n[1].map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul></section>' +
    sideDemoActs() +
    '<section class="dcard decs"><h2>결정 필요 — 5가지</h2><p class="dsub">권고는 designer 판단이에요. 고르면 데모가 바로 바뀌어요(미리 보기용). 결정은 대화로 알려 주세요.</p>' + decs + '</section>';
}
function syncTop() {
  Array.prototype.forEach.call(document.querySelectorAll('#d-w button'), function (b) {
    var v = b.getAttribute('data-w');
    b.setAttribute('aria-pressed', v === 'all' ? S.triple : (!S.triple && +v === S.w));
    if (v === 'all') { if (S.view === 'compare') b.setAttribute('aria-disabled', 'true'); else b.removeAttribute('aria-disabled'); }
  });
  Array.prototype.forEach.call(document.querySelectorAll('#d-f button'), function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-f') === S.fit); });
  Array.prototype.forEach.call(document.querySelectorAll('#d-h button'), function (b) { b.setAttribute('aria-pressed', +b.getAttribute('data-h') === S.h); });
}

/* ════════ 이벤트 ════════ */
document.addEventListener('click', function (e) {
  var nv = e.target.closest('[data-nav]');
  if (nv) { if (narrow()) navOpen = false; go(nv.getAttribute('data-nav')); if (narrow()) stageEl.scrollIntoView({ block: 'start' }); return; }
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var fr = el.closest('[data-frame]'); if (fr) lastFrame = +fr.getAttribute('data-frame');
  var act = el.getAttribute('data-act');
  if (act !== 'sheet-bg' && el.getAttribute('aria-disabled') === 'true') { var why = el.getAttribute('data-why'); if (why) toast(why); return; }
  var fn = ACT[act]; if (fn) fn(el.getAttribute('data-arg'), el, e);
});
document.addEventListener('change', function (e) {
  var r = e.target.closest('[data-dec]');
  if (!r) return;
  S.dec[r.getAttribute('data-dec')] = r.value; render();
});
document.addEventListener('input', function (e) {
  var t = e.target, k = t.getAttribute && t.getAttribute('data-inp');
  if (k === 'rp') S.rp.draft = t.value;
});
document.addEventListener('keydown', function (e) {
  var t = e.target;
  if (e.key === 'Enter' && !e.shiftKey && t.getAttribute && t.getAttribute('data-inp') === 'rp' && !e.isComposing) { e.preventDefault(); ACT['rp-send'](); return; }
  if ((e.key === ' ' || e.key === 'Enter') && t.hasAttribute && t.hasAttribute('data-ptt') && !e.repeat) { e.preventDefault(); pttDown(); return; }
  if (e.key === 'Escape' && S.sheet) { ACT['sheet-close'](); }
});
document.addEventListener('keyup', function (e) {
  if ((e.key === ' ' || e.key === 'Enter') && e.target.hasAttribute && e.target.hasAttribute('data-ptt')) pttUp();
});
document.addEventListener('pointerdown', function (e) {
  var b = e.target.closest('[data-ptt]');
  if (!b || b.disabled || e.button !== 0 || !e.isPrimary) return;
  var fr = b.closest('[data-frame]'); if (fr) lastFrame = +fr.getAttribute('data-frame');
  e.preventDefault();
  try { b.setPointerCapture(e.pointerId); } catch (x) { /* 무시 */ }
  pttDown();
});
document.addEventListener('pointerup', function () { pttUp(); });
document.addEventListener('pointercancel', function () {
  if (S.ptt === 'recording') { clearInterval(timers.rec); S.ptt = 'idle'; S.hint = '녹음이 중간에 멈췄어요. 다시 눌러 주세요.'; render(); }
});
document.addEventListener('contextmenu', function (e) { if (e.target.closest('[data-ptt]')) e.preventDefault(); });

document.getElementById('d-w').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  var v = b.getAttribute('data-w');
  if (v === 'all' && S.view === 'compare') { dtoast('비교 화면은 한 폭으로 보여요'); return; }
  if (v === 'all') S.triple = !S.triple; else { S.triple = false; S.w = +v; }
  render();
});
document.getElementById('d-f').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; S.fit = b.getAttribute('data-f'); render(); });
var rsz = null;
window.addEventListener('resize', function () { clearTimeout(rsz); rsz = setTimeout(applyScale, 120); });
document.getElementById('d-h').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; S.h = +b.getAttribute('data-h'); render(); });
document.getElementById('d-t').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  var v = b.getAttribute('data-t');
  if (v === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', v);
  Array.prototype.forEach.call(document.querySelectorAll('#d-t button'), function (x) { x.setAttribute('aria-pressed', x === b); });
});
document.getElementById('d-reset').addEventListener('click', function () { go('topics-compare'); });

/* 시작: 주소 #<id> 가 있으면 그 상태로(QA·가이드 인용용) */
var start = (location.hash || '').replace('#', '');
var known = false; PRESETS.forEach(function (g) { g[1].forEach(function (p) { if (p[0] === start) known = true; }); });
go(known ? start : 'topics-compare');
})();
</script>
</body>
</html>
