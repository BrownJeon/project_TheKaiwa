/* 토큰: src/app/globals.css 값을 그대로 고정(링크하지 않음). 새 색 없음 */
:root {

  --ground: #f6f7f4; --surface: #ffffff; --surface2: #eef0ea;
  --ink: #1e2420; --ink2: #5a6359; --ink3: #8b948a; --line: #dde2d9;

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #141816; --surface: #1d2320; --surface2: #262d29;
    --ink: #ecefe9; --ink2: #aeb6ac; --ink3: #7e877d; --line: #333b36;
    --accent: #f06a45; --accent-soft: #3a241e; --on-accent: #1a0e0a;
    --good: #7fb27a; --good-soft: #223121; --warn: #e0a93a; --warn-soft: #3a2f14;
    --bad: #f28b82; --bad-soft: #3d1f1d;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #141816; --surface: #1d2320; --surface2: #262d29;
  --ink: #ecefe9; --ink2: #aeb6ac; --ink3: #7e877d; --line: #333b36;
  --accent: #f06a45; --accent-soft: #3a241e; --on-accent: #1a0e0a;

:root[data-theme="light"] { color-scheme: light; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--ground); color: var(--ink);

}

/* ── 데모 틀(휴대폰 밖) ── */

.dtbl th, .dtbl td { text-align: left; vertical-align: top; padding: 6px 6px; border-top: 1px solid var(--line); }

.dpanel > h2, .dpanel > summary { font-size: 18px; font-weight: 700; text-wrap: balance; }

.dsumc { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; font-weight: 500; }

.opt { display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--line); border-radius: 12px; padding: 12px; cursor: pointer; background: var(--surface); position: relative; min-width: 0; }

.dex { margin-top: 4px; border-radius: 10px; background: var(--surface2); padding: 10px; font-size: 12.5px; }
.dex b { font-weight: 700; }
.dsum { margin-top: 14px; border-radius: 12px; background: var(--surface2); padding: 10px 12px; font-size: 13px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.dsum button { min-height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 0 12px; font-size: 12.5px; font-weight: 600; }

@media (max-width: 1280px) { .dlay { grid-template-columns: 200px minmax(0, 1fr); } .dside { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; } }
@media (max-width: 760px) {
  .dlay { grid-template-columns: minmax(0, 1fr); gap: 12px; padding: 12px 16px; }
  .dnav { position: static; max-height: none; }
  .dside { grid-template-columns: minmax(0, 1fr); }
  .dtop { position: static; flex-direction: column; align-items: stretch; flex-wrap: nowrap; gap: 6px; padding: 8px 16px; }

  .dctls::-webkit-scrollbar { display: none; }
  .dvar { flex-direction: column; gap: 4px; }
  .dpanel { margin: 4px 12px 24px; padding: 14px; }
  .dstage { justify-content: flex-start; overflow-x: auto; flex-wrap: nowrap; padding-bottom: 6px; }
}

/* ── 휴대폰 프레임 ── */

/* AppBar · BackBar · TabBar */

.appbar h1 { flex: 1; min-width: 0; font-size: 20px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; outline: none; }
.me { width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: none; border-radius: 50%; flex: none; }
.me span { width: 32px; height: 32px; border-radius: 50%; background: var(--good); color: #fff; font-size: 13px; font-weight: 600; display: grid; place-items: center; }
.bb { height: 52px; flex: none; display: flex; align-items: center; gap: 4px; min-width: 0; border-bottom: 1px solid var(--line); background: var(--surface); padding: 0 4px; }

.tab[aria-current="page"] { color: var(--accent); font-weight: 600; }

.cell { position: relative; height: 66px; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; border-radius: 10px; border: 1px solid transparent; padding: 6px 0 0; background: none; color: var(--ink); font: inherit; }

.mk { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; width: 37px; }

.adot { display: block; width: 9px; height: 9px; flex: none; border-radius: 50%; border: 1.5px solid var(--ink2); margin-top: 7px; }

.mnote { margin-top: 12px; border-radius: 12px; background: var(--surface2); padding: 12px 14px; font-size: 13px; }

.lg { display: grid; grid-template-columns: 30px minmax(0, 1fr) 44px; align-items: center; gap: 10px; min-height: 64px; padding: 8px 0; border-top: 1px solid var(--line); }

/* ── 챌린지 공통 — 하루 상태(달성 ✓ · 일부 ◐ · 놓침 ✕ · 오늘 · 예정): 글자·모양·색을 함께 ── */
.g { display: grid; place-items: center; border-radius: 50%; font-weight: 700; line-height: 1; flex: none; }

.g.end { background: var(--surface2); color: var(--ink2); }
.ch-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; margin-top: -10px; }

.ch-t { font-size: 17px; font-weight: 700; line-height: 1.35; overflow-wrap: anywhere; }
.ch-s { margin-top: 2px; font-size: 13px; color: var(--ink2); overflow-wrap: anywhere; }
.pips { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-top: 12px; }
.pip { height: 32px; border-radius: 9px; font-size: 14px; }

.h3s { margin-top: 14px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-size: 14px; font-weight: 700; }
.h3s span { font-size: 12.5px; font-weight: 600; color: var(--ink2); }
.tasks { margin-top: 8px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.task { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 56px; padding: 8px 12px; color: var(--ink); text-decoration: none; background: none; border: 0; width: 100%; text-align: left; }
li + li > .task { border-top: 1px solid var(--line); }
.tk { width: 26px; height: 26px; font-size: 13px; }
.tk.todo { box-shadow: inset 0 0 0 1.5px var(--ink3); color: var(--ink2); background: var(--surface); border-radius: 50%; display: grid; place-items: center; }

.tk.wait { color: var(--ink2); display: grid; place-items: center; }
.tt { min-width: 0; }
.tt b { display: block; font-size: 14.5px; font-weight: 600; line-height: 1.35; }
.tt span { display: block; font-size: 12.5px; color: var(--ink2); line-height: 1.4; overflow-wrap: anywhere; }
.go { font-size: 13px; font-weight: 600; white-space: nowrap; color: var(--ink); }

.st2, .st3 { display: grid; gap: 8px; margin-top: 10px; }
.st2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.st3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.stt { min-width: 0; border-radius: 12px; background: var(--surface2); padding: 10px 12px; }
.card.flat .stt, .stt.on { background: var(--surface); }
.stt b { display: block; font-size: 22px; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
.stt .l { display: block; font-size: 12.5px; font-weight: 600; margin-top: 2px; }
.stt .s { display: block; font-size: 12px; color: var(--ink2); }
.st3 .stt { padding: 10px 8px; }
.st3 .stt b { font-size: 20px; }
.gm { display: flex; align-items: center; gap: 10px; border-radius: 12px; padding: 10px 12px; background: var(--good-soft); color: var(--ink); min-width: 0; }
.gm .g { width: 28px; height: 28px; font-size: 14px; }
.gm .g.solid { background: var(--good); color: var(--surface); }

.gm.part { background: var(--surface2); }
.note1 { margin-top: 8px; font-size: 12px; color: var(--ink2); }

/* 상세(S4) */
.strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 10px; }
.sday { position: relative; min-width: 0; min-height: 78px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 3px; padding: 6px 0; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; }

.slg { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--ink2); }
.slg li { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }

.xcs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.xc { display: inline-flex; align-items: baseline; flex-wrap: wrap; gap: 0 6px; max-width: 100%; min-width: 0; border-radius: 10px; background: var(--surface2); padding: 5px 10px; }
.xc [lang="ja"] { font-size: 16px; overflow-wrap: anywhere; }
.xc .fu { line-height: 2.1; }
.xc .m { font-size: 12px; color: var(--ink2); }
.xc .xs { font-size: 12px; font-weight: 700; }

.xc.new { background: transparent; border: 1.5px dashed var(--ink3); padding: 3.5px 8.5px; }
.xlg { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--ink2); }
details.more > summary { display: flex; min-height: 44px; align-items: center; gap: 6px; cursor: pointer; font-size: 13.5px; font-weight: 600; list-style: none; }

.cbar { position: relative; width: 13px; border-radius: 3px 3px 0 0; }

.cbar.wd { background: var(--surface); box-shadow: inset 0 0 0 2px var(--ink2); }
.cbar i { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); margin-bottom: 2px; font-style: normal; font-size: 11px; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }

.cx { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 4px; }
.cx span { text-align: center; font-size: 11px; color: var(--ink2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.clg { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink2); }
.clg li { display: inline-flex; align-items: center; gap: 6px; }

/* 만들기(S3) */

.stp.done .c { background: var(--good-soft); color: var(--good); }
.stp.cur .c { background: var(--accent); color: var(--on-accent); }
.stp.cur { color: var(--ink); font-weight: 700; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }

.ropts { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }

/* 덱(S7) */

  var sum = '<div class="dsum"><span>지금 고른 안: ' + DEC.map(function (q) { return q.u + ' ' + codeOf(q); }).join(' · ') + '</span><button type="button" data-act-top="resetDec">권고안으로 되돌리기</button></div>';
  var ref = '<div class="dref"><h3 style="font-size:15px;font-weight:700">화면에 안 나오는 결정</h3><ul class="mt4">' +
    '<li><b>DB 변경은 데모와 따로 여쭤봐요.</b> 챌린지를 저장하려면 DB 에 <b>추가만</b> 하는 변경이 필요해요(기존 데이터는 그대로). 데모를 승인하셔도 DB 변경은 따로 승인받아요. — 데이터 모델 · DB 변경 범위 · 수행 현황 계산 방식(U1 · U2 · U7)은 설계서 §3 · §6 · §11-6.</li>' +
    '<li><b>U6</b> 상황 역할극과 나누는 범위 — 상황 역할극은 <b>서버 · 문서 준비를 지금</b> 하고, <b>선생님 대화 지시(프롬프트)는 지금 진행 중인 선생님 말투 개선 작업이 끝난 뒤</b> 해요. 화면은 장소 · 상황 카드 캡처를 받은 뒤예요. 이 데모는 상황 카드를 그리지 않아요(만들기에 “준비 중” 자리도 없음).</li></ul></div>';
  $('#dec-body').innerHTML = body + sum + ref;
  $('#dec-sum').innerHTML = DEC.map(function (q) { return '<span' + (S.dec[q.id] !== REC[q.id] || (q.sub && S.dec[q.sub.id] !== REC[q.sub.id]) ? ' class="chg"' : '') + '>' + q.u + ' ' + codeOf(q) + '</span>'; }).join('');
  $('#d-jump').textContent = '결정 필요 ' + DEC.length + '건' + (changed.length ? ' · 바꾼 것 ' + changed.length : ''); $('#decide > summary > span').textContent = '결정 필요 ' + DEC.length + '건';
}

/* ════════ 동작 ════════ */
function go(target, opt) {
  opt = opt || {};
  var p = target.split('.');
  if (!VARS[p[0]]) return;
  S.scr = p[0];
  if (p[1] && varMeta(p[0], p[1])[0] === p[1]) S.v[p[0]] = p[1];
  S.sheet = null;
  /* 상태 목록 · 화면 목록 · 링크에서 고르면 기준 상태로(흐름 · dyn 초기화). 휴대폰 안 이동은 data-flow · data-dyn 으로 이어받음 */
  if (opt.top) { S.dyn = null; S.shortN = 1; S.cutSet = 'S'; }
  if (opt.dyn !== undefined) S.dyn = opt.dyn || null;
  S.flow = opt.flow !== undefined ? (opt.flow || null) : null;
  if (S.scr === 's7' && S.v.s7 === 'deck1') { S.sheet = { kind: 'finish', n: 1 }; S.ret = 'endb'; }
  if (S.scr === 's2' && S.v.s2 === 'sheet') { S.sheet = { kind: 'cal', d: '2026-10-05', w: 't0' }; S.ret = 'cal-2026-10-05'; }
  try { history.replaceState(null, '', '#' + S.scr + '.' + S.v[S.scr]); } catch (e) { /* 미리 보기에서 막히면 무시 */ }
  renderStage();
  if (opt.nofocus) return;
  var h = $('[data-main] .sheet h2') || $('[data-main] h1');
  if (h) h.focus({ preventScroll: true });
}
function go6(k, opt) { var n = norm(k), c = CANON6[n]; go('s6.' + (c || 'todo'), { dyn: c ? '' : n, nofocus: opt && opt.nofocus }); }
function pToast(msg) {
  var t = $('[data-main] .ptoast');
  if (!t) return dToast(msg);
  t.classList.remove('off'); t.textContent = '';
  setTimeout(function () { t.textContent = msg; }, 30);
  clearTimeout(pToast.tm); pToast.tm = setTimeout(function () { t.classList.add('off'); t.textContent = ''; }, 2600);
}
function dToast(msg) {
  var t = $('#dtoast'); t.hidden = false; t.textContent = msg;
  clearTimeout(dToast.tm); dToast.tm = setTimeout(function () { t.hidden = true; }, 2600);
}
function rerenderKeepFocus(sel) {
  renderStage();
  if (sel) { var el = $('[data-main] ' + sel); if (el) el.focus({ preventScroll: true }); }
}
function openSheet(sh, opener) {
  S.sheet = sh; S.ret = opener ? opener.getAttribute('data-fid') : null;
  renderStage();
  var h = $('[data-main] .sheet h2'); if (h) h.focus({ preventScroll: true });
}
function closeSheet() {
  var ret = S.ret;
  S.sheet = null; S.ret = null;
  if (S.scr === 's2' && S.v.s2 === 'sheet') S.v.s2 = 't0';
  if (S.scr === 's4' && /^(end|endfail|endbusy)$/.test(S.v.s4)) {
    S.v.s4 = S.dyn === 'twodone' ? 'two' : S.dyn === 'first' ? 'first' : 'normal';
    if (S.dyn === 'twodone' || S.dyn === 'first') S.dyn = null;
  }
  if (S.scr === 's5') { var b5 = S5MAP[S.v.s5] || S5MAP.met; S.scr = b5[2]; S.v[b5[2]] = b5[3]; if (b5[4]) S.dyn = b5[4]; }
  renderStage();
  if (ret) { var el = $('[data-main] [data-fid="' + ret + '"]'); if (el) el.focus({ preventScroll: true }); }
}
/* 지금 휴대폰이 보여 주는 오늘 상태(세계 키) */
function curWorld() {
  if (S.scr === 's6') return S.dyn || S6K[S.v.s6] || 't0';
  if (S.scr === 's4') return S.detK || 't0';
  if (S.scr === 's2') return S.dyn || (/^(sheet|loading|error)$/.test(S.v.s2) ? 't0' : S.v.s2);
  return 't0';
}
function act(a, el) {
  switch (a) {
    case 'noop': return pToast('데모 — 지금 화면 그대로 동작해요');
    case 'toast': return pToast(el.getAttribute('data-msg'));
    case 'go': return go(el.getAttribute('data-go'));
    case 'retry': return pToast('다시 불러와요 — 데모라 같은 상태예요');
    case 'closeSheet': if (el.getAttribute('aria-disabled') === 'true') return; return closeSheet();
    case 'openDay': return openSheet({ kind: 'cal', d: el.getAttribute('data-d'), w: el.getAttribute('data-w') }, el);
    case 'calStep': {
      if (el.getAttribute('aria-disabled') === 'true') return pToast('다음 날은 아직 오지 않았어요');
      var nd = addD(el.getAttribute('data-d'), Number(el.getAttribute('data-v')));
      if (nd < '2026-10-01') return pToast('이 달의 첫날이에요');
      if (S.v.s2 === 'sheet') S.v.s2 = 't0';
      S.sheet = { kind: 'cal', d: nd, w: el.getAttribute('data-w') };
      renderStage(); var hh = $('[data-main] .sheet h2'); if (hh) hh.focus({ preventScroll: true }); return;
    }
    case 'openChDay': {
      var i = Number(el.getAttribute('data-i')), src = el.getAttribute('data-src') || 't0';
      if (S.scr === 's1' || S.scr === 's2') {
        S.sheet = null;
        if (src === 'cafeEnded') { S.scr = 's8'; S.v.s8 = 'ended'; S.dyn = null; }
        else if (src === 'twodone') { S.scr = 's4'; S.v.s4 = 'two'; S.dyn = null; }
        else { S.scr = 's4'; S.v.s4 = 'normal'; S.dyn = src === 't0' || src === 'cur' ? null : src; }
        renderStage();
      }
      openSheet({ kind: 'ch', i: i, src: src }, el); return;
    }
    case 'chStep': {
      if (el.getAttribute('aria-disabled') === 'true') return pToast('챌린지 기간 밖이에요');
      var cur = S.sheet;
      if (S.scr === 's5') { var b = S5MAP[S.v.s5] || S5MAP.met; cur = { kind: 'ch', i: b[0], src: b[1] }; S.scr = b[2]; S.v[b[2]] = b[3]; if (b[4]) S.dyn = b[4]; }
      if (!cur) return;
      S.sheet = { kind: 'ch', i: cur.i + Number(el.getAttribute('data-v')), src: cur.src === 'gone' ? 't0' : cur.src };
      renderStage(); var h2 = $('[data-main] .sheet h2'); if (h2) h2.focus({ preventScroll: true }); return;
    }
    case 'openEnd': {
      if (S.detK && norm(S.detK) !== 't0') S.dyn = norm(S.detK);
      S.v.s4 = 'end'; S.ret = 'endbtn'; renderStage(); var eh = $('[data-main] .sheet h2'); if (eh) eh.focus({ preventScroll: true }); return;
    }
    case 'doEnd': {
      if (el.getAttribute('aria-disabled') === 'true') return;
      var ek = norm(S.detK || 't0');
      S.v.s4 = 'endbusy'; renderStage();
      setTimeout(function () {
        S.ret = null;
        if (ek === 't0') { go('s8.ended', { dyn: '' }); pToast('챌린지를 그만뒀어요 · 기록은 그대로 남아요'); }
        else { closeSheet(); pToast('데모는 기준 상태(4일째 아침)에서 그만둔 결과만 그렸어요'); }
      }, 900);
      return;
    }
    case 'f2tab': S.f2tab = el.getAttribute('data-v'); return rerenderKeepFocus('[role="tab"][aria-selected="true"]');
    case 's3next': {
      if (el.getAttribute('aria-disabled') === 'true') return pToast(S.v.s3 === 'c409' ? '진행 중인 챌린지가 있어요' : S.v.s3 === 'c404' ? '주제를 다시 골라 주세요' : S.v.s3 === 'over' ? '장수를 줄여 주세요' : S.v.s3 === 'c429' ? '내일 다시 만들어 주세요' : '하루 목표를 하나 이상 골라 주세요');
      var step = Number(el.getAttribute('data-step'));
      if (step < 4) return go('s3.step' + (step + 1));
      S.v.s3 = 'busy'; renderStage();
      var dest = S.s3.start === 'TOMORROW' ? 's2.tomorrow' : 's2.first';
      setTimeout(function () { go(dest, { dyn: '' }); pToast(S.s3.start === 'TOMORROW' ? '챌린지를 만들었어요 · 내일 시작해요' : '챌린지를 시작했어요 · 오늘 할 일부터 해 봐요'); }, 900);
      return;
    }
    case 's3count': {
      if (el.getAttribute('aria-disabled') === 'true') return pToast('이 주제 기본 표현이 12개라 ' + el.getAttribute('data-v') + '장은 고를 수 없어요');
      S.s3.count = Number(el.getAttribute('data-v')); return rerenderKeepFocus('[data-act="s3count"][aria-checked="true"]');
    }
    case 's3start': S.s3.start = el.getAttribute('data-v'); return rerenderKeepFocus('[data-act="s3start"][aria-checked="true"]');
    case 'startSet': if (el.getAttribute('aria-disabled') === 'true') return; return go('s7.deck', { flow: el.getAttribute('data-k') || 't0' });
    /* 덱에서 보기를 누르면 이 세트를 끝까지 푼 결과로(데모 단축) — 결과는 흐름(앞 상태)을 이어받는다 */
    case 'toResult': {
      var v7 = S.v.s7, fl = flowOf(v7);
      if (v7 === 'mid') return go('s7.resultmid', { flow: fl });
      if (v7 === 'deck2') return go('s7.result2', { flow: fl });
      if (v7 === 'few') return go('s7.resultmore', { flow: fl });
      return go(tasks(fl).L === 'DONE' ? 's7.result' : 's7.result1', { flow: fl });
    }
    case 'moreSet': {
      var mk = el.getAttribute('data-k'), MT = tasks(mk), mp = wk(mk), allSets = ((TW[mp.base] && TW[mp.base].sets) || '') + mp.extra;
      if (MT.W === 'SHORT') {
        if (allSets.indexOf('2') >= 0) return pToast('데모는 여기까지예요 — 새 세트를 만들어 오늘 합계에 더해요');
        return go('s7.deck2', { flow: mk });
      }
      if (MT.remain <= 0) return go('s7.alldone', { flow: mk });
      if ((mp.base === 'w1' || mp.base === 't2') && !mp.extra) return go('s7.few', { flow: mk });
      return pToast('데모는 여기까지예요 — 새 세트를 만들어 오늘 합계에 더해요(오늘 단어는 이미 완료)');
    }
    case 'toggleFu': P.fu = !P.fu; syncLay(); return rerenderKeepFocus('[data-act="toggleFu"]');
    case 'makeLesson': {
      /* 그날 단어 진행은 그대로 두고 회화만 ‘만드는 중’으로 */
      var ck = curWorld(), cp = wk(ck), sets = ((TW[cp.base] && TW[cp.base].sets) || '') + cp.extra;
      if (/^(first|firstpre|tomorrow|last)$/.test(cp.base)) return pToast('「카페 주문」 오늘 수업을 만들고 있어요 · 1분쯤 걸려요(만드는 중 화면은 4일째 상태로 그렸어요)');
      var gk = sets ? 'gen+' + sets : 'gen';
      var inS2 = S.scr === 's2' || S.scr === 's4';
      if (inS2) go(gk === 'gen' ? 's2.gen' : 's2.t0', { dyn: gk === 'gen' ? '' : gk, nofocus: true });
      else go6(gk, { nofocus: true });
      var f = $('[data-main] .card.sec .btn') || $('[data-main] a.task[data-go^="s6"]');
      if (f) f.focus({ preventScroll: true });
      return pToast('「카페 주문」 오늘 수업을 만들고 있어요 · 1분쯤 걸려요');
    }
    case 'openFinish': S.sheet = { kind: 'finish', n: Number(el.getAttribute('data-n')) }; S.ret = 'endb'; renderStage(); var fh = $('[data-main] .sheet h2'); if (fh) fh.focus({ preventScroll: true }); return;
    case 'confirmFinish': {
      var n0 = Number(el.getAttribute('data-n')), v7c = S.v.s7, flc = flowOf(v7c);
      if (v7c === 'mid') { S.sheet = null; renderStage(); return pToast('어제(3일째) 기록으로 남아요 · 데모 결과 화면은 끝까지 푼 경우만 그렸어요'); }
      if (n0 === 0) { go6(flc); return pToast('답한 카드가 없어 기록하지 않고 닫았어요'); }
      S.shortN = n0 === 2 ? 2 : 1; S.cutSet = v7c === 'few' ? 'g' : 'S';
      return go('s7.resultshort', { flow: flc });
    }
    case 'addWord': {
      var k = el.getAttribute('data-k');
      if (S.dec.n1 === 'B') { openSheet({ kind: 'add', k: k }, el); return; }
      S.added[k] = 1; rerenderKeepFocus('#wl-h'); return pToast('단어장에 넣었어요 · ' + plain(ROWS[k].x.ja));
    }
    case 'addConfirm': { S.added[el.getAttribute('data-k')] = 1; S.sheet = null; renderStage(); return pToast('단어장에 넣었어요'); }
    case 'retryCh': {
      if (S.scr === 's8' && S.v.s8 === 'r409') return pToast('진행 중인 챌린지가 있어요');
      S.s3 = { topic: 'cafe', len: 7, lesson: true, words: true, count: 10, start: 'TODAY', name: '', from: 'ended' };
      return go('s3.step4');
    }
    case 'otherTopic': S.s3.from = 'ended'; return go('s3.step1');
  }
}
function syncLay() { $$('#d-lay button').forEach(function (b) { b.setAttribute('aria-pressed', String(P[b.getAttribute('data-k')])); }); }

document.addEventListener('click', function (e) {
  var t = e.target;
  var nav = t.closest('[data-nav]');
  if (nav) { e.preventDefault(); go(nav.getAttribute('data-nav'), { top: true }); return; }
  var vl = t.closest('[data-var-link]');
  if (vl) { e.preventDefault(); go(S.scr + '.' + vl.getAttribute('data-var-link'), { top: true }); return; }
  var j = t.closest('[data-jump]');
  if (j) { e.preventDefault(); go(j.getAttribute('data-jump'), { top: true }); $('#stage').scrollIntoView({ block: 'start' }); return; }
  var op = t.closest('[data-open]');
  if (op) { var tg = $('#' + op.getAttribute('data-open')); if (tg) tg.open = true; return; }
  var vb = t.closest('#d-var button');
  if (vb) { var vv = vb.getAttribute('data-var'); go(S.scr + '.' + vv, { nofocus: true, top: true }); var nb = $('#d-var button[data-var="' + vv + '"]'); if (nb) nb.focus(); return; }
  var at = t.closest('[data-act-top]');
  if (at) { S.dec = JSON.parse(JSON.stringify(REC)); renderAll(); dToast('권고안으로 되돌렸어요'); return; }
  if (!t.closest('[data-main]')) return;
  var el = t.closest('[data-act],[data-go]');
  if (!el || el.tagName === 'INPUT') return;
  e.preventDefault();
  var a = el.getAttribute('data-act');
  if (a && a !== 'go') act(a, el);
  else go(el.getAttribute('data-go'), { flow: el.hasAttribute('data-flow') ? el.getAttribute('data-flow') : undefined, dyn: el.hasAttribute('data-dyn') ? el.getAttribute('data-dyn') : undefined });
});
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.matches('[data-dec]')) { S.dec[t.getAttribute('data-dec')] = t.value; renderAll(); var f = document.querySelector('input[name="' + t.name + '"]:checked'); if (f) f.focus({ preventScroll: true }); return; }
  if (!t.closest('[data-main]')) return;
  var a = t.getAttribute('data-act');
  if (a === 's3topic') { S.s3.topic = t.value; rerenderKeepFocus('input[name="s3topic"]:checked'); }
  if (a === 's3len') { S.s3.len = Number(t.value); rerenderKeepFocus('input[name="s3len"]:checked'); }
  if (a === 's3goal') { S.s3[t.getAttribute('data-k')] = t.checked; if (S.v.s3 === 'nogoal') S.v.s3 = 'step3'; rerenderKeepFocus('input[data-k="' + t.getAttribute('data-k') + '"]'); }
});
document.addEventListener('keydown', function (e) {
  var sh = $('[data-main] [data-sheet] .sheet');
  if (!sh) return;
  if (e.key === 'Escape') { e.preventDefault(); if (!$('[data-main] .sheet [aria-busy="true"]')) closeSheet(); return; }
  if (e.key === 'Tab') {
    var f = $$('a[href], button, input, select, textarea', sh).filter(function (x) { return x.offsetParent !== null; });
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (!sh.contains(document.activeElement)) { e.preventDefault(); first.focus(); return; }
    if (e.shiftKey && (document.activeElement === first || document.activeElement === sh.querySelector('h2'))) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

/* 위 조작 줄 */
function segCtl(id, fn) {
  $('#' + id).addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.getAttribute('aria-disabled') === 'true') { dToast('이 화면은 새로 생기는 화면이라 지금 화면이 없어요'); return; }
    $$('#' + id + ' button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
    fn(b.getAttribute('data-v'));
  });
}
segCtl('d-w', function (v) { S.w = Number(v); renderStage(); renderDecide(); });
segCtl('d-h', function (v) { S.h = Number(v); renderStage(); });
segCtl('d-view', function (v) { S.view = v; renderStage(); });
segCtl('d-t', function (v) { S.theme = v; if (v === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', v); });
$('#d-lay').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  var k = b.getAttribute('data-k'); P[k] = !P[k]; syncLay(); renderStage(); renderDecide();
});
$('#d-jump').addEventListener('click', function () { $('#decide').open = true; });
function renderAll() { renderDecide(); renderStage(); renderData(); renderMemo(); }
window.addEventListener('hashchange', function () {
  var h = (location.hash || '').slice(1), p = h.split('.');
  if (p.length === 2 && VARS[p[0]] && (p[0] !== S.scr || p[1] !== S.v[p[0]])) go(h, { nofocus: true, top: true });
});

/* 시작 */
(function init() {
  renderChg(); renderMatrix(); renderNotes();
  var h = (location.hash || '').slice(1);
  if (h && h.indexOf('.') > 0 && VARS[h.split('.')[0]]) { renderDecide(); renderData(); renderMemo(); go(h, { nofocus: true, top: true }); return; }
  if (VARS[h]) S.scr = h;
  renderAll();
})();
})();
