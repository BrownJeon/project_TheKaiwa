  ['① 이해', '대화 줄마다 한국어 뜻이 있어요([번역]). 문제 문장은 없어요.', '결정 d', 'y', 'ko-l1'],
  ['② 문법', '표현 뜻·문형 설명·예문 뜻이 늘 한국어로 보여요.', '그대로', 'n', 'ko-l2'],
  ['③ 문제', '새 수업: 한국어 질문이 늘 있어요(A4 v8, promptKo 필수) — 빈칸형은 결정 e. 옛 수업: 비어 있으면 대체 표기(결정 c).', '바뀜 · 결정 c·e', 'y', 'l3-compare'],
  ['④ 응용', '상황 설명이 늘 한국어예요(필수 칸). 힌트는 일본어 첫머리라 그대로.', '그대로', 'n', 'ko-l4'],
  ['⑤ 말하기', '과제 설명이 늘 한국어예요(필수 칸).', '그대로', 'n', 'ko-l5']
];
function renderBottom() {
  var decs = DECS.map(function (d) {
    var opt = function (k) {
      var o = d[k], on = S.dec[d.k] === k, rec = d.rec === k;
      return '<label class="opt' + (rec ? ' rec' : '') + (on ? ' on' : '') + '"><input type="radio" name="dec-' + d.k + '" value="' + k + '" data-dec="' + d.k + '"' + (on ? ' checked' : '') + '>' +
        '<span class="opt-h">' + k + ' · ' + o[0] + (rec ? ' ' + badge('good', 'designer 권고') : '') + '</span><span class="opt-d">' + o[1] + '</span><ul>' +
        o[2].map(function (x) { return '<li class="p">' + x + '</li>'; }).join('') + o[3].map(function (x) { return '<li class="m">' + x + '</li>'; }).join('') + '</ul><span class="sel">' + (on ? '● 데모에 적용 중' : '○ 눌러서 데모에 적용') + '</span></label>';
    };
    return '<article class="dec"><h3>' + d.t + '</h3><p class="dq">' + d.q + '</p><div class="dec-g">' + opt('A') + opt('B') + '</div><button type="button" class="dlink" data-nav="' + d.see + '">이 결정이 보이는 화면 열기 ›</button></article>';
  }).join('');
  var rows = KO_ROWS.map(function (r) {
    return '<div class="korow"><span class="kst">' + r[0] + '</span><span>' + r[1] + '</span><span class="kchg ' + r[3] + '">' + r[2] + '</span><span class="kgo"><button type="button" class="dlink" data-nav="' + r[4] + '">화면 열기 ›</button></span></div>';
  }).join('');
  setHTML(botEl, '<section class="dcard" id="decisions"><h2>결정 필요 — 5가지 <span class="dsub">권고는 designer 판단이에요. 고르면 위 데모가 바로 바뀌어요(미리 보기). 결정은 Leader 를 통해 알려 주세요.</span></h2><div class="decs-g">' + decs + '</div></section>' +
    '<div class="dbot2"><section class="dcard"><h2>단계별 한국어 표기 — 사용자 결정 Q10 “모든 단계”</h2><div class="korows">' + rows + '</div>' +
    '<p class="cap mt8">문제의 보기(답)에는 한국어를 붙이지 않아요 — 붙이면 답을 알려 주게 돼요. 정답 설명은 지금처럼 늘 한국어예요.</p></section>' +
    '<section class="dcard opinion"><h2>판정 수준 의견 (judge: delta · DM-low-confidence)</h2><p><span class="verdict">designer 의견 · delta 유지</span></p>' +
    '<p class="d14">새 화면·주소·단계 순서·저장 흐름이 바뀌지 않아요. 5단계 틀 안에서 네 단계의 작은 요소(줄 ▶ · 표현 소리 · 문제 한국어 줄 · 글자 밑줄)만 더해져요.</p>' +
    '<p class="d14">영향이 네 단계에 걸쳐 넓어 보이지만 단계마다 현재 vs 제안과 영향받는 상태(재생 중·실패·자막만·다시 보기·옛 수업)를 이 데모에 넣었고, 폭에 민감한 줄 ▶·칩은 “세 폭”으로 360·412 경계까지 확인할 수 있어요 — full 로 올릴 필요는 없다고 봐요.</p>' +
    '<p class="d14">다만 결정 (c)에서 B 를 고르면 새 서버 요청(옮기기)이 생기므로 Leader 가 범위를 다시 판단해야 해요.</p></section></div>');
}
function syncTop() {
  qa('#d-w button').forEach(function (b) {
    var v = b.getAttribute('data-w');
    b.setAttribute('aria-pressed', v === 'all' ? S.triple : (!S.triple && +v === S.w));
    if (v === 'all') { if (S.compare) b.setAttribute('aria-disabled', 'true'); else b.removeAttribute('aria-disabled'); }
  });
  qa('#d-f button').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-f') === S.fit); });
  qa('#d-h button').forEach(function (b) { b.setAttribute('aria-pressed', +b.getAttribute('data-h') === S.h); });
  qa('#d-m button').forEach(function (b) { b.setAttribute('aria-pressed', (b.getAttribute('data-m') === 'on') === S.marks); });
}

/* ════════ 이벤트 ════════ */
document.addEventListener('click', function (e) {
  var nv = e.target.closest('[data-nav]');
  if (nv) {
    if (narrow()) navOpen = false;
    var inBottom = !!nv.closest('#dbottom');
    go(nv.getAttribute('data-nav'));
    if (narrow() || inBottom) window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var fr = el.closest('[data-frame]'); if (fr) lastFrame = +fr.getAttribute('data-frame');
  var act = el.getAttribute('data-act');
  if (act !== 'step' && el.getAttribute('aria-disabled') === 'true') {
    if (act === 'app-cmp') toast('먼저 문장을 써 보세요');
    return;
  }
  var fn = ACT[act]; if (fn) fn(el.getAttribute('data-arg'), el, e);
});
document.addEventListener('change', function (e) {
  var r = e.target.closest('[data-dec]');
  if (!r) return;
  var k = r.getAttribute('data-dec');
  S.dec[k] = r.value;
  if (k === 'd') S.trans = r.value === 'B';
  if (k === 'a' && S.playing && S.playing.kind === 'line') S.playing.rate = lineRate(segOf(S.playing.idx));
  render();
  var back = botEl.querySelector('input[name="dec-' + k + '"][value="' + r.value + '"]');
  if (back) back.focus({ preventScroll: true });
});
document.addEventListener('input', function (e) {
  var t = e.target;
  if (!t.getAttribute || t.getAttribute('data-inp') !== 'app') return;
  S.app.text[S.app.i] = t.value;
  var n = cpLen(t.value);
  qa('[data-live="acount"]').forEach(function (x) { x.textContent = n + ' / 200자'; });
  qa('[data-k="acmp"]').forEach(function (b) { if (n) b.removeAttribute('aria-disabled'); else b.setAttribute('aria-disabled', 'true'); });
});
document.getElementById('d-w').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  var v = b.getAttribute('data-w');
  if (v === 'all' && S.compare) { dtoast('비교 화면은 한 폭으로 보여요'); return; }
  if (v === 'all') S.triple = !S.triple; else { S.triple = false; S.w = +v; }
  render();
});
document.getElementById('d-f').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; S.fit = b.getAttribute('data-f'); render(); });
document.getElementById('d-h').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; S.h = +b.getAttribute('data-h'); render(); });
document.getElementById('d-m').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; S.marks = b.getAttribute('data-m') === 'on'; render(); });
document.getElementById('d-t').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  var v = b.getAttribute('data-t');
  if (v === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', v);
  qa('#d-t button').forEach(function (x) { x.setAttribute('aria-pressed', x === b); });
});
document.getElementById('d-reset').addEventListener('click', function () { go('l1-compare'); });
var rsz = null;
window.addEventListener('resize', function () { clearTimeout(rsz); rsz = setTimeout(applyScale, 120); });

/* 시작: 주소 #<id> 가 있으면 그 상태로(QA·가이드 인용용) */
var start = (location.hash || '').replace('#', '');
var known = false; PRESETS.forEach(function (g) { g[1].forEach(function (p) { if (p[0] === start) known = true; }); });
go(known ? start : 'l1-compare');
})();
</script>
