    see: ['c-back', 'c-long'] },
  { id: 'r1', t: '복습 칩(오늘 홈 [자세히]·복습 만들기·다음 복습)에 무엇을 달까요?', d: '칩은 지금 높이 32px·한 줄 말줄임이에요. 같은 복습 종료 화면에 수업 표현 칩(히라가나 + [한글] 인라인)이 함께 있어요.',
    A: ['수업 표현 칩과 같게 — 히라가나 + [한글] 12 인라인', '026 의 표현 칩 규칙(16→칩은 15px, rt 11, 줄간격 2.1, 한글 12) 그대로. 칩이 내용에 맞게 늘어남.', ['p:복습 종료 화면에서 두 종류 칩이 같은 모양', 'p:새 규칙 없음', 'm:칩이 길어져 2줄이 될 수 있어요([자세히] 펼친 상태에서만)']],
    B: ['히라가나만(한 줄 유지)', '칩 높이 약 40px, 말줄임 그대로.', ['p:미리 보기 칩이 간결해요', 'm:같은 화면의 표현 칩과 모양이 달라요(S1-A 일 때)', 'm:“표현 칩” 규칙에 예외가 하나 생겨요']],
    see: ['r-home', 'r-end'] },
  { id: 's1', t: '범위 경계 — 같은 흐름의 두 목록도 함께 넣을까요?', d: '세트 결과 단어 목록(카드 뒷면 바로 다음 화면)과 복습 종료 화면의 “쓴 표현” 칩은 026 에서 범위 밖으로 남은 곳이에요. 둘 다 이미 있는 규칙(단어장 행·표현 칩)을 그대로 쓰면 돼요.',
    A: ['넓게 — 두 곳도 이번에 함께', '세트 결과 = 단어장 행 규칙(히라가나 + [한글] 12.5), 종료 표현 칩 = 표현 칩 규칙. 파일 2개 추가(<code>WordResultList</code>·<code>LessonEnd</code>).', ['p:카드 → 결과, 복습 → 종료가 끊김 없이 같은 표시', 'p:<code>ExprChip</code> 은 이미 층을 받을 수 있어 바꿀 곳이 적어요', 'm:일반 수업 종료 화면의 표현 칩도 같이 바뀌어요(같은 컴포넌트)']],
    B: ['좁게 — 이번 후보 3화면만', '두 곳은 다음 개선으로.', ['p:변경 파일이 가장 적어요', 'm:카드 뒷면엔 히라가나가 있는데 바로 다음 결과 목록엔 옆 읽기 — 한 흐름에 두 방식', 'm:복습 종료 화면에 층 있는 칩·없는 칩이 섞여요']],

function decideHtml() {
  return '<h2 id="dc-h">결정 필요 6건 — 권고안이 처음에 선택돼 있어요</h2><p class="dsub">고르면 위 데모 “제안”이 그 안으로 다시 그려져요. 권고대로면 그대로 두세요.</p>' +
    DQ.map(function (q) {
      function opt(k) {
        var o = q[k], on = S.dec[q.id] === k;
        return '<label class="opt' + (on ? ' on' : '') + '"><input type="radio" name="dq-' + q.id + '" value="' + k + '"' + (on ? ' checked' : '') + ' data-dq="' + q.id + '"><span class="opt-h">' + q.id.toUpperCase() + '-' + k + ' · ' + o[0] + (REC[q.id] === k ? '<span class="rec">권고</span>' : '') + '</span><span class="opt-d">' + o[1] + '</span><ul>' +
          o[2].map(function (x) { return '<li class="' + x.slice(0, 1) + '">' + x.slice(2) + '</li>'; }).join('') + '</ul><span class="sel">' + (on ? '● 데모에 반영 중' : '○ 누르면 데모에 반영') + '</span></label>';
      }
      return '<div class="dq" id="dq-' + q.id + '"><h3><span class="did">' + q.id.toUpperCase() + '</span>' + q.t + '</h3><p>' + q.d + '</p><p class="see" style="font-size:12px">데모에서 보기: ' + q.see.map(function (s) { return '<a href="#' + s + '">#' + s + '</a>'; }).join(' · ') + '</p><div class="dq-g">' + opt('A') + opt('B') + '</div></div>';
    }).join('') +
    '<div class="dsum"><b>권고 요약</b> — E1-A(설정 따름 + 정답 보호) · E2-A(도구 줄) · C1-A(뒷면 히라가나 늘) · C2-A(예문 한글 1줄) · R1-A(표현 칩과 같게) · S1-A(세트 결과·종료 표현 칩까지)</div>';
}

/* ════════ 그리기 ════════ */
function figure(cur) {
  CUR = cur;
  var html = screen(S.scr);
  CUR = false;
  var cap = cur ? '<span class="tagc">현재</span>HEAD 화면' : '<span class="tagp">제안</span>' + S.w + '×' + S.h;
  return '<figure class="fw"><figcaption>' + cap + ' <span class="dmeas" data-meas></span></figcaption><div class="phone w' + S.w + ' h' + S.h + '" data-phone="' + (cur ? 'cur' : 'prop') + '">' + html + '</div></figure>';
}
function render() {
  if (IDS.indexOf(S.scr) < 0) S.scr = IDS[0];
  document.getElementById('dnav').innerHTML = navHtml();
  var st = '';
  if (S.view !== 'prop') st += figure(true);
  if (S.view !== 'cur') st += figure(false);
  document.getElementById('stage').innerHTML = st;
  document.getElementById('side').innerHTML = sideHtml();
  document.getElementById('scope').innerHTML = scopeHtml();
  document.getElementById('decide').innerHTML = decideHtml();
  requestAnimationFrame(function () { anchor(); measure(); });
}
function anchor() {
  Array.prototype.forEach.call(document.querySelectorAll('#stage [data-anchor]'), function (a) {
    var sc = a.closest('.scr, .main, .lsc');
    if (sc) sc.scrollTop = Math.max(0, a.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop - 8);
  });
}
/* 카드 안 잘림(뒷면 내용 아래 끝 − 카드 안쪽 아래 끝) · 가로 넘침 */
function measure() {
  var out = [];
  Array.prototype.forEach.call(document.querySelectorAll('#stage .fw'), function (fw) {
    var ph = fw.querySelector('.phone'), m = fw.querySelector('[data-meas]'), txt = [];
    var face = ph.querySelector('[data-face]');
    if (face) {
      var fr = face.getBoundingClientRect(), inner = fr.bottom - 16, last = 0, dropped = false;
      /* C2-A: 카드에 자리가 없으면 예문 [한글] 줄만 뺀다(번역 우선) — 구현은 카드 면을 그릴 때 한 번 잰다 */
      var kx = face.querySelector('.kexh');
      if (kx) {
        var lb = 0;
        Array.prototype.forEach.call(face.querySelectorAll('.kbody > *, .kbody > div > *'), function (el) { lb = Math.max(lb, el.getBoundingClientRect().bottom); });
        if (lb > inner + 0.5) kx.hidden = true;
        dropped = kx.hidden;
      }
      Array.prototype.forEach.call(face.querySelectorAll('.kbody > *, .kbody > div > *'), function (el) { last = Math.max(last, el.getBoundingClientRect().bottom); });
      var cut = Math.round(last - inner);
      txt.push('카드 안 잘림 ' + (cut > 0 ? '<span class="up">' + cut + 'px</span>' : '<span class="ok">0</span>') + (dropped ? '(예문 [한글] 뺌)' : '') + ' · 카드 ' + Math.round(fr.width) + '×' + Math.round(fr.height));
    }
    var pw = ph.getBoundingClientRect(), over = 0;
    Array.prototype.forEach.call(ph.querySelectorAll('*'), function (el) {
      var r = el.getBoundingClientRect();
      if (r.width && (r.right > pw.right + 0.5 || r.left < pw.left - 0.5) && !el.closest('.enav > div, .stk')) over++;
    });
    txt.push('가로 넘침 ' + (over ? '<span class="up">' + over + '</span>' : '<span class="ok">0</span>'));
    m.innerHTML = '· ' + txt.join(' · ');
    out.push(ph.getAttribute('data-phone') + ':' + txt.join(','));
  });
  window.__demoMeasure = out;
}
var TOASTS = {
  fu: ['히라가나를 숨겼어요 · 모든 화면에 적용돼요', '히라가나를 보여 줘요 · 모든 화면에 적용돼요'],
  hg: ['한글 발음을 숨겼어요 · 모든 화면에 적용돼요', '한글 발음을 보여 줘요 · 모든 화면에 적용돼요'],
  tr: ['번역을 모두 접었어요 · 모든 화면에 적용돼요', '번역을 모두 펼쳤어요 · 모든 화면에 적용돼요']
};
var tt = null;
function toast(msg) {
  var el = document.getElementById('dtoast');
  el.textContent = msg; el.hidden = false;
  clearTimeout(tt); tt = setTimeout(function () { el.hidden = true; }, 2200);
}
function syncSeg(id, attr, val) {
  Array.prototype.forEach.call(document.querySelectorAll('#' + id + ' button'), function (b) { b.setAttribute('aria-pressed', String(b.getAttribute(attr) === String(val))); });
}
function syncLay() { Array.prototype.forEach.call(document.querySelectorAll('#d-lay button'), function (b) { b.setAttribute('aria-pressed', String(!!S[b.getAttribute('data-k')])); }); }
function seg(id, key, conv) {
  document.getElementById(id).addEventListener('click', function (e) {
    var b = e.target.closest('button[data-v]');
    if (!b) return;
    var v = b.getAttribute('data-v');
    syncSeg(id, 'data-v', v);
    if (key === 'theme') { if (v === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', v); return; }
    if (key === 'mark') { document.body.classList.toggle('mark', v === 'on'); return; }
    S[key] = conv ? conv(v) : v;
    render();
  });
}
seg('d-w', 'w', Number); seg('d-h', 'h', Number); seg('d-view', 'view'); seg('d-an', 'an'); seg('d-mark', 'mark'); seg('d-t', 'theme');
document.getElementById('d-lay').addEventListener('click', function (e) {
  var b = e.target.closest('button[data-k]');
  if (!b) return;
  var k = b.getAttribute('data-k');
  S[k] = !S[k]; syncLay(); toast(TOASTS[k][S[k] ? 1 : 0]); render();
});
document.getElementById('stage').addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]');
  if (!b) return;
  e.preventDefault();
  if (b.getAttribute('data-act') === 'tg') {
    var k = b.getAttribute('data-k');
    S[k] = !S[k]; syncLay(); toast(TOASTS[k][S[k] ? 1 : 0]); render();
  }
});
document.getElementById('decide').addEventListener('change', function (e) {
  var r = e.target.closest('input[data-dq]');
  if (!r) return;
  S.dec[r.getAttribute('data-dq')] = r.value;
  render();
  var box = document.getElementById('dq-' + r.getAttribute('data-dq'));
  var inp = box && box.querySelector('input[value="' + r.value + '"]');
  if (inp) inp.focus({ preventScroll: true });
});
function fromHash() {
  var h = location.hash.replace('#', '');
  if (IDS.indexOf(h) >= 0) { S.scr = h; render(); window.scrollTo(0, 0); }
}
window.addEventListener('hashchange', fromHash);
var rz = null;
window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(measure, 150); });
var h0 = location.hash.replace('#', '');
if (IDS.indexOf(h0) >= 0) S.scr = h0;
render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { measure(); });
})();
</script>
