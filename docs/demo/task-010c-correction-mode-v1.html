<title>교정 방식 데모</title>
<style>
/* ── 토큰: src/app/globals.css 값을 그대로 고정(링크하지 않음) ── */
:root {
  color-scheme: light dark;
  --ground: #f6f7f4; --surface: #ffffff; --surface2: #eef0ea;
  --ink: #1e2420; --ink2: #5a6359; --ink3: #8b948a; --line: #dde2d9;
  --accent: #c8471f; --accent-soft: #fbe9e3; --on-accent: #ffffff;
  --good: #3e6b3a; --good-soft: #e4efe2; --warn: #c98a12; --warn-soft: #fbf0d6;
  --bad: #b3261e; --bad-soft: #f9e3e1;
  --radius: 14px;
  --scrim: rgba(30, 36, 32, .42);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #141816; --surface: #1d2320; --surface2: #262d29;
    --ink: #ecefe9; --ink2: #aeb6ac; --ink3: #7e877d; --line: #333b36;
    --accent: #f06a45; --accent-soft: #3a241e; --on-accent: #1a0e0a;
    --good: #7fb27a; --good-soft: #223121; --warn: #e0a93a; --warn-soft: #3a2f14;
    --bad: #f28b82; --bad-soft: #3d1f1d;
    --scrim: rgba(0, 0, 0, .55);
  }
}
:root[data-theme="dark"] {
  --ground: #141816; --surface: #1d2320; --surface2: #262d29;
  --ink: #ecefe9; --ink2: #aeb6ac; --ink3: #7e877d; --line: #333b36;
  --accent: #f06a45; --accent-soft: #3a241e; --on-accent: #1a0e0a;
  --good: #7fb27a; --good-soft: #223121; --warn: #e0a93a; --warn-soft: #3a2f14;
  --bad: #f28b82; --bad-soft: #3d1f1d;
  --scrim: rgba(0, 0, 0, .55);
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--ground); color: var(--ink);
  font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  word-break: keep-all; overflow-wrap: anywhere;
}
:lang(ja) {
  font-family: "Noto Sans JP", "Noto Sans CJK JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", Meiryo, sans-serif;
  line-break: strict; word-break: normal;
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
p, h1, h2, h3, h4, ul, ol, dl, dd { margin: 0; }
ul, ol { padding: 0; list-style: none; }

/* ── 데모 틀(휴대폰 밖) — 오늘의 회화 v2 와 같은 방식 ── */
.dtop { position: sticky; top: 0; z-index: 60; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
  padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.dtop h1 { font-size: 16px; font-weight: 700; margin-right: auto; }
.dtop h1 small { font-size: 12px; font-weight: 500; color: var(--ink2); margin-left: 6px; }
.dctls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; min-width: 0; }
.dctl { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink2); flex: none; }
.dseg { display: inline-flex; gap: 2px; padding: 2px; border-radius: 10px; background: var(--surface2); }
.dseg button { border: 0; background: none; height: 32px; min-width: 44px; padding: 0 10px; border-radius: 8px; font-size: 12.5px; color: var(--ink2); cursor: pointer; white-space: nowrap; }
.dseg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.1); }
.dseg button[aria-disabled="true"] { opacity: .45; cursor: default; }
.dbtn { height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 12.5px; cursor: pointer; flex: none; white-space: nowrap; }
.dbtn[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); font-weight: 600; }
.dlay { display: grid; grid-template-columns: 232px minmax(0, 1fr) 360px; gap: 18px; padding: 16px; align-items: start; }
.dnav { position: sticky; top: 72px; max-height: calc(100dvh - 88px); overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px; }
.dnav details details { margin-top: 6px; }
.dnav summary { cursor: pointer; font-size: 12.5px; font-weight: 700; color: var(--ink); padding: 6px 4px; list-style: none; }
.dnav summary::-webkit-details-marker { display: none; }
.dnav summary::before { content: "▾ "; color: var(--ink2); }
.dnav details:not([open]) > summary::before { content: "▸ "; }
.dnav .dnav-all > summary { font-size: 13px; min-height: 36px; display: flex; align-items: center; gap: 4px; white-space: nowrap; overflow: hidden; }
.dnav .dnav-all > summary .cur { font-weight: 500; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; }
.dnav button { display: block; width: 100%; text-align: left; border: 0; background: none; min-height: 34px; padding: 6px 8px; border-radius: 8px; font-size: 12.5px; color: var(--ink2); cursor: pointer; }
.dnav button:hover { background: var(--surface2); color: var(--ink); }
.dnav button[aria-current="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.dnav .did { font-size: 11px; color: var(--ink2); margin-left: 4px; font-family: ui-monospace, Menlo, monospace; }
/* 틀 배치: 휴대폰은 실제 CSS 폭·높이로 배치하고, 자리가 모자라면 같은 배율(--s)로 통째 축소.
   바깥 상자(.fbox·.fw)는 축소된 크기만큼만 자리를 차지한다. */
.dstage { --s: 1; display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 22px; min-width: 0; }
.dstage.row { flex-wrap: nowrap; }
.fw { margin: 0; min-width: 0; display: flex; flex-direction: column; align-items: center; }
.fw.w360 { width: calc(360px * var(--s)); } .fw.w390 { width: calc(390px * var(--s)); } .fw.w412 { width: calc(412px * var(--s)); }
.fw figcaption { font-size: 12px; line-height: 1.4; color: var(--ink2); text-align: center; margin-bottom: 6px; font-weight: 600; }
.fw figcaption b { color: var(--ink); }
.fw figcaption .sc { font-weight: 500; }
.fbox { position: relative; flex: none; }
.fbox.w360 { width: calc(360px * var(--s)); } .fbox.w390 { width: calc(390px * var(--s)); } .fbox.w412 { width: calc(412px * var(--s)); }
.fbox.h780 { height: calc(780px * var(--s)); } .fbox.h892 { height: calc(892px * var(--s)); }
.fbox > .phone { position: absolute; left: 0; top: 0; transform: scale(var(--s)); transform-origin: 0 0; }
.fdim { font-size: 12px; color: var(--ink2); margin-top: 8px; text-align: center; font-variant-numeric: tabular-nums; }
.fold { position: absolute; left: 0; right: 0; top: 780px; z-index: 70; border-top: 2px dashed var(--accent); pointer-events: none; }
.fold span { position: absolute; right: 10px; top: -24px; font-size: 11px; font-weight: 600; line-height: 18px; padding: 0 6px; border-radius: 6px; background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.dtoast { position: fixed; left: 50%; bottom: 24px; z-index: 90; transform: translateX(-50%); max-width: calc(100vw - 32px); background: var(--ink); color: var(--surface); border-radius: 12px; padding: 10px 14px; font-size: 13px; box-shadow: 0 6px 18px rgba(0,0,0,.2); }
.dside { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.dcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.dcard > h2 { font-size: 13px; font-weight: 700; margin-bottom: 8px; }
.dcard .dk { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
.dcard ul.dn { list-style: disc; padding-left: 18px; font-size: 13px; color: var(--ink); display: flex; flex-direction: column; gap: 4px; }
.dcard .dsub { font-size: 12px; color: var(--ink2); }
.dacts { display: flex; flex-wrap: wrap; gap: 6px; }
.dec { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; container-type: inline-size; }
.dec:first-of-type { border-top: 0; padding-top: 0; margin-top: 4px; }
.dec h3 { font-size: 14px; font-weight: 700; }
.dec-g { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 8px; }
@container (min-width: 300px) { .dec-g { grid-template-columns: 1fr 1fr; } }
.opt { display: flex; flex-direction: column; gap: 4px; border: 1px solid var(--line); border-radius: 12px; padding: 10px; cursor: pointer; background: var(--surface); position: relative; }
.opt.rec { border-color: var(--good); }
.opt.on { box-shadow: inset 0 0 0 2px var(--accent); }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.opt-h { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13px; font-weight: 700; }
.opt-d { font-size: 12.5px; color: var(--ink); }
.opt ul { font-size: 12px; color: var(--ink2); display: flex; flex-direction: column; gap: 2px; }
.opt li.p::before { content: "+ "; color: var(--good); font-weight: 700; }
.opt li.m::before { content: "− "; color: var(--bad); font-weight: 700; }
.opt .sel { font-size: 11.5px; color: var(--ink2); }
.opt.on .sel { color: var(--ink); font-weight: 600; }
.dlink { border: 0; background: none; padding: 0; min-height: 32px; color: var(--accent); font-weight: 600; font-size: 12.5px; cursor: pointer; }
@media (max-width: 1240px) { .dlay { grid-template-columns: 220px minmax(0, 1fr); } .dside { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; } .dside .dcard.decs { grid-column: 1 / -1; } }
@media (max-width: 760px) {
  .dlay { grid-template-columns: minmax(0, 1fr); gap: 12px; padding: 12px 16px; }
  .dnav { position: static; max-height: none; padding: 4px 10px; }
  .dside { grid-template-columns: minmax(0, 1fr); }
  /* 휴대폰: 상단 컨트롤은 제목 1줄 + 가로로 밀리는 한 줄, 따라다니지 않는다 */
  .dtop { position: static; flex-direction: column; align-items: stretch; flex-wrap: nowrap; gap: 6px; padding: 8px 16px; }
  .dtop h1 { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dctls { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; gap: 10px; }
  .dctls::-webkit-scrollbar { display: none; }
}

/* ── 휴대폰 프레임: 폭은 클래스로만 ── */
.phone { position: relative; overflow: hidden; border-radius: 26px; background: var(--ground);
  box-shadow: 0 0 0 1px var(--line), 0 14px 36px rgba(0,0,0,.14); }
.w360 { width: 360px; } .w390 { width: 390px; } .w412 { width: 412px; }
.h780 { height: 780px; } .h892 { height: 892px; }
.app { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--ground); min-width: 0; }
.scroll { position: relative; flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.page { padding: 0 16px 32px; min-width: 0; }
.page > * + * { margin-top: 18px; }

/* 앱바 · 회화방 머리 · 하단 탭 */
.appbar { position: sticky; top: 0; z-index: 5; height: 52px; display: flex; align-items: center; gap: 8px; background: var(--surface); padding: 0 12px 0 16px; margin-bottom: 10px; }
.appbar h1 { flex: 1; min-width: 0; font-size: 20px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.me { width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: none; border-radius: 50%; cursor: pointer; flex: none; }
.me span { width: 32px; height: 32px; border-radius: 50%; background: var(--good); color: #fff; font-size: 13px; font-weight: 600; display: grid; place-items: center; }
.back { width: 44px; height: 44px; flex: none; display: grid; place-items: center; border: 0; background: none; border-radius: 50%; cursor: pointer; }
.lhead { height: 56px; flex: none; display: flex; align-items: center; gap: 4px; min-width: 0; background: var(--surface); border-bottom: 1px solid var(--line); padding: 0 8px 0 4px; }
.av { width: 40px; height: 40px; flex: none; border-radius: 50%; background: var(--accent-soft); color: var(--ink); font-weight: 600; font-size: 16px; display: grid; place-items: center; }
.av.sm { width: 28px; height: 28px; font-size: 13px; }
.lh-m { flex: 1; min-width: 0; padding-left: 6px; }
.lh-m h1 { font-size: 16px; font-weight: 600; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ind { position: relative; display: inline-flex; align-items: center; gap: 6px; max-width: 100%; border: 0; background: none; padding: 0; font-size: 12px; line-height: 16px; color: var(--ink2); cursor: pointer; }
.ind::before { content: ""; position: absolute; left: -8px; right: -8px; top: -14px; bottom: -14px; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--good); }
.ind .gt { color: var(--ink3); }
.tabbar { flex: none; display: flex; border-top: 1px solid var(--line); background: var(--surface); padding: 6px 0 10px; }
.tab { flex: 1; min-width: 0; min-height: 56px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding-top: 4px; border: 0; background: none; font-size: 11px; color: var(--ink2); cursor: pointer; }

/* 공용 조각 */
.card { min-width: 0; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); padding: 14px; }
.card.flat { border-color: transparent; background: var(--surface2); }
.sec-h { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
.cap { font-size: 12px; color: var(--ink2); }
.d13 { font-size: 13px; color: var(--ink2); }
.d14 { font-size: 14px; }
.d15 { font-size: 15px; }
.strong { font-size: 15px; font-weight: 600; }
.mt { margin-top: 12px; } .mt8 { margin-top: 8px; } .mt4 { margin-top: 4px; }
.num { font-variant-numeric: tabular-nums; }
.badge { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 11.5px; font-weight: 600; flex: none; white-space: nowrap; }
.badge.neutral { background: var(--surface2); color: var(--ink2); }
.badge.good { background: var(--good-soft); color: var(--good); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 16px; border-radius: 12px; border: 0; background: none; font-size: 15px; font-weight: 600; cursor: pointer; white-space: nowrap; min-width: 0; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.ghost { border: 1px solid var(--line); background: var(--surface); }
.btn.full { width: 100%; }
.btn.h44 { height: 44px; padding: 0 14px; font-size: 14px; }
.btn[aria-disabled="true"], .btn:disabled { opacity: .45; cursor: default; }
.btn[aria-busy="true"] { opacity: .7; }
.btnrow { display: flex; gap: 8px; margin-top: 12px; }
.btnrow > * { flex: 1; min-width: 0; }
.alink { position: relative; display: inline-flex; align-items: center; min-height: 44px; border: 0; background: none; padding: 0; font-size: 13px; font-weight: 600; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.alert { border-radius: 12px; background: var(--bad-soft); color: var(--bad); padding: 12px 14px; font-size: 13px; }
.alert .alink { color: var(--bad); }
.toast { position: absolute; left: 16px; right: 16px; z-index: 60; background: var(--ink); color: var(--surface); border-radius: 12px; padding: 12px 14px; font-size: 13.5px; text-align: center; box-shadow: 0 6px 18px rgba(0,0,0,.2); }
.skel { display: block; border-radius: 14px; background: var(--surface2); height: 150px; }
.skel + .skel { margin-top: 8px; }
.gi { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; font-weight: 700; flex: none; }
.gi.good { background: var(--surface); color: var(--good); }
.divider { text-align: center; font-size: 12px; color: var(--ink2); }

/* ── 설정 · 학습 ── */
.att { margin: 0 16px 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.acct-n { font-size: 16px; font-weight: 600; margin-top: 4px; }
.fields { display: flex; flex-direction: column; gap: 14px; }
.fld { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.flab { font-size: 12.5px; font-weight: 500; color: var(--ink2); }
.fhelp { font-size: 12.5px; line-height: 1.45; color: var(--ink2); }
.fhelp b { color: var(--ink); font-weight: 600; }
.inp { display: block; width: 100%; min-width: 0; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 0 12px; font-size: 16px; }

/* 교정 방식 — 두 줄 선택 카드(설명이 늘 보임) */
.rgrp { display: flex; flex-direction: column; gap: 8px; }
.rc { position: relative; display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 10px; align-items: start; min-height: 56px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); cursor: pointer; }

.rc input:checked::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.rc-m { min-width: 0; }
.rc-t { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; }

.msgs { padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }

.ub { max-width: 85%; min-width: 0; border-radius: 16px 16px 6px 16px; background: var(--accent-soft); color: var(--ink); padding: 8px 12px; font-size: 17px; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; }

.meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-height: 30px; font-size: 12px; color: var(--ink2); }

.tl::before { content: ""; position: absolute; left: -4px; right: -4px; top: -12px; bottom: -12px; }

.clist { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; min-width: 0; }
.tm { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 8px; align-items: start; }

function toastBottom() { return S.view === 'settings' || S.view === 'set-compare' ? 84 : (S.dec.a === 'B' && laterCount() > 0 ? 180 : 136); }
function toastHTML() { return S.toast ? '<div class="toast" role="status" style="bottom:' + toastBottom() + 'px">' + S.toast + '</div>' : ''; }
function tabbar() {
  return '<nav class="tabbar" aria-label="주 메뉴">' + TABS.map(function (t) {
    return '<button type="button" class="tab" data-act="oos"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + t[1] + '"/></svg>' + t[0] + '</button>';
  }).join('') + '</nav>';
}

/* ════════ 설정 · 기본정보 · 학습 ════════ */
var segN = 0;
function segF(label, opts, on, sk) {
  var id = FID + 'sg' + (segN++);
  return '<div class="fld"' + (sk ? ' data-sk="' + sk + '"' : '') + '><p class="flab" id="' + id + '">' + label + '</p><div class="seg" role="radiogroup" aria-labelledby="' + id + '">' + opts.map(function (o, i) {
    return '<button type="button" role="radio" aria-checked="' + (i === on) + '"' + (i === on ? ' class="on"' : ' tabindex="-1"') + ' data-act="set-oos"><span>' + o + '</span></button>';
  }).join('') + '</div></div>';
}
function inpF(label, key, val) {
  var id = FID + 'in-' + key;
  return '<div class="fld"><label class="flab" for="' + id + '">' + label + '</label><input id="' + id + '" class="inp sm" value="' + esc(val) + '" readonly></div>';
}
function modeField() {
  var st = S.set, dis = st.saving;
  var opt = function (v) {
    var on = st.mode === v;
    return '<label class="rc' + (on ? ' on' : '') + (dis ? ' dis' : '') + '"><input type="radio" name="' + FID + 'cm" value="' + v + '" data-cm="1" data-k="cm-' + v + '"' + (on ? ' checked' : '') + (dis ? ' disabled' : '') + '>' +
      '<span class="rc-m"><span class="rc-t">' + MODE_NAME[v] + (v === 'FLUENCY' ? ' ' + badge('neutral', '기본') : '') + '</span><span class="rc-d">' + MODE_DESC[v] + '</span></span></label>';
  };
  return '<div class="fld" data-sk="mode"><p class="flab" id="' + FID + 'cml">교정 방식</p>' +
    '<p class="fhelp" id="' + FID + 'cmh">교정 강도는 <b>무엇을</b> 고칠지, 교정 방식은 회화에서 <b>언제</b> 보여 줄지 정해요.</p>' +
    '<div class="rgrp" role="radiogroup" aria-labelledby="' + FID + 'cml" aria-describedby="' + FID + 'cmh">' + opt('FLUENCY') + opt('COACH') + '</div>' +
    '<p class="cap">말로 하는 회화에만 적용돼요. 글 채팅은 지금처럼 대화를 마친 뒤 한꺼번에 점검해요.</p></div>';
}
function settingsScreen(current) {
  segN = 0;
  var st = S.set;
  var save = current
    ? '<button type="button" class="btn primary full" data-act="set-oos">학습 설정 저장</button>'
    : '<button type="button" class="btn primary full" data-act="set-save" data-k="save"' + (st.saving ? ' aria-busy="true" aria-disabled="true"' : '') + '>' + (st.saving ? '저장 중…' : '학습 설정 저장') + '</button>';
  return '<div class="app"><div class="scroll" data-scroll><header class="appbar"><h1>설정</h1><button type="button" class="me" data-act="set-oos" aria-label="설정"><span>나</span></button></header>' +
    '<div class="card flat att"><span class="d14" style="color:var(--ink2)">이번 달 출석 12일</span><span class="strong">연속 5일</span></div>' +
    '<div class="page">' +
    '<section class="card"><p class="d13">로그인 계정</p><p class="acct-n">김준</p><p class="d14" style="color:var(--ink2)">jun@example.com</p><button type="button" class="btn ghost h44 mt8" data-act="set-oos">로그아웃</button></section>' +
    '<section><h3 class="sec-h">기본정보 · 학습</h3><div class="card fields">' +

      segF('지금 수준', ['N5', 'N4', 'N3', 'N2', 'N1'], 0) +
      segF('목표 수준', ['없음', 'N5', 'N4', 'N3', 'N2', 'N1'], 2) +
      segF('대화 문체', ['존댓말(' + J('です・ます') + ')', '반말(' + J('タメ口') + ')'], 0) +
      segF('교정 강도', ['가볍게', '보통', '꼼꼼하게'], 2, 'corr') +
      (current ? '' : modeField()) +
      segF('설명 자세히', ['짧게', '보통', '자세히'], 1) +
      segF('오늘의 단어 개수', ['5개', '10개', '15개', '20개', '30개'], 1) +
      segF('하루 공부 시간', ['10분', '15분', '20분', '30분', '60분'], 1) +
      save + '</div></section>' +
    '<section><h3 class="sec-h">AI 선생님 목소리</h3><div class="card"><div class="vhead"><span class="av sm" aria-hidden="true">' + AV + '</span><p class="strong">' + TEACHER + ' 선생님</p></div><button type="button" class="btn ghost full mt" data-act="set-oos">▶ 현재 설정으로 미리듣기</button></div></section>' +
    '</div></div>' + tabbar() + toastHTML() + '</div>';
}

/* ════════ 회화방 ════════ */
function crList() { return Object.keys(S.crs).map(function (k) { return S.crs[k]; }).sort(function (a, b) { return a.order - b.order; }); }
function laterList() { return S.sheetEmpty ? [] : crList().filter(function (c) { return c.deliver === 'LATER'; }); }
function laterCount() { return laterList().filter(function (c) { return c.status === 'PROPOSED'; }).length; }
/* 코치: 바로 앞 내 말에 붙은, 아직 판정 전인 힌트 카드 */
function waitingCoach() {
  for (var i = S.msgs.length - 1; i >= 0; i--) {
    var m = S.msgs[i];
    if (m.k === 'u' && !m.pend) { var c = m.cr && S.crs[m.cr]; return c && c.coach && !c.judged && c.status === 'PROPOSED' ? c : null; }
  }
  return null;
}
function lastTutor() { for (var i = S.msgs.length - 1; i >= 0; i--) if (S.msgs[i].k === 't') return S.msgs[i]; return null; }

function nextTurn() {
  if (S.script === 'F') return F[S.si] || null;
  if (S.si === 0) return CO0;
  if (S.si === 1) return S.nextSay === 'fix' ? CO_FIX : CO_NOFIX;
  if (S.si === 2) return CO2;
  return null;
}
function commitTurn(t) {
  var prev = waitingCoach();
  var at = '14:' + (S.min < 10 ? '0' : '') + S.min; S.min++;
  S.msgs.push({ k: 'u', ja: t.u, at: at, cr: t.cr || null });
  if (t.cr) {
    var d = CR[t.cr];
    S.crs[t.cr] = { id: t.cr, status: 'PROPOSED', deliver: (S.mode === 'FLUENCY' && !d.major) ? 'LATER' : 'NOW', coach: S.mode === 'COACH' && !!d.hint,
      revealed: false, judged: false, how: null, word: false, order: S.order++ };
  }
  if (prev) {
    prev.judged = true;
    if (norm(t.u).indexOf(norm(plain(CR[prev.id].c))) >= 0) prev.how = prev.revealed ? 'repeat' : 'self';
  }
  S.msgs.push({ k: 't', ja: t.t, tc: t.tc || null, at: at });
  S.si++;
}
function playTurns(n) { for (var i = 0; i < n; i++) { var t = nextTurn(); if (t) commitTurn(t); } }

function crCard(cr, cur) {
  var d = CR[cr.id];
  var act = function (a) { return cur ? 'cmp-static' : a; };
  var hintMode = !cur && cr.coach;
  var autoOpen = hintMode && !cr.revealed && !cr.how && cr.judged && S.dec.b === 'B';
  var revealed = !hintMode || cr.revealed || !!cr.how || autoOpen;
  var st = cr.status, right = '';
  if (st === 'ACCEPTED') right = badge('good', '채택함');
  else if (st === 'REJECTED') right = badge('neutral', '무시함');
  else if (hintMode && cr.how === 'self') right = badge('good', '스스로 고쳤어요 ✓');
  else if (hintMode && cr.how === 'repeat') right = badge('good', '고쳐 말했어요 ✓');
  else if (hintMode && !revealed) right = badge('neutral', '힌트');
  var head = '<div class="cc-h">' + badge('neutral', d.type) + (d.major ? badge('bad', '중요') : '') + (d.chunk ? '<span class="cap">' + d.chunk + '</span>' : '') + '<span class="cc-r">' + right + '</span></div>';
  var open = '<li class="cc' + (!cur && S.hl === cr.id ? ' hl' : '') + '" id="' + FID + 'cr-' + cr.id + '" data-sk="cr-' + cr.id + '">';
  if (!revealed) {
    var retry = cr.judged ? '아직 고치지 못했어요. 정답을 보고 다시 말해 보세요.' : '힌트를 보고 다시 말해 보세요. 아래 버튼을 누른 채로 고친 문장을 말하면 돼요.';
    return open + head +
      '<div class="cc-b mt8"><p class="l">내 문장</p><p class="ja" lang="ja">' + esc(plain(d.o)) + '</p></div>' +
      '<div class="hintb"><p class="l">힌트</p><p class="d15">' + d.hint + '</p></div>' +
      '<p class="retry">' + ICON.micS + '<span>' + retry + '</span></p>' +
      '<button type="button" class="btn ghost full h44 mt" data-act="' + act('reveal') + '" data-arg="' + cr.id + '" data-k="rv-' + cr.id + '" aria-expanded="false" aria-controls="' + FID + 'cr-' + cr.id + '">정답 보기</button></li>';
  }
  var line = '';
  if (hintMode) {
    if (cr.how === 'self') line = '<p class="selfln">✓ 다음 말에서 스스로 고쳤어요</p>';
    else if (cr.how === 'repeat') line = '<p class="selfln">✓ 정답을 보고 고쳐 말했어요</p>';
    else if (autoOpen) line = '<p class="retry">' + ICON.micS + '<span>다음 말에서 고치지 못해 정답을 열었어요. 이렇게 다시 말해 보세요.</span></p>';
    else if (!cr.judged && st === 'PROPOSED') line = '<p class="retry">' + ICON.micS + '<span>정답을 보고 다시 말해 보세요.</span></p>';
  }
  var body = '<div class="cc-g"><div class="cc-b"><p class="l">내 문장</p><p class="ja" lang="ja">' + diffHTML(d.o, 'del') + '</p></div>' +
    '<div class="cc-b"><p class="l g ans-h" tabindex="-1" data-k="ans-' + cr.id + '">이렇게 고쳐요</p><p class="ja" lang="ja">' + diffHTML(d.c, 'add') + '</p></div></div>' +
    line + '<p class="cc-x">' + d.x + '</p>';
  var foot;
  if (st === 'PROPOSED') foot = '<p class="cc-n">선생님 제안이에요. 채택해야 저장돼요.</p><div class="btnrow"><button type="button" class="btn primary" data-act="' + act('accept') + '" data-arg="' + cr.id + '" data-k="ac-' + cr.id + '">채택</button><button type="button" class="btn ghost" data-act="' + act('reject') + '" data-arg="' + cr.id + '" data-k="rj-' + cr.id + '">무시</button></div>';
  else if (st === 'ACCEPTED') foot = '<p class="cc-s g">채택했어요' + (cr.word ? ' · 단어장에 저장했어요' : '') + '</p>';
  else foot = '<p class="cc-s">무시했어요 · 기록에 남지 않았어요</p>';
  return open + head + body + foot + '</li>';
}
function userMsg(m, cur) {
  var cr = m.cr ? S.crs[m.cr] : null;
  var card = cr && (cur || cr.deliver === 'NOW') ? '<ul class="clist">' + crCard(cr, cur) + '</ul>' : '';
  var meta = m.pend ? '<span>보내는 중…</span>' : '<button type="button" class="tl" data-act="' + (cur ? 'cmp-static' : 'oos') + '" aria-label="내 목소리 다시 듣기">▶ 내 목소리</button><span aria-hidden="true">·</span><span>' + m.at + '</span>';
  return '<div class="um"><p class="ub" lang="ja">' + esc(m.ja) + '</p><div class="meta">' + meta + '</div>' + card + '</div>';
}
function tutorMsg(m, cur) {
  var ja = cur && m.tc ? m.tc : m.ja;
  var speaking = !cur && S.tstate === 'speaking' && m === lastTutor();
  var a = cur ? 'cmp-static' : 'oos';
  return '<div class="tm"><span class="av sm" aria-hidden="true">' + AV + '</span><div class="tm-m"><p class="tn">' + TEACHER + (speaking ? ' · <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>말하는 중' : '') + '</p>' +
    '<p class="tb" lang="ja">' + esc(ja) + '</p><div class="meta">' +
    (speaking ? '<button type="button" class="tl" data-act="stop" aria-label="멈추기">■ 멈춤</button>' : '<button type="button" class="tl" data-act="' + a + '" aria-label="선생님 말 다시 듣기">▶ 다시 듣기</button>') +
    '<button type="button" class="tl" data-act="' + a + '">읽기</button><button type="button" class="tl" data-act="' + a + '">번역</button><span>' + m.at + '</span></div></div></div>';
}
function thinkMsg() {
  return '<div class="tm"><span class="av sm" aria-hidden="true">' + AV + '</span><div class="tm-m"><p class="tn">' + TEACHER + '</p><p class="tb think" role="status"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>선생님이 답을 쓰는 중이에요</p></div></div>';
}
function liveTail() {
  if (S.ptt !== 'recording' && S.ptt !== 'finishing') return '';
  return '<div class="um" data-live="tail"><p class="ub live" aria-hidden="true">' + (S.partial ? '<span lang="ja">' + esc(S.partial) + '</span><span aria-hidden="true">…</span>' : '<span class="kr">듣고 있어요…</span>') + '</p></div>';
}
function statusText() {
  if (S.ptt === 'recording') return '듣고 있어요 — 손을 떼면 보내요';
  if (S.ptt === 'finishing') return '알아듣는 중…';
  if (S.tstate === 'thinking') return '선생님이 생각하고 있어요';
  if (S.hint) return S.hint;
  if (S.tstate === 'speaking') return '선생님이 말하는 중 · 누르면 멈추고 말해요';
  var w = waitingCoach();
  if (w) return w.revealed ? '정답을 보고 다시 말해 보세요' : '힌트를 보고 다시 말해 보세요';
  return '누르고 있는 동안 말해요';
}
function indicator(cur) {
  return '<button type="button" class="ind" data-act="' + (cur ? 'cmp-static' : 'oos') + '" aria-label="선생님 목소리 상태: 온라인. 눌러서 자세히 보기"><span class="dot" aria-hidden="true"></span><span' + (cur ? '' : ' role="status"') + '>온라인</span><span class="gt" aria-hidden="true">›</span></button>';
}
function chipBtn(n, row) {
  return '<button type="button" class="lchip' + (S.bump ? ' bump' : '') + '" data-act="later-open" data-k="lchip" aria-haspopup="dialog" aria-label="모아 둔 교정 ' + n + '개 보기">' +
    '<span class="l2">모아 둔 교정</span><span class="s">교정</span><b class="num">' + n + '</b>' + (row ? '<span class="gt" aria-hidden="true">›</span>' : '') + '</button>';
}
function pttBtn() {
  var rec = S.ptt === 'recording', busy = S.ptt === 'finishing';
  return '<button type="button" class="ptt" data-ptt="1" data-k="ptt" aria-label="' + (S.tstate === 'speaking' ? '누르면 선생님 말을 멈추고 말하기' : '누르고 있는 동안 말하기') + '" aria-pressed="' + rec + '" aria-busy="' + busy + '" aria-describedby="' + FID + 'vs" data-rec="' + rec + '"' + (busy ? ' disabled' : '') + '>' +
    '<span class="ring" aria-hidden="true"></span>' + (busy ? '<span class="spin" aria-hidden="true"></span>' : ICON.mic) + '</button>';
}
function voiceBar(cur) {
  var speaking = !cur && S.tstate === 'speaking';
  var ptt = cur ? '<button type="button" class="ptt" data-act="cmp-static" aria-label="누르고 있는 동안 말하기"><span class="ring" aria-hidden="true"></span>' + ICON.mic + '</button>' : pttBtn();
  return '<div class="vbar"><p class="vstat" id="' + FID + 'vs"><span class="meter' + (!cur && S.ptt === 'recording' ? ' on' : '') + '"' + (cur ? '' : ' data-live="meter"') + ' aria-hidden="true"><i></i><i></i><i></i></span><span' + (cur ? '' : ' data-live="status"') + '>' + (cur ? '누르고 있는 동안 말해요' : statusText()) + '</span></p>' +
    '<div class="vrow"><button type="button" class="ib" data-act="' + (cur ? 'cmp-static' : 'oos') + '" aria-label="글자로 입력하기">' + ICON.kb + '</button><div class="vc">' + ptt + '</div>' +
    (speaking ? '<button type="button" class="ib stopb" data-act="stop" data-k="vstop" aria-label="선생님 말 멈추기">' + ICON.stop + '</button>' : '<span class="ib" aria-hidden="true"></span>') + '</div></div>';
}
function talkScreen(cur) {
  var n = cur ? 0 : laterCount();
  var chipA = !cur && S.dec.a === 'A' && n > 0 ? chipBtn(n, false) : '';
  var chipB = !cur && S.dec.a === 'B' && n > 0 ? '<div class="lrow">' + chipBtn(n, true) + '</div>' : '';
  var head = '<header class="lhead"><button type="button" class="back" data-act="' + (cur ? 'cmp-static' : 'oos') + '" aria-label="회화 목록으로">' + ICON.back + '</button><span class="av" aria-hidden="true">' + AV + '</span>' +
    '<div class="lh-m"><h1>' + TEACHER + '<span class="sr">, 회화: ' + TITLE + '</span></h1>' + indicator(cur) + '</div>' + chipA +
    '<button type="button" class="ib" data-act="' + (cur ? 'cmp-static' : 'menu') + '" data-k="menu" aria-label="회화 메뉴" aria-haspopup="dialog">' + ICON.more + '</button></header>';
  var msgs = '<p class="divider">9월 28일 (월)</p>' + S.msgs.map(function (m) {
    return m.k === 'u' ? userMsg(m, cur) : (m.k === 't' ? tutorMsg(m, cur) : thinkMsg());
  }).join('') + (cur ? '' : liveTail());
  return '<div class="app">' + head + '<div class="scroll" data-scroll data-bottom><div class="msgs"' + (cur ? '' : ' data-live-msgs="1"') + '>' + msgs + '</div></div>' + chipB + voiceBar(cur) +
    (cur ? '' : laterSheet() + menuSheet() + acceptSheet() + '<p class="sr" role="status" data-live="ann"></p>') + toastHTML() + '</div>';
}

/* 시트 */
function sheetWrap(kind, title, body, z2) {
  return '<div class="scrim' + (z2 ? ' z2' : '') + '" data-act="' + (z2 ? 'acc-bg' : 'sheet-bg') + '"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="' + FID + 'sh-' + kind + '" data-sheet="' + kind + '">' +
    '<div class="sheet-h"><h2 id="' + FID + 'sh-' + kind + '" tabindex="-1" data-k="sh-' + kind + '">' + title + '</h2><button type="button" class="ib" data-act="' + (z2 ? 'acc-close' : 'sheet-close') + '" data-k="x-' + kind + '" aria-label="닫기">✕</button></div>' + body + '</div></div>';
}
function laterSheet() {
  if (S.sheet !== 'later') return '';
  var list = laterList(), n = laterCount(), body;
  if (S.sheetState === 'loading') body = '<p class="sr" role="status">모아 둔 교정을 불러오는 중…</p><span class="skel" aria-hidden="true"></span><span class="skel" aria-hidden="true"></span>';
  else if (S.sheetState === 'error') body = '<div class="alert" role="alert"><p>모아 둔 교정을 불러오지 못했어요.</p><button type="button" class="alink" data-act="later-retry" data-k="lretry">다시 시도</button></div>';
  else if (!list.length) body = '<div class="empty-s"><p class="strong">모아 둔 교정이 없어요</p><p class="d13">유창성 방식에서는 작은 실수를 대화 중에 알리지 않고 여기에 모아 둬요.</p><button type="button" class="btn ghost full mt" data-act="sheet-close" data-k="lempty">닫기</button></div>';
  else {
    var top = n

        o[2].map(function (x) { return '<li class="p">' + x + '</li>'; }).join('') + o[3].map(function (x) { return '<li class="m">' + x + '</li>'; }).join('') + '</ul><span class="sel">' + (on ? '● 데모에 적용 중' : '○ 눌러서 데모에 적용') + '</span></label>';
    };
    return '<article class="dec"><h3>' + d.t + '</h3><div class="dec-g">' + opt('A') + opt('B') + '</div><button type="button" class="dlink" data-nav="' + d.see + '">이 결정이 보이는 화면 열기 ›</button></article>';
  }).join('');
  sideEl.innerHTML = '<section class="dcard"><h2>이 화면</h2><p class="dk">' + n[0] + '</p><ul class="dn">' + n[1].map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul></section>' +
    sideDemoActs() +
    '<section class="dcard decs"><h2>결정 필요 — 3가지</h2><p class="dsub">권고는 designer 판단이에요. 고르면 데모가 바로 바뀌어요(미리 보기용). 결정은 대화로 알려 주세요.</p>' + decs + '</section>';
}
function syncTop() {
  qa('#d-w button').forEach(function (b) {
    var v = b.getAttribute('data-w');
    b.setAttribute('aria-pressed', v === 'all' ? S.triple : (!S.triple && +v === S.w));
    if (v === 'all') { if (isCompare()) b.setAttribute('aria-disabled', 'true'); else b.removeAttribute('aria-disabled'); }
  });
  qa('#d-f button').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-f') === S.fit); });
  qa('#d-h button').forEach(function (b) { b.setAttribute('aria-pressed', +b.getAttribute('data-h') === S.h); });
}

/* ════════ 이벤트 ════════ */
document.addEventListener('click', function (e) {
  var nv = e.target.closest('[data-nav]');
  if (nv) { if (narrow()) navOpen = false; go(nv.getAttribute('data-nav')); if (narrow()) stageEl.scrollIntoView({ block: 'start' }); return; }
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var fr = el.closest('[data-frame]'); if (fr) lastFrame = +fr.getAttribute('data-frame');
  var act = el.getAttribute('data-act');
  if (act !== 'sheet-bg' && act !== 'acc-bg' && el.getAttribute('aria-disabled') === 'true') return;
  var fn = ACT[act]; if (fn) fn(el.getAttribute('data-arg'), el, e);
});
document.addEventListener('change', function (e) {
  var r = e.target.closest('[data-dec]');
  if (r) { S.dec[r.getAttribute('data-dec')] = r.value; render(); return; }
  var m = e.target.closest('[data-cm]');
  if (m) { var fr = m.closest('[data-frame]'); if (fr) lastFrame = +fr.getAttribute('data-frame'); S.set.mode = m.value; S._focus = 'cm-' + m.value; render(); }
});
document.addEventListener('input', function (e) {
  var t = e.target;
  if (t.getAttribute && t.getAttribute('data-inp') === 'meaning') {
    S.accMeaning = t.value;
    if (S.accErr && t.value.trim()) { S.accErr = null; t.classList.remove('bad'); t.removeAttribute('aria-invalid'); var er = t.parentNode.querySelector('.ferr'); if (er) er.remove(); }
  }
});
document.addEventListener('keydown', function (e) {
  var t = e.target;
  if ((e.key === ' ' || e.key === 'Enter') && t.hasAttribute && t.hasAttribute('data-ptt') && !e.repeat) { e.preventDefault(); pttDown(); return; }
  if (e.key === 'Escape') {
    if (S.accept) { ACT['acc-close'](); return; }
    if (S.sheet) ACT['sheet-close']();
  }
});
document.addEventListener('keyup', function (e) {
  if ((e.key === ' ' || e.key === 'Enter') && e.target.hasAttribute && e.target.hasAttribute('data-ptt')) pttUp();
});
document.addEventListener('pointerdown', function (e) {
  var b = e.target.closest('[data-ptt]');
  if (!b || b.disabled || e.button !== 0 || !e.isPrimary) return;
  var fr = b.closest('[data-frame]'); if (fr) lastFrame = +fr.getAttribute('data-frame');
  e.preventDefault();
  try { b.setPointerCapture(e.pointerId); } catch (x) { /* 무시 */ }
  pttDown();
});
document.addEventListener('pointerup', function () { pttUp(); });
document.addEventListener('pointercancel', function () {
  if (S.ptt === 'recording') { clearInterval(timers.rec); S.ptt = 'idle'; S.partial = ''; S.hint = '녹음이 중간에 멈췄어요. 다시 눌러 주세요.'; render(); }
});
document.addEventListener('contextmenu', function (e) { if (e.target.closest('[data-ptt]')) e.preventDefault(); });

document.getElementById('d-w').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  var v = b.getAttribute('data-w');
  if (v === 'all' && isCompare()) { dtoast('비교 화면은 한 폭으로 보여요'); return; }
  if (v === 'all') S.triple = !S.triple; else { S.triple = false; S.w = +v; }
  render();
});
document.getElementById('d-f').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; S.fit = b.getAttribute('data-f'); render(); });
var rsz = null;
window.addEventListener('resize', function () { clearTimeout(rsz); rsz = setTimeout(applyScale, 120); });
document.getElementById('d-h').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; S.h = +b.getAttribute('data-h'); render(); });
document.getElementById('d-t').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  var v = b.getAttribute('data-t');
  if (v === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', v);
  qa('#d-t button').forEach(function (x) { x.setAttribute('aria-pressed', x === b); });
});
document.getElementById('d-reset').addEventListener('click', function () { go('set-compare'); });

/* 시작: 주소 #<id> 가 있으면 그 상태로(QA·가이드 인용용) */
var start = (location.hash || '').replace('#', '');
var known = false; PRESETS.forEach(function (g) { g[1].forEach(function (p) { if (p[0] === start) known = true; }); });
go(known ? start : 'set-compare');
})();
</script>
</body>
