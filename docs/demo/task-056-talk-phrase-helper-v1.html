    toast('(데모) 보냈다고 쳐요 — 선생님 대답은 생략'); render();
  }
});
document.addEventListener('pointerdown', function (e) {
  var b = e.target.closest && e.target.closest('[data-ph="prop"] .ptt');
  if (!b || e.button !== 0) return;
  pressing = true; lastPtr = Date.now(); clearTimeout(timers.rec); startRec();
});
function release() { if (!pressing) return; pressing = false; lastPtr = Date.now(); endRec(); }
document.addEventListener('pointerup', release);
document.addEventListener('pointercancel', release);
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  var inPh = document.activeElement && document.activeElement.closest && document.activeElement.closest('[data-ph="prop"]');
  if (inPh && P.open) { e.preventDefault(); P.open = false; P.kb = false; P.focus = false; render({ focusBtn: true }); }
});

renderScope(); renderDev(); renderBars();
preset('hp-closed'); render();
})();
</script>
</body>
