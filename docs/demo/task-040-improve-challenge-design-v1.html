<title>챌린지 · 계획표 개편</title>
<style>
/* 레이아웃: 위 조작 줄 → 결정 필요(접힘) → 상태 줄 → 왼쪽 화면 목록 · 가운데 휴대폰 · 오른쪽 설명 → 화면×상태 전수 → 수치 대조 → 설계서와 다르게 그린 곳 */
/* 토큰: src/app/globals.css 값을 그대로 고정(링크하지 않음). 새 색 없음 */
:root {
  color-scheme: light dark;
  --ground: #f6f7f4; --surface: #ffffff; --surface2: #eef0ea;
  --ink: #1e2420; --ink2: #5a6359; --ink3: #8b948a; --line: #dde2d9;
  --accent: #c8471f; --accent-soft: #fbe9e3; --on-accent: #ffffff;
  --good: #3e6b3a; --good-soft: #e4efe2; --warn: #c98a12; --warn-soft: #fbf0d6;
  --bad: #b3261e; --bad-soft: #f9e3e1;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #141816; --surface: #1d2320; --surface2: #262d29;
    --ink: #ecefe9; --ink2: #aeb6ac; --ink3: #7e877d; --line: #333b36;
    --accent: #f06a45; --accent-soft: #3a241e; --on-accent: #1a0e0a;
    --good: #7fb27a; --good-soft: #223121; --warn: #e0a93a; --warn-soft: #3a2f14;
    --bad: #f28b82; --bad-soft: #3d1f1d;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #141816; --surface: #1d2320; --surface2: #262d29;
  --ink: #ecefe9; --ink2: #aeb6ac; --ink3: #7e877d; --line: #333b36;
  --accent: #f06a45; --accent-soft: #3a241e; --on-accent: #1a0e0a;
  --good: #7fb27a; --good-soft: #223121; --warn: #e0a93a; --warn-soft: #3a2f14;
  --bad: #f28b82; --bad-soft: #3d1f1d;
}
:root[data-theme="light"] { color-scheme: light; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--ground); color: var(--ink);
  font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
}
:lang(ja) {
  font-family: "Noto Sans JP", "Noto Sans CJK JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", Meiryo, sans-serif;
  line-break: strict; word-break: normal;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; padding: 0; }
p, h1, h2, h3, h4, ul, ol, dl, dd, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
.num { font-variant-numeric: tabular-nums; }
.kk { word-break: keep-all; overflow-wrap: anywhere; }

/* ── 데모 틀(휴대폰 밖) ── */
.dtop { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 60; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }

.lvl { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; background: var(--surface2); font-size: 12px; font-weight: 700; margin-left: 6px; vertical-align: 2px; }
.dctls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; min-width: 0; }

.dseg button[aria-disabled="true"] { color: var(--ink3); cursor: not-allowed; }
.djump { display: inline-flex; align-items: center; min-height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--accent); background: var(--surface); color: var(--ink); font-size: 12.5px; font-weight: 700; text-decoration: none; }
.dvar { display: flex; align-items: flex-start; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }

.dstage { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 22px; min-width: 0; }
.fw { margin: 0; min-width: 0; display: flex; flex-direction: column; align-items: center; }

.tagc, .tagp { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 6px; font-size: 11px; font-weight: 700; margin-right: 6px; }
.tagc { background: var(--surface2); color: var(--ink2); }
.tagp { background: var(--accent-soft); color: var(--ink); }
.dside { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.dcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; min-width: 0; }
.dcard > h2 { font-size: 13px; font-weight: 700; margin-bottom: 8px; }
.dcard .dk { font-size: 15px; font-weight: 700; margin-bottom: 6px; }

.dcard ul.dn { list-style: disc; } .dcard ol.dn { list-style: decimal; }

.dcard .dsl { display: flex; flex-wrap: wrap; gap: 6px; }
.dcard .dsl a { display: inline-flex; align-items: center; min-height: 32px; padding: 0 10px; border-radius: 8px; background: var(--surface2); color: var(--ink); text-decoration: none; font-size: 12.5px; }
.dcard .dsl a[aria-current="true"] { background: var(--accent-soft); font-weight: 700; }
.dtw { overflow-x: auto; }
.dtbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.dtbl th, .dtbl td { text-align: left; vertical-align: top; padding: 6px 6px; border-top: 1px solid var(--line); }
.dtbl thead th { font-weight: 600; color: var(--ink2); font-size: 12px; border-top: 0; white-space: nowrap; }
.dtbl th[scope="row"] { white-space: nowrap; font-weight: 700; }
.dtbl td a { color: var(--ink); }
.dtbl .na { color: var(--ink2); }
.dpanel { margin: 4px 16px 24px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; scroll-margin-top: 120px; }
.dpanel > h2, .dpanel > summary { font-size: 18px; font-weight: 700; text-wrap: balance; }
.dpanel .dsub { font-size: 13px; color: var(--ink2); margin-top: 4px; max-width: 92ch; }
details.dpanel > summary { cursor: pointer; list-style: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; min-height: 44px; }
details.dpanel > summary::-webkit-details-marker { display: none; }
details.dpanel > summary::before { content: "▸"; font-size: 14px; color: var(--ink2); }
details.dpanel[open] > summary::before { content: "▾"; }
.dsumc { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; font-weight: 500; }
.dsumc span { display: inline-flex; align-items: center; min-height: 24px; padding: 0 8px; border-radius: 6px; background: var(--surface2); color: var(--ink); }
.dsumc span.chg { background: var(--accent-soft); font-weight: 700; }
.dq { border-top: 1px solid var(--line); padding-top: 16px; margin-top: 18px; container-type: inline-size; scroll-margin-top: 120px; }
.dq > h3 { font-size: 15px; font-weight: 700; }
.dq > h3 .did { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--ink2); margin-right: 6px; }
.dq > p { font-size: 13px; color: var(--ink2); margin-top: 4px; max-width: 92ch; }
.dq-g { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; margin-top: 10px; }
@container (min-width: 640px) { .dq-g.c2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .dq-g.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.opt { display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--line); border-radius: 12px; padding: 12px; cursor: pointer; background: var(--surface); position: relative; min-width: 0; }
.opt.on { box-shadow: inset 0 0 0 2px var(--accent); }
.opt input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.opt:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.opt-h { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 14px; font-weight: 700; }
.opt-h .rec { display: inline-flex; height: 20px; align-items: center; padding: 0 7px; border-radius: 6px; background: var(--good-soft); color: var(--good); font-size: 11px; font-weight: 700; }
.opt-d { font-size: 13px; }
.opt ul { font-size: 12.5px; color: var(--ink2); display: flex; flex-direction: column; gap: 2px; }
.opt li.p::before { content: "+ "; color: var(--good); font-weight: 700; }
.opt li.m::before { content: "− "; color: var(--bad); font-weight: 700; }
.opt .sel { font-size: 12px; color: var(--ink2); }
.opt.on .sel { color: var(--ink); font-weight: 600; }
.dex { margin-top: 4px; border-radius: 10px; background: var(--surface2); padding: 10px; font-size: 12.5px; }
.dex b { font-weight: 700; }
.dsum { margin-top: 14px; border-radius: 12px; background: var(--surface2); padding: 10px 12px; font-size: 13px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.dsum button { min-height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 0 12px; font-size: 12.5px; font-weight: 600; }
.dref { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 14px; font-size: 13px; }
.dref li { padding: 4px 0; }
.minis { display: flex; gap: 16px; overflow-x: auto; padding: 6px 2px 10px; }
.minif { flex: none; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.minif figcaption { font-size: 12.5px; font-weight: 700; }
.minif figcaption.on { color: var(--accent); }
.miniw { position: relative; overflow: hidden; border-radius: 18px; flex: none; }
.miniw .phone { transform: scale(.6); transform-origin: top left; position: absolute; left: 0; top: 0; }
.dnote li { padding: 6px 0; border-top: 1px solid var(--line); font-size: 13px; }
.dnote li:first-child { border-top: 0; }
.dnote b { font-weight: 700; }
.dtoast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 90; transform: translateX(-50%); max-width: calc(100vw - 32px); background: var(--ink); color: var(--surface); border-radius: 12px; padding: 10px 14px; font-size: 13px; box-shadow: 0 6px 18px rgba(0,0,0,.2); }
@media (max-width: 1280px) { .dlay { grid-template-columns: 200px minmax(0, 1fr); } .dside { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; } }
@media (max-width: 760px) {
  .dlay { grid-template-columns: minmax(0, 1fr); gap: 12px; padding: 12px 16px; }
  .dnav { position: static; max-height: none; }
  .dside { grid-template-columns: minmax(0, 1fr); }
  .dtop { position: static; flex-direction: column; align-items: stretch; flex-wrap: nowrap; gap: 6px; padding: 8px 16px; }
  .dtop h1 { font-size: 14px; margin-right: 0; }
  .dctls { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; gap: 10px; }
  .dctls::-webkit-scrollbar { display: none; }
  .dvar { flex-direction: column; gap: 4px; }
  .dpanel { margin: 4px 12px 24px; padding: 14px; }
  .dstage { justify-content: flex-start; overflow-x: auto; flex-wrap: nowrap; padding-bottom: 6px; }
}

/* ── 휴대폰 프레임 ── */
.phone { position: relative; overflow: hidden; border-radius: 26px; background: var(--ground); box-shadow: 0 0 0 1px var(--line), 0 14px 36px rgba(0,0,0,.14); flex: none; }
.w360 { width: 360px; } .w390 { width: 390px; } .w412 { width: 412px; }
.h780 { height: 780px; } .h892 { height: 892px; }
.app { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--ground); min-width: 0; }
.main { position: relative; flex: 1 1 auto; min-height: 0; min-width: 0; overflow-y: auto; overscroll-behavior: contain; background: var(--ground); }
.scr { position: relative; flex: 1 1 auto; min-height: 0; min-width: 0; overflow-y: auto; overscroll-behavior: contain; }
.pad { padding: 0 16px 32px; min-width: 0; }
.pad2 { padding: 14px 16px 32px; min-width: 0; }
.omit { margin-top: 18px; border: 1.5px dashed var(--line); border-radius: 12px; padding: 10px 12px; font-size: 12px; color: var(--ink2); text-align: center; }

/* AppBar · BackBar · TabBar */
.appbar { position: sticky; top: 0; z-index: 10; margin-bottom: 10px; height: 52px; display: flex; align-items: center; gap: 8px; background: var(--surface); padding: 0 12px 0 16px; }
.appbar h1 { flex: 1; min-width: 0; font-size: 20px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; outline: none; }
.me { width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: none; border-radius: 50%; flex: none; }
.me span { width: 32px; height: 32px; border-radius: 50%; background: var(--good); color: #fff; font-size: 13px; font-weight: 600; display: grid; place-items: center; }
.bb { height: 52px; flex: none; display: flex; align-items: center; gap: 4px; min-width: 0; border-bottom: 1px solid var(--line); background: var(--surface); padding: 0 4px; }
.back, .icb { width: 44px; height: 44px; flex: none; display: grid; place-items: center; border: 0; background: none; border-radius: 50%; color: var(--ink); }
.bb-m { flex: 1; min-width: 0; }
.bb-m h1 { font-size: 17px; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; outline: none; }
.bb-m p { font-size: 12px; line-height: 1.25; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.endb { height: 44px; flex: none; border: 0; background: none; border-radius: 12px; padding: 0 12px; font-size: 14px; font-weight: 500; color: var(--ink2); }
.tabbar { flex: none; display: flex; border-top: 1px solid var(--line); background: var(--surface); padding: 6px 0 max(10px, env(safe-area-inset-bottom, 0px)); }
.tab { flex: 1; min-width: 0; min-height: 56px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding-top: 4px; border: 0; background: none; border-radius: 12px; font-size: 11px; color: var(--ink3); text-decoration: none; }
.tab[aria-current="page"] { color: var(--accent); font-weight: 600; }

/* 공용(common/ui.tsx) */
.card { min-width: 0; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); padding: 14px; }
.card.flat { border-color: transparent; background: var(--surface2); }

.sec { margin-top: 18px; min-width: 0; }

.seg { display: flex; gap: 3px; padding: 3px; border-radius: 12px; background: var(--surface2); min-width: 0; }
.seg button { position: relative; flex: 1; min-width: 0; height: 36px; border: 0; border-radius: 9px; background: none; font-size: 13.5px; font-weight: 500; color: var(--ink2); padding: 0 4px; }
.seg button::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 44px; transform: translateY(-50%); }

.ptoast { position: absolute; left: 16px; right: 16px; bottom: 84px; z-index: 50; background: var(--ink); color: var(--surface); border-radius: 12px; padding: 10px 14px; font-size: 13px; text-align: center; box-shadow: 0 6px 18px rgba(0,0,0,.2); }

/* 시트(common/Sheet.tsx) */
.shw { position: absolute; inset: 0; z-index: 40; }
.scrim { position: absolute; inset: 0; background: rgba(20, 24, 22, .45); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 85%; display: flex; flex-direction: column; background: var(--surface); border-radius: 16px 16px 0 0; box-shadow: 0 -8px 24px rgba(0,0,0,.18); min-width: 0; }

.sh-h h2 { flex: 1; min-width: 0; font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; outline: none; }
.sh-b { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 12px 16px calc(18px + env(safe-area-inset-bottom, 0px)); min-width: 0; }

/* ── 계획표 달력(지금 그대로 + 챌린지 표시) ── */
.mnav { display: flex; align-items: center; gap: 2px; min-width: 0; }
.mnav h2 { flex: 1; min-width: 0; font-size: 18px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.todayb { position: relative; margin-right: 2px; height: 32px; flex: none; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); padding: 0 12px; font-size: 13px; font-weight: 600; color: var(--ink3); }
.todayb::before { content: ""; position: absolute; left: -2px; right: -2px; top: -7px; bottom: -7px; }
.ib { width: 44px; height: 44px; flex: none; display: grid; place-items: center; border: 0; background: none; border-radius: 12px; color: var(--ink); }
.ib[aria-disabled="true"] { color: var(--ink3); }
.sum3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 6px; }
.sum3 > div { min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 6px; text-align: center; }
.sum3 b { display: block; font-size: 20px; font-weight: 700; line-height: 1.3; font-variant-numeric: tabular-nums; }
.sum3 span { display: block; font-size: 12px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wkh, .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.wkh { margin-top: 14px; }
.wkh span { height: 24px; line-height: 24px; text-align: center; font-size: 12px; color: var(--ink2); }
.cell { position: relative; height: 66px; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; border-radius: 10px; border: 1px solid transparent; padding: 6px 0 0; background: none; color: var(--ink); font: inherit; }
button.cell::before { content: ""; position: absolute; top: 0; bottom: 0; left: -2px; right: -2px; }
.cell.study { background: var(--surface); border-color: var(--line); }
.cell.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.cell .n { font-size: 13px; line-height: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.cell.fut .n { color: var(--ink3); font-weight: 500; }
.cell.none .n { color: var(--ink2); font-weight: 500; }
.cell.blank { visibility: hidden; }
.cell.skc { background: var(--surface2); }
.mk { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; width: 37px; }
.tc { width: 17px; height: 17px; flex: none; border-radius: 5px; display: grid; place-items: center; font-size: 11px; font-weight: 700; line-height: 1; background: var(--surface2); color: var(--ink); }
.tc.cg { border-radius: 50%; }
.tc.cg.met { background: var(--good-soft); color: var(--good); }
.tc.cg.par { background: var(--warn-soft); color: var(--ink); }
.tc.cg.mis { background: var(--surface); color: var(--ink2); box-shadow: inset 0 0 0 1.5px var(--ink3); }
.tc.more { background: none; color: var(--ink2); font-weight: 600; }
.adot { display: block; width: 9px; height: 9px; flex: none; border-radius: 50%; border: 1.5px solid var(--ink2); margin-top: 7px; }
.band { position: absolute; left: 5px; right: 5px; bottom: 1px; height: 3px; border-radius: 2px; background: var(--accent); }
.legend { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--ink2); }
.legend li { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.legend .lband { display: block; width: 17px; height: 3px; border-radius: 2px; background: var(--accent); }
.legend .ltd { display: block; width: 17px; height: 17px; border-radius: 5px; box-shadow: inset 0 0 0 2px var(--accent); }
.mnote { margin-top: 12px; border-radius: 12px; background: var(--surface2); padding: 12px 14px; font-size: 13px; }
.grow { margin-top: 18px; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; border-radius: 14px; background: var(--surface2); padding: 14px; }
.grow h2 { font-size: 15px; font-weight: 600; }
.grow p { margin-top: 4px; font-size: 13px; color: var(--ink2); }
.dayl { display: flex; align-items: center; gap: 6px; min-width: 0; }
.dayl p { flex: 1; min-width: 0; font-size: 13px; color: var(--ink2); }
.lg { display: grid; grid-template-columns: 30px minmax(0, 1fr) 44px; align-items: center; gap: 10px; min-height: 64px; padding: 8px 0; border-top: 1px solid var(--line); }
.lg .tcl { width: 30px; height: 30px; border-radius: 9px; font-size: 14px; display: grid; place-items: center; font-weight: 700; background: var(--surface2); }
.lg b { display: block; font-size: 14px; font-weight: 600; }
.lg .m { display: block; font-size: 12.5px; color: var(--ink2); }
.lg a, .lg > span:not(.tcl) { color: inherit; text-decoration: none; min-width: 0; min-height: 44px; display: flex; flex-direction: column; justify-content: center; }
.lg .bdg { align-self: flex-start; }

/* ── 챌린지 공통 — 하루 상태(달성 ✓ · 일부 ◐ · 놓침 ✕ · 오늘 · 예정): 글자·모양·색을 함께 ── */
.g { display: grid; place-items: center; border-radius: 50%; font-weight: 700; line-height: 1; flex: none; }
.g.met { background: var(--good-soft); color: var(--good); }
.g.par { background: var(--warn-soft); color: var(--ink); }
.g.mis { background: var(--surface); color: var(--ink2); box-shadow: inset 0 0 0 1.5px var(--ink3); }
.g.tod { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 2px var(--accent); }
.g.up { background: transparent; color: var(--ink2); border: 1.5px dashed var(--ink3); }
.g.end { background: var(--surface2); color: var(--ink2); }
.ch-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; margin-top: -10px; }
.eyb { font-size: 12.5px; font-weight: 600; color: var(--ink2); min-width: 0; }
.eyb b { color: var(--ink); font-weight: 700; }
.ch-t { font-size: 17px; font-weight: 700; line-height: 1.35; overflow-wrap: anywhere; }
.ch-s { margin-top: 2px; font-size: 13px; color: var(--ink2); overflow-wrap: anywhere; }
.pips { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-top: 12px; }
.pip { height: 32px; border-radius: 9px; font-size: 14px; }
.pip.g.tod, .pip.g.up { font-size: 11.5px; }
.pipsum { margin-top: 6px; font-size: 12px; color: var(--ink2); }
.h3s { margin-top: 14px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-size: 14px; font-weight: 700; }
.h3s span { font-size: 12.5px; font-weight: 600; color: var(--ink2); }
.tasks { margin-top: 8px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.task { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 56px; padding: 8px 12px; color: var(--ink); text-decoration: none; background: none; border: 0; width: 100%; text-align: left; }
li + li > .task { border-top: 1px solid var(--line); }
.tk { width: 26px; height: 26px; font-size: 13px; }
.tk.todo { box-shadow: inset 0 0 0 1.5px var(--ink3); color: var(--ink2); background: var(--surface); border-radius: 50%; display: grid; place-items: center; }
.tk.fail { background: var(--bad-soft); color: var(--bad); border-radius: 50%; display: grid; place-items: center; font-weight: 700; }
.tk.wait { color: var(--ink2); display: grid; place-items: center; }
.tt { min-width: 0; }
.tt b { display: block; font-size: 14.5px; font-weight: 600; line-height: 1.35; }
.tt span { display: block; font-size: 12.5px; color: var(--ink2); line-height: 1.4; overflow-wrap: anywhere; }
.go { font-size: 13px; font-weight: 600; white-space: nowrap; color: var(--ink); }
.go.muted { color: var(--ink2); font-weight: 500; }
.st2, .st3 { display: grid; gap: 8px; margin-top: 10px; }
.st2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.st3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.stt { min-width: 0; border-radius: 12px; background: var(--surface2); padding: 10px 12px; }
.card.flat .stt, .stt.on { background: var(--surface); }
.stt b { display: block; font-size: 22px; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
.stt .l { display: block; font-size: 12.5px; font-weight: 600; margin-top: 2px; }
.stt .s { display: block; font-size: 12px; color: var(--ink2); }
.st3 .stt { padding: 10px 8px; }
.st3 .stt b { font-size: 20px; }
.gm { display: flex; align-items: center; gap: 10px; border-radius: 12px; padding: 10px 12px; background: var(--good-soft); color: var(--ink); min-width: 0; }
.gm .g { width: 28px; height: 28px; font-size: 14px; }
.gm .g.solid { background: var(--good); color: var(--surface); }
.gm .tx { flex: 1; min-width: 0; font-size: 13.5px; }
.gm .tx b { display: block; font-size: 14.5px; font-weight: 700; }
.gm.part { background: var(--surface2); }
.note1 { margin-top: 8px; font-size: 12px; color: var(--ink2); }

/* 상세(S4) */
.strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 10px; }
.sday { position: relative; min-width: 0; min-height: 78px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 3px; padding: 6px 0; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; }
.sday::before { content: ""; position: absolute; top: 0; bottom: 0; left: -2px; right: -2px; }
.sday .d { font-size: 12px; color: var(--ink2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.sday .g { width: 26px; height: 26px; font-size: 13px; }
.sday .w { font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.sday.tod { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.sday.up { border-style: dashed; border-color: var(--ink3); background: transparent; }
.sday.end { background: var(--surface2); border-color: transparent; }
.slg { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--ink2); }
.slg li { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.slg .g { width: 18px; height: 18px; font-size: 11px; }
.bars2 { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.bar2 .r { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.bar2 .r b { font-weight: 700; font-variant-numeric: tabular-nums; }
.bar2 .t { margin-top: 4px; height: 8px; border-radius: 999px; background: var(--surface2); overflow: hidden; }
.bar2 .t i { display: block; height: 100%; border-radius: 999px; background: var(--ink2); }
.bar2.ok .t i { background: var(--good); }
.xcs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.xc { display: inline-flex; align-items: baseline; flex-wrap: wrap; gap: 0 6px; max-width: 100%; min-width: 0; border-radius: 10px; background: var(--surface2); padding: 5px 10px; }
.xc [lang="ja"] { font-size: 16px; overflow-wrap: anywhere; }
.xc .fu { line-height: 2.1; }
.xc .m { font-size: 12px; color: var(--ink2); }
.xc .xs { font-size: 12px; font-weight: 700; }
.xc.ok .xs { color: var(--good); }
.xc.new { background: transparent; border: 1.5px dashed var(--ink3); padding: 3.5px 8.5px; }
.xlg { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--ink2); }
details.more > summary { display: flex; min-height: 44px; align-items: center; gap: 6px; cursor: pointer; font-size: 13.5px; font-weight: 600; list-style: none; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::after { content: "▾"; color: var(--ink2); font-size: 12px; }
details.more[open] > summary::after { content: "▴"; }
.chart { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; align-items: end; height: 124px; margin-top: 12px; border-bottom: 1px solid var(--line); }
.ccol { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 0; }
.cbars { display: flex; align-items: flex-end; gap: 4px; height: 100px; }
.cbar { position: relative; width: 13px; border-radius: 3px 3px 0 0; }
.cbar.ls { background: var(--ink2); }
.cbar.wd { background: var(--surface); box-shadow: inset 0 0 0 2px var(--ink2); }
.cbar i { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); margin-bottom: 2px; font-style: normal; font-size: 11px; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.cnone { font-size: 11px; color: var(--ink2); padding-bottom: 4px; white-space: nowrap; }
.cx { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 4px; }
.cx span { text-align: center; font-size: 11px; color: var(--ink2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.clg { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink2); }
.clg li { display: inline-flex; align-items: center; gap: 6px; }
.clg i { display: block; width: 12px; height: 12px; border-radius: 2px; }
.clg i.ls { background: var(--ink2); }
.clg i.wd { box-shadow: inset 0 0 0 2px var(--ink2); }
.dz { margin-top: 24px; border-top: 1px solid var(--line); padding-top: 14px; }
.rules li { position: relative; padding-left: 14px; font-size: 13px; margin-top: 4px; }
.rules li::before { content: "·"; position: absolute; left: 4px; color: var(--ink2); font-weight: 700; }

/* 만들기(S3) */
.steps { flex: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 8px 12px 10px; background: var(--surface); border-bottom: 1px solid var(--line); }
.stp { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; color: var(--ink2); min-width: 0; }
.stp .c { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--surface2); color: var(--ink2); }
.stp.done .c { background: var(--good-soft); color: var(--good); }
.stp.cur .c { background: var(--accent); color: var(--on-accent); }
.stp.cur { color: var(--ink); font-weight: 700; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
legend { padding: 0; font-size: 15px; font-weight: 600; }
.ropts { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.ropt { position: relative; display: flex; gap: 10px; align-items: flex-start; min-height: 56px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 12px 14px; cursor: pointer; min-width: 0; }
.ropt input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.ropt.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.ropt:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.rdot { flex: none; width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--ink3); margin-top: 1px; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: transparent; }
.rdot.sq { border-radius: 6px; }
.ropt.on .rdot { background: var(--accent); box-shadow: none; color: var(--on-accent); }
.rbody { flex: 1; min-width: 0; }
.rbody .t { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; font-size: 15px; font-weight: 600; }
.rbody .t [lang="ja"] { font-size: 13px; font-weight: 400; color: var(--ink2); }
.rbody .d, .rbody .m { display: block; }
.rbody .d { margin-top: 2px; font-size: 13px; color: var(--ink2); }
.rbody .m { margin-top: 2px; font-size: 12px; color: var(--ink2); }
.rbody .m.new { color: var(--good); font-weight: 600; }
.rside { flex: none; display: flex; align-items: center; gap: 6px; }
.subl { margin: 12px 0 6px; font-size: 12.5px; color: var(--ink2); }
.actbar { flex: none; padding: 10px 16px max(12px, env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); background: var(--surface); }
.acterr { margin-bottom: 8px; font-size: 12.5px; color: var(--bad); }
.acterr.info { color: var(--ink2); }
.dl { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 8px 10px; font-size: 14px; }
.dl dt { color: var(--ink2); font-size: 13px; padding-top: 1px; }
.dl dd { min-width: 0; overflow-wrap: anywhere; }
.inp { display: block; width: 100%; height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 0 12px; font-size: 16px; color: var(--ink); }

/* 오늘 탭(S6) */
.cstrip { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; min-height: 60px; border-radius: 14px; background: var(--surface2); padding: 10px 6px 10px 14px; color: var(--ink); text-decoration: none; }
.cstrip b { display: block; font-size: 14px; font-weight: 700; }
.cstrip .s { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; margin-top: 2px; font-size: 12.5px; color: var(--ink2); }
.cstrip .s .g { width: 18px; height: 18px; font-size: 11px; display: inline-grid; vertical-align: -4px; margin-right: 3px; }
.cstrip .go { display: inline-flex; align-items: center; min-height: 44px; padding: 0 6px; }
.cstrip.met { background: var(--good-soft); }
.chiprow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 6px; }
.mini5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; margin-top: 10px; }
.mini5 li { height: 28px; display: grid; place-items: center; border-radius: 8px; font-size: 11.5px; background: var(--surface2); color: var(--ink2); white-space: nowrap; overflow: hidden; }
.mini5 li.cur { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: inset 0 0 0 1.5px var(--accent); }
.mini5 li.done { background: var(--good-soft); color: var(--good); font-weight: 600; }
.recb { margin-top: 10px; border-radius: 12px; background: var(--surface2); padding: 10px 12px; }
.recb .r1 { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--ink2); }
.recb .r2 { margin-top: 2px; font-size: 15px; font-weight: 600; }
.recb .r3 { margin-top: 2px; font-size: 12px; color: var(--ink2); }

/* 덱(S7) */
.dprog { flex: none; padding: 12px 16px 0; }
.dprog .r { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.dprog .n { font-size: 15px; font-weight: 600; }
.dbar { margin-top: 6px; display: flex; gap: 2px; }
.dbar i { height: 6px; min-width: 0; flex: 1; border-radius: 999px; background: var(--surface2); }
.dbar i.ok { background: var(--good); } .dbar i.ng { background: var(--bad); } .dbar i.cur { background: var(--accent); }
.dnotice { flex: none; padding: 8px 16px 0; }
.dnotice > div { display: flex; min-width: 0; align-items: center; gap: 4px; border-radius: 12px; background: var(--surface2); padding: 2px 0 2px 12px; font-size: 13px; color: var(--ink2); }
.dnotice p { flex: 1; min-width: 0; padding: 6px 0; word-break: keep-all; }

document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.matches('[data-dec]')) { S.dec[t.getAttribute('data-dec')] = t.value; renderDecide(); renderStage(); renderData(); var f = document.querySelector('input[name="' + t.name + '"]:checked'); if (f) f.focus({ preventScroll: true }); return; }
  if (!t.closest('[data-main]')) return;
  var a = t.getAttribute('data-act');
  if (a === 's3topic') { S.s3.topic = t.value; rerenderKeepFocus('input[name="s3topic"]:checked'); }
  if (a === 's3len') { S.s3.len = Number(t.value); rerenderKeepFocus('input[name="s3len"]:checked'); }
  if (a === 's3goal') { S.s3[t.getAttribute('data-k')] = t.checked; rerenderKeepFocus('input[data-k="' + t.getAttribute('data-k') + '"]'); }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && $('[data-main] [data-sheet]')) { e.preventDefault(); closeSheet(); }
});

/* 위 조작 줄 */
function segCtl(id, fn) {
  $('#' + id).addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.getAttribute('aria-disabled') === 'true') { dToast('이 화면은 새로 생기는 화면이라 지금 화면이 없어요'); return; }
    $$('#' + id + ' button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
    fn(b.getAttribute('data-v'));
  });
}
segCtl('d-w', function (v) { S.w = Number(v); renderStage(); renderDecide(); });
segCtl('d-h', function (v) { S.h = Number(v); renderStage(); });
segCtl('d-view', function (v) { S.view = v; renderStage(); });
segCtl('d-t', function (v) { S.theme = v; if (v === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', v); });
$('#d-lay').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  var k = b.getAttribute('data-k'); P[k] = !P[k]; syncLay(); renderStage(); renderDecide();
});
$('#d-jump').addEventListener('click', function () { $('#decide').open = true; });

/* 시작 */
(function init() {
  var h = (location.hash || '').slice(1);
  if (h && h.indexOf('.') > 0 && VARS[h.split('.')[0]]) { var p = h.split('.'); S.scr = p[0]; if (varMeta(p[0], p[1])[0] === p[1]) S.v[p[0]] = p[1]; }
  else if (VARS[h]) S.scr = h;
  renderStage(); renderMatrix(); renderData(); renderNotes(); renderDecide();
})();
})();
</script>
</body>
