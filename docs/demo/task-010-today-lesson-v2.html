/* ── 토큰: src/app/globals.css 값을 그대로 고정(링크하지 않음) ── */
:root {

    --accent: #f06a45; --accent-soft: #3a241e; --on-accent: #1a0e0a;
    --good: #7fb27a; --good-soft: #223121; --warn: #e0a93a; --warn-soft: #3a2f14;

  }
}

  --ground: #141816; --surface: #1d2320; --surface2: #262d29;
  --ink: #ecefe9; --ink2: #aeb6ac; --ink3: #7e877d; --line: #333b36;
  --accent: #f06a45; --accent-soft: #3a241e; --on-accent: #1a0e0a;
  --good: #7fb27a; --good-soft: #223121; --warn: #e0a93a; --warn-soft: #3a2f14;
  --bad: #f28b82; --bad-soft: #3d1f1d;

}
:root[data-theme="light"] { color-scheme: light; }

* { box-sizing: border-box; }

}

.dtop { position: sticky; top: 0; z-index: 60; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
  padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }

.dnav button:hover { background: var(--surface2); color: var(--ink); }

/* 틀 배치: 휴대폰은 실제 CSS 폭·높이로 배치하고, 자리가 모자라면 같은 배율(--s)로 통째 축소.

.fold span { position: absolute; right: 10px; top: -24px; font-size: 11px; font-weight: 600; line-height: 18px; padding: 0 6px; border-radius: 6px; background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.dtoast { position: fixed; left: 50%; bottom: 24px; z-index: 90; transform: translateX(-50%); max-width: calc(100vw - 32px); background: var(--ink); color: var(--surface); border-radius: 12px; padding: 10px 14px; font-size: 13px; box-shadow: 0 6px 18px rgba(0,0,0,.2); }
.dside { display: flex; flex-direction: column; gap: 12px; min-width: 0; }

  /* 휴대폰: 상단 컨트롤은 제목 1줄 + 가로로 밀리는 한 줄(≈90px), 따라다니지 않는다 */

}

function narrow() { return window.innerWidth <= 760; }
/* 배율: 모든 틀에 같은 값. 기준은 가장 큰 틀(412 × 892) — 선택한 폭·높이로 맞추면 차이가 사라지므로 금지 */
function applyScale() {
  if (!LAST) return;
  var n = LAST.list.length, gap = 22;
  var availW = stageEl.clientWidth;
  var top = document.querySelector('.dtop');
  var topH = getComputedStyle(top).position === 'sticky' ? top.offsetHeight : 0;
  var availH = window.innerHeight - topH - 92;
  var sW = availW / 412, sH = S.fit === 'screen' ? availH / 892 : 9;
  var sBase = Math.min(1, sW, sH);
  var sum = LAST.base.reduce(function (a, b) { return a + b; }, 0);
  var sRow = (availW - (n - 1) * gap) / sum;
  var row = n > 1 && sRow >= 0.45;
  var sc = row ? Math.min(sBase, sRow) : sBase;
  sc = Math.max(0.3, Math.floor(sc * 1000) / 1000);
  curScale = sc;
  stageEl.style.setProperty('--s', String(sc));
  stageEl.classList.toggle('row', row);
  var pct = Math.round(sc * 100);
  Array.prototype.forEach.call(stageEl.querySelectorAll('[data-scale-cap]'), function (e) {
    e.textContent = pct >= 100 ? '실제 배치 · 100% 크기' : '실제 배치, 화면에 맞춰 ' + pct + '% 축소';
  });
}
function render() {

    var fold = S.h === 892 ? '<div class="fold" aria-hidden="true"><span>780 · 주소창이 보이면 여기까지</span></div>' : '';

      '<div class="fbox w' + f.w + ' h' + S.h + '"><div class="phone w' + f.w + ' h' + S.h + '" data-frame="' + i + '">' + f.fn() + fold + '</div></div>' +

    B: ['가리고 듣기', '느리게 들을 땐 글자를 가리고, 보통 속도로 듣거나 [글자 보기]를 누르면 보여요. 자막만 상태면 늘 보여요.', ['듣기 → 메모 → 글자로 확인 순서가 메모 기능과 맞물려요'], ['초급자는 첫 회가 어려울 수 있어요(언제든 [글자 보기] 1탭)']] }
];
function sideDemoActs() {
  var b = function (act, label) { return '<button type="button" class="dbtn" data-act="' + act + '">' + label + '</button>'; };
  var acts = [];
  if (S.view === 'gen' && !S.gen.fail) acts.push(b('d-gen-done', '바로 완성'), b('d-gen-fail', '실패로'), b('d-gen-off', S.gen.offline ? '연결 복구' : '연결 끊김'));
  if (S.view === 'lesson' || S.view === 'talk') acts.push(b('d-tts', S.tts === 'ONLINE' ? '선생님 목소리 → 자막만' : '선생님 목소리 → 온라인'));
  if (S.view === 'lesson' && S.stage < 5) acts.push(b('d-save-fail', '다음 저장 1회 실패'));
  if (S.view === 'lesson' && (S.stage === 5 || (S.stage === 4 && S.app.voice))) acts.push(b('d-mic-denied', S.sttErr ? '마이크 허용으로' : '마이크 막힘'), b('d-stt-empty', S.forceEmpty ? '인식 정상으로' : '다음 인식 빈 결과'));
  if (S.view === 'lesson' && S.stage === 5) acts.push(b('d-done-fail', '마치기 기록 1회 실패'));
  if (!acts.length) return '';
  return '<section class="dcard"><h2>시연 조작 <span class="dsub">(휴대폰 밖 · 실제 화면에는 없어요)</span></h2><div class="dacts">' + acts.join('') + '</div></section>';
}
function renderSide() {
  var n = NOTES[noteKey()] || NOTES.home;
  var decs = DECS.map(function (d) {
    var opt = function (k) {
      var o = d[k], on = S.dec[d.k] === k, rec = d.rec === k;
      return '<label class="opt' + (rec ? ' rec' : '') + (on ? ' on' : '') + '"><input type="radio" name="dec-' + d.k + '" value="' + k + '" data-dec="' + d.k + '"' + (on ? ' checked' : '') + '>' +
        '<span class="opt-h">' + k + ' · ' + o[0] + (rec ? ' ' + badge('good', 'designer 권고') : '') + '</span><span class="opt-d">' + o[1] + '</span><ul>' +
        o[2].map(function (x) { return '<li class="p">' + x + '</li>'; }).join('') + o[3].map(function (x) { return '<li class="m">' + x + '</li>'; }).join('') + '</ul><span class="sel">' + (on ? '● 데모에 적용 중' : '○ 눌러서 데모에 적용') + '</span></label>';
    };
    return '<article class="dec"><h3>' + d.t + '</h3><div class="dec-g">' + opt('A') + opt('B') + '</div><button type="button" class="dlink" data-nav="' + d.see + '">이 결정이 보이는 화면 열기 ›</button></article>';
  }).join('');
  sideEl.innerHTML = '<section class="dcard"><h2>이 화면</h2><p class="dk">' + n[0] + '</p><ul class="dn">' + n[1].map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul></section>' +
    sideDemoActs() +
    '<section class="dcard decs"><h2>결정 필요 — 4가지</h2><p class="dsub">권고는 designer 판단이에요. 고르면 데모가 바로 바뀌어요(미리 보기용). 결정은 대화로 알려 주세요.</p>' + decs + '</section>';
}
function syncTop() {
  Array.prototype.forEach.call(document.querySelectorAll('#d-w button'), function (b) {
    var v = b.getAttribute('data-w');
    b.setAttribute('aria-pressed', v === 'all' ? S.triple : (!S.triple && +v === S.w));
    if (v === 'all') { if (S.view === 'compare') b.setAttribute('aria-disabled', 'true'); else b.removeAttribute('aria-disabled'); }
  });
  Array.prototype.forEach.call(document.querySelectorAll('#d-f button'), function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-f') === S.fit); });
  Array.prototype.forEach.call(document.querySelectorAll('#d-h button'), function (b) { b.setAttribute('aria-pressed', +b.getAttribute('data-h') === S.h); });
}

/* ════════ 이벤트 ════════ */
document.addEventListener('click', function (e) {
  var nv = e.target.closest('[data-nav]');
  if (nv) { if (narrow()) navOpen = false; go(nv.getAttribute('data-nav')); if (narrow()) stageEl.scrollIntoView({ block: 'start' }); return; }
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var fr = el.closest('[data-frame]'); if (fr) lastFrame = +fr.getAttribute('data-frame');
  var act = el.getAttribute('data-act');
  if (act !== 'sheet-bg' && el.getAttribute('aria-disabled') === 'true') { var why = el.getAttribute('data-why'); if (why) toast(why); return; }
  var fn = ACT[act]; if (fn) fn(el.getAttribute('data-arg'), el, e);
});
document.addEventListener('change', function (e) {
  var r = e.target.closest('[data-dec]');
  if (!r) return;
  S.dec[r.getAttribute('data-dec')] = r.value; stopPlay(); render();
});
document.addEventListener('input', function (e) {
  var t = e.target, k = t.getAttribute && t.getAttribute('data-inp');
  if (!k) return;
  if (k === 'paste') {
    S.paste = t.value; S.pasteErr = null;
    var m = pasteMeta();
    Array.prototype.forEach.call(document.querySelectorAll('[data-live="phint"]'), function (x) { x.textContent = m.hint; x.classList.toggle('bad', m.bad); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-live="pcount"]'), function (x) { x.textContent = m.n.toLocaleString('ko-KR') + ' / 2,000자'; x.classList.toggle('bad', m.bad); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-k="paste-go"]'), function (b) {
      if (m.ok) { b.removeAttribute('aria-disabled'); b.removeAttribute('data-why'); } else { b.setAttribute('aria-disabled', 'true'); b.setAttribute('data-why', m.n > 2000 ? '2,000자까지 넣을 수 있어요' : '50자 이상 넣어 주세요'); }
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-frame] .alert'), function (x) { x.remove(); });
  } else if (k === 'app') {
    S.app.text[S.app.i] = t.value;
    var n = cpLen(t.value);
    Array.prototype.forEach.call(document.querySelectorAll('[data-live="acount"]'), function (x) { x.textContent = n + ' / 200자'; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-k="acmp"]'), function (b) { if (n) { b.removeAttribute('aria-disabled'); } else { b.setAttribute('aria-disabled', 'true'); b.setAttribute('data-why', '먼저 문장을 써 보세요'); } });
  } else if (k === 'spk') {
    S.spk.draft = t.value;
  }
});
document.addEventListener('keydown', function (e) {
  var t = e.target;
  if (e.key === 'Enter' && t.getAttribute && t.getAttribute('data-memo') !== null && !e.isComposing) {
    e.preventDefault(); var fr = t.closest('[data-frame]'); if (fr) lastFrame = +fr.getAttribute('data-frame');
    addMemo(+t.getAttribute('data-memo'), fr); return;
  }
  if (e.key === 'Enter' && !e.shiftKey && t.getAttribute && t.getAttribute('data-inp') === 'spk' && !e.isComposing) { e.preventDefault(); ACT['spk-send'](); return; }
  if ((e.key === ' ' || e.key === 'Enter') && t.hasAttribute && t.hasAttribute('data-ptt') && !e.repeat) { e.preventDefault(); pttDown(); return; }
  if (e.key === 'Escape' && S.sheet) { ACT['sheet-close'](); }
});
document.addEventListener('keyup', function (e) {
  if ((e.key === ' ' || e.key === 'Enter') && e.target.hasAttribute && e.target.hasAttribute('data-ptt')) pttUp();
});
document.addEventListener('pointerdown', function (e) {
  var b = e.target.closest('[data-ptt]');
  if (!b || b.disabled || e.button !== 0 || !e.isPrimary) return;
  var fr = b.closest('[data-frame]'); if (fr) lastFrame = +fr.getAttribute('data-frame');
  e.preventDefault();
  try { b.setPointerCapture(e.pointerId); } catch (x) { /* 무시 */ }
  pttDown();
});
document.addEventListener('pointerup', function () { pttUp(); });
document.addEventListener('pointercancel', function () {
  if (S.ptt === 'recording') { clearInterval(timers.rec); S.ptt = 'idle'; S.hint = '녹음이 중간에 멈췄어요. 다시 눌러 주세요.'; render(); }
});
document.addEventListener('contextmenu', function (e) { if (e.target.closest('[data-ptt]')) e.preventDefault(); });

document.getElementById('d-w').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  var v = b.getAttribute('data-w');
  if (v === 'all' && S.view === 'compare') { dtoast('비교 화면은 한 폭으로 보여요'); return; }
  if (v === 'all') S.triple = !S.triple; else { S.triple = false; S.w = +v; }
  render();
});
document.getElementById('d-f').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; S.fit = b.getAttribute('data-f'); render(); });
var rsz = null;
window.addEventListener('resize', function () { clearTimeout(rsz); rsz = setTimeout(applyScale, 120); });
document.getElementById('d-h').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; S.h = +b.getAttribute('data-h'); render(); });
document.getElementById('d-t').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  var v = b.getAttribute('data-t');
  if (v === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', v);
  Array.prototype.forEach.call(document.querySelectorAll('#d-t button'), function (x) { x.setAttribute('aria-pressed', x === b); });
});
document.getElementById('d-reset').addEventListener('click', function () { go('home-compare'); });

/* 시작: 주소 #<id> 가 있으면 그 상태로(QA·가이드 인용용) */
var start = (location.hash || '').replace('#', '');
var known = false; PRESETS.forEach(function (g) { g[1].forEach(function (p) { if (p[0] === start) known = true; }); });
go(known ? start : 'home-compare');
})();
</script>
</body>
</html>
