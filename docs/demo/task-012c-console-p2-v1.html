function go(id) {
  stopTimers();
  var keep = { w: S.w, h: S.h, triple: S.triple, dec: S.dec, fit: S.fit };
  resetData();
  S = fresh(keep);
  S.preset = id; S._reset = true;
  PRESETS.forEach(function (g) { g[1].forEach(function (p) { if (p[0] === id) p[2](); }); });
  if (S.cmp) S.triple = false;
  if (S.page === 'conn') { S.target = S.connKey; S.scope = 'ENGINE_CONNECTION'; }
  if (S.tab === 'raw' && !can('config.raw.read')) S.tab = 'form';
  if (S.sheet) S._focus = 'sht-' + (S.sheet === 'ver' && S.vMode === 'rb' ? 'rb' : S.sheet);
  var run = S._run, ap = S._apply, rb = S._rebase, cool = S._cool, en = S._enabled, rbg = S._rb, scl = S._scroll;
  S._run = S._apply = S._rebase = S._cool = S._enabled = S._rb = S._scroll = null;
  if (scl) S._scrollTo = scl;
  render();
  if (run === 'test') startTest();
  if (cool) tickCool();
  if (ap) { submitApply(); if (rb) ACT.rebase(); }
  if (en) ACT['enabled-go']();
  if (rbg) ACT['rb-go']();
  try { history.replaceState(null, '', '#' + id); } catch (e) { /* 무시 */ }
}

        o[2].map(function (x) { return '<li class="p">' + x + '</li>'; }).join('') + o[3].map(function (x) { return '<li class="m">' + x + '</li>'; }).join('') + '</ul><span class="sel">' + (on ? '● 데모에 적용 중' : '○ 눌러서 데모에 적용') + '</span></label>';
    };
    return '<article class="dec"><h3>' + d.t + '</h3><div class="dec-g">' + opt('A') + opt('B') + '</div><button type="button" class="dlink" data-nav="' + d.see + '">이 결정이 보이는 화면 열기 ›</button></article>';
  }).join('');
  var vis = '<ul class="dvis">' + visItems().map(function (x) { return '<li><span class="' + (x[0] ? 'y">보임' : 'n">그림 없음') + '</span><span>' + x[1] + ' <code>' + x[2] + '</code></span></li>'; }).join('') + '</ul>';
  sideEl.innerHTML = '<section class="dcard"><h2>이 화면</h2><p class="dk">' + n[0] + '</p><ul class="dn">' + n[1].map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul></section>' +
    '<section class="dcard"><h2>' + S.role + ' · ' + S.env + ' 에게 보이는 버튼 <span class="dsub">(권한 없는 버튼은 비활성이 아니라 그리지 않아요)</span></h2>' + vis + '<p class="dsub mt8">위 막대의 역할·환경은 지금 화면에만 적용돼요. 왼쪽 목록을 누르면 그 상태의 기본값(대개 SUPER_ADMIN · LOCAL)으로 돌아가요.</p></section>' +
    sideActs() +
    '<section class="dcard decs"><h2>결정 필요 — 6가지</h2><p class="dsub">권고는 designer 판단이에요. 고르면 데모가 바로 바뀌어요(미리 보기용). 결정은 대화로 알려 주세요.</p>' + decs + '</section>' +
    '<section class="dcard wide"><h2>Leader 확인 요청 <span class="dsub">(계약·정본 — 사용자 결정 아님)</span></h2><ol class="dn">' + ASKS.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ol><p class="dsub mt8">데모 표기: 엔진·모델 자리는 가명(엔진 A~E, model-s 등) — 실제 화면은 서버 DTO 의 엔진 표시명을 그대로 써요. 주소(10.0.0.x·203.0.113.x)·비밀 이름·사람은 전부 가짜예요.</p></section>';
}
function syncTop() {
  Array.prototype.forEach.call(document.querySelectorAll('#d-w button'), function (b) {
    var v = b.getAttribute('data-w');
    b.setAttribute('aria-pressed', v === 'all' ? S.triple : (!S.triple && +v === S.w));
    if (v === 'all' && S.cmp) b.setAttribute('aria-disabled', 'true'); else b.removeAttribute('aria-disabled');
  });
  Array.prototype.forEach.call(document.querySelectorAll('#d-h button'), function (b) { b.setAttribute('aria-pressed', +b.getAttribute('data-h') === S.h); if (isDesk() && !S.triple) b.setAttribute('aria-disabled', 'true'); else b.removeAttribute('aria-disabled'); });
  Array.prototype.forEach.call(document.querySelectorAll('#d-r button'), function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-r') === S.role); });
  Array.prototype.forEach.call(document.querySelectorAll('#d-e button'), function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-e') === S.env); });
  Array.prototype.forEach.call(document.querySelectorAll('#d-f button'), function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-f') === S.fit); });
}

/* ════════ 이벤트 ════════ */
document.addEventListener('click', function (e) {
  var nv = e.target.closest('[data-nav]');
  if (nv) { if (narrow()) navOpen = false; go(nv.getAttribute('data-nav')); if (narrow()) stageEl.scrollIntoView({ block: 'start' }); return; }
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var fr = el.closest('[data-frame]'); if (fr) lastFrame = +fr.getAttribute('data-frame');
  var act = el.getAttribute('data-act');
  if (act !== 'sheet-close' && el.getAttribute('aria-disabled') === 'true') { var why = el.getAttribute('data-why'); if (why) { toast(why); render(); } return; }
  if (fr && fr.closest('.fw') && S.cmp && +fr.getAttribute('data-frame') === 0 && act !== 'demo-cur') { dtoast('왼쪽은 지금 화면이에요 — 오른쪽 제안 화면에서 눌러 보세요'); return; }
  var fn = ACT[act]; if (fn) fn(el.getAttribute('data-arg'), el, e);
});
document.addEventListener('change', function (e) {
  var r = e.target.closest('[data-dec]');
  if (r) {
    var k = r.getAttribute('data-dec'); S.dec[k] = r.value;
    if (k === 'd5' && r.value === 'B' && S.scope === 'VOICE_PROFILE') { S.scope = 'ENGINE_CONNECTION'; S.target = 'llm-http-aux'; clearDraft(); }
    if (k === 'd6' && S.scope === 'APP_SETTING') { var d = S.draft; S.target = r.value === 'B' ? 'app:*' : 'app:voice.preview.defaultText'; S.draft = {}; Object.keys(d).forEach(function (x) { if (fieldBy(x)) S.draft[x] = d[x]; }); resetFlow(); }
    if (k === 'd4' && r.value === 'B') S.connEdit = false;
    render(); return;
  }
  var t = e.target, key = t.getAttribute && t.getAttribute('data-inp');
  if (key === 'f' || key === 'sel') render();
});
function coerce(f, raw) {
  if (f.type === 'INT' || f.type === 'NUM') { var s = String(raw).trim(); if (s !== '' && isFinite(Number(s))) return Number(s); return s; }
  return raw;
}
var rawTimer = null;
document.addEventListener('input', function (e) {
  var t = e.target, k = t.getAttribute && t.getAttribute('data-inp');
  if (!k) return;
  var fr = t.closest('[data-frame]'); if (fr) lastFrame = +fr.getAttribute('data-frame');
  if (k === 'f' || k === 'sel') {
    var key = t.getAttribute('data-key'), f = fieldBy(key);
    setDraftKey(key, coerce(f, t.value));
    if (t.getAttribute('aria-invalid')) { t.removeAttribute('aria-invalid'); }
    if (k === 'sel') { render(); return; }
    patchLive();
  } else if (k === 'reason') { S.reason = t.value; S.rErr = null; patchLive(); }
  else if (k === 'confirm') { S.confirm = t.value; S.cErr = null; }
  else if (k === 'raw') {
    S.rawText = t.value; t.rows = t.value.split('\n').length;
    clearTimeout(rawTimer);
    rawTimer = setTimeout(function () {
      var before = S.rawState; parseRaw(); resetFlow();
      if (before !== S.rawState) render(); else patchLive();
    }, 300);
  }
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && S.sheet) { ACT['sheet-close'](); } });
document.getElementById('d-w').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  var v = b.getAttribute('data-w');
  if (v === 'all' && S.cmp) { dtoast('비교 화면은 한 폭으로 보여요'); return; }
  if (v === 'all') { S.triple = !S.triple; if (S.triple && isDesk()) S.w = 390; } else { S.triple = false; S.w = +v; }
  render();
});
document.getElementById('d-h').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; if (isDesk() && !S.triple) { dtoast('데스크톱 틀은 높이 800 고정이에요'); return; } S.h = +b.getAttribute('data-h'); render(); });
document.getElementById('d-r').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  S.role = b.getAttribute('data-r');
  if (S.tab === 'raw' && !can('config.raw.read')) { S.tab = 'form'; S.rawEdit = false; }
  if (S.sheet === 'cred' && !can('credentials.manage')) closeSheet();
  if (S.sheet === 'prod' && !can('config.apply.production')) closeSheet();
  render();
});
document.getElementById('d-e').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  S.env = b.getAttribute('data-e');
  if (S.sheet === 'apply' || S.sheet === 'prod') closeSheet();
  render();
});
document.getElementById('d-f').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; S.fit = b.getAttribute('data-f'); render(); });
var rsz = null;
window.addEventListener('resize', function () { clearTimeout(rsz); rsz = setTimeout(applyScale, 120); });
document.getElementById('d-t').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  var v = b.getAttribute('data-t');
  if (v === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', v);
  Array.prototype.forEach.call(document.querySelectorAll('#d-t button'), function (x) { x.setAttribute('aria-pressed', x === b); });
});
document.getElementById('d-reset').addEventListener('click', function () { go('cfg-compare'); });

/* 시작: 주소 #<id> 가 있으면 그 상태로(QA·가이드 인용용). 넓은 창은 데스크톱 폭으로 */
resetData();
S = fresh({ w: window.innerWidth >= 1100 ? 1280 : 390 });
var start = (location.hash || '').replace('#', '');
var known = false; PRESETS.forEach(function (g) { g[1].forEach(function (p) { if (p[0] === start) known = true; }); });
go(known ? start : 'cfg-compare');
})();
</script>
