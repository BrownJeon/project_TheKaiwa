    A: ['하나만(단일 선택)', '분류 칩처럼 하나를 고르면 앞의 선택이 풀려요.', ['분류 줄과 같은 동작이라 따로 배울 게 없어요', '머리 줄이 “N5 기초 · 느낌 조각”처럼 짧게 읽혀요', '서버 조건 값이 하나(4종 + 없음)'], ['“이름+액션”처럼 묶어 보려면 두 번 나눠 봐야 해요']],
    B: ['여러 개(다중 선택)', '누를 때마다 켜고 꺼요(✓ 표시). “전체”를 누르면 모두 풀려요.', ['이름+액션처럼 묶어 볼 수 있어요'], ['분류(하나)와 조각(여럿)의 동작이 달라 헷갈려요', '조각끼리는 “또는”, 분류와는 “그리고”라 결과 수를 읽기 어려워요', '서버 조건이 목록이 돼요']] },
  { k: 'c', t: '(c) 조각 줄에 “없음” 칩을 둘까요', q: '서버는 “조각 없음” 조건을 받을 수 있게 만들어요. 화면에 칩으로 보일지 정해 주세요.', see: 'list-none', rec: 'A',
    A: ['보임(맨 끝)', '“없음” = 조각이 정해지지 않은 단어. 대부분 직접 넣은 단어예요.', ['출처 뱃지가 사라진 뒤에도 “내가 직접 넣은 단어”를 모아 볼 길이 남아요', '(a) 뱃지 생략과 짝 — 표시는 안 해도 찾을 수는 있어요'], ['칩이 6개라 360·390 폭에서 끝 칩이 살짝 가로로 밀려요(412는 한 줄)']],
    B: ['숨김', '조각 네 가지만 두고, 조각 없는 단어는 “전체”에서만 보여요.', ['칩 5개라 360 폭에서도 한 줄에 다 보여요'], ['조각 없는 단어만 따로 볼 방법이 없어요']] },
  { k: 'd', t: '(d) 예문도 들려줄까요', q: '단어 소리는 확정 범위예요. 예문 재생을 함께 넣을지 제안해요.', see: 'detail-idle', rec: 'B',
    A: ['단어만', '표현 옆 ▶ 하나만 둬요.', ['버튼 하나라 가장 단순해요'], ['예문은 글자로만 봐요']],
    B: ['단어 + 예문', '예문 카드 오른쪽에도 ▶. 같은 문장 음성 경로를 써서 새 API 가 없어요.', ['단어가 문장 속에서 어떻게 들리는지 바로 확인해요', '오늘의 단어 개선(IMP-0011: 단어·예문 재생)과 같은 버튼을 나눠 써요'], ['100자 넘는 예문(직접 쓴 긴 예문)은 한 번에 만들 수 없어 버튼을 숨겨요 — 기본 단어 예문은 모두 14자 이하']] },
  { k: 'e', t: '(e) 상세 시트의 “출처” 절', q: '사용자 결정 Q2 는 “목록 뱃지 교체”예요. 상세 시트의 출처 정보는 어떻게 할까요?', see: 'detail-correction', rec: 'A',
    A: ['남김(지금 그대로)', '목록 뱃지만 바꾸고, 상세의 “출처” 절(문장·점검 결과 보기·추가한 날)은 유지해요.', ['교정 단어 → 그 채팅 점검 결과로 가는 길이 남아요', '목록에서 사라진 정보를 필요할 때 확인해요'], ['시트 길이가 지금과 같아요']],
    B: ['상세에서도 뺌', '“출처” 절을 없애고 “추가한 날”만 기록 절 끝으로 옮겨요.', ['시트가 세 줄쯤 짧아져요'], ['[점검 결과 보기] 링크가 사라져 교정 단어의 맥락을 잃어요', 'Q2 요청 범위(목록)를 넘어요']] }
];
function renderDecs() {
  var decs = DECS.map(function (d) {
    var opt = function (k) {
      var o = d[k], on = S.dec[d.k] === k, rec = d.rec === k;
      return '<label class="opt' + (rec ? ' rec' : '') + (on ? ' on' : '') + '"><input type="radio" name="dec-' + d.k + '" value="' + k + '" data-dec="' + d.k + '"' + (on ? ' checked' : '') + '>' +
        '<span class="opt-h">' + k + ' · ' + o[0] + (rec ? ' ' + badge('neutral', 'designer 권고') : '') + '</span><span class="opt-d">' + o[1] + '</span><ul>' +
        o[2].map(function (x) { return '<li class="p">' + x + '</li>'; }).join('') + o[3].map(function (x) { return '<li class="m">' + x + '</li>'; }).join('') + '</ul><span class="sel">' + (on ? '● 데모에 적용 중' : '○ 눌러서 데모에 적용') + '</span></label>';
    };
    return '<article class="dec"><h3>' + d.t + '</h3><p class="dq">' + d.q + '</p><div class="dec-g">' + opt('A') + opt('B') + '</div><button type="button" class="dlink" data-nav="' + d.see + '">이 결정이 보이는 화면 열기 ›</button></article>';
  }).join('');
  decsEl.innerHTML = '<h2 id="dec-h">결정 필요 — 5가지 <span class="dsub">권고(초록 테두리)는 designer 판단이에요. 고르면 위 데모가 바로 바뀌어요(미리 보기용). 결정은 대화로 알려 주세요.</span></h2>' +
    '<div class="dec-list">' + decs + '</div>';
}
function syncTop() {
  Array.prototype.forEach.call(document.querySelectorAll('#d-w button'), function (b) {
    var v = b.getAttribute('data-w');
    b.setAttribute('aria-pressed', v === 'all' ? S.triple : (!S.triple && +v === S.w));
    if (v === 'all') { if (S.view === 'compare') b.setAttribute('aria-disabled', 'true'); else b.removeAttribute('aria-disabled'); }
  });
  Array.prototype.forEach.call(document.querySelectorAll('#d-f button'), function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-f') === S.fit); });
  Array.prototype.forEach.call(document.querySelectorAll('#d-h button'), function (b) { b.setAttribute('aria-pressed', +b.getAttribute('data-h') === S.h); });
}

/* ════════ 이벤트 ════════ */
document.addEventListener('click', function (e) {
  var nv = e.target.closest('[data-nav]');
  if (nv) { if (narrow()) navOpen = false; go(nv.getAttribute('data-nav')); if (narrow()) stageEl.scrollIntoView({ block: 'start' }); return; }
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var fr = el.closest('[data-frame]'); if (fr) lastFrame = +fr.getAttribute('data-frame');
  var act = el.getAttribute('data-act');
  var fn = ACT[act]; if (fn) fn(el.getAttribute('data-arg'), el, e);
});
document.addEventListener('change', function (e) {
  var r = e.target.closest('[data-dec]');
  if (!r) return;
  S.dec[r.getAttribute('data-dec')] = r.value;
  normChunk();
  if (S.dec.d === 'A' && S.snd.target === 'ex') stopSnd();
  if (S.snd.msg && S.snd.msg.target === 'ex' && S.dec.d === 'A') S.snd.msg = null;
  render();
});
document.addEventListener('input', function (e) {
  var t = e.target;
  if (!t.getAttribute || t.getAttribute('data-inp') !== 'q') return;
  var fr = t.closest('[data-frame]'); if (fr) lastFrame = +fr.getAttribute('data-frame');
  S.qInput = t.value;
  if (e.isComposing) return;
  clearTimeout(timers.q);
  timers.q = setTimeout(function () { S.f.q = S.qInput.trim(); S.shown = 30; render(); }, 300);
});
document.addEventListener('compositionend', function (e) {
  var t = e.target;
  if (!t.getAttribute || t.getAttribute('data-inp') !== 'q') return;
  S.qInput = t.value;
  clearTimeout(timers.q);
  timers.q = setTimeout(function () { S.f.q = S.qInput.trim(); S.shown = 30; render(); }, 300);
});
document.addEventListener('keydown', function (e) {
  var t = e.target;
  if (e.key === 'Enter' && t.getAttribute && t.getAttribute('data-inp') === 'q' && !e.isComposing) {
    e.preventDefault(); clearTimeout(timers.q); S.qInput = t.value; S.f.q = t.value.trim(); S.shown = 30; t.blur(); render(); return;
  }
  if (e.key === 'Escape' && S.sheet) ACT['sheet-close']();
});
document.getElementById('d-w').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  var v = b.getAttribute('data-w');
  if (v === 'all' && S.view === 'compare') { dtoast('비교 화면은 한 폭으로 보여요'); return; }
  if (v === 'all') S.triple = !S.triple; else { S.triple = false; S.w = +v; }
  render();
});
document.getElementById('d-f').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; S.fit = b.getAttribute('data-f'); render(); });
document.getElementById('d-h').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; S.h = +b.getAttribute('data-h'); render(); });
document.getElementById('d-t').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  var v = b.getAttribute('data-t');
  if (v === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', v);
  Array.prototype.forEach.call(document.querySelectorAll('#d-t button'), function (x) { x.setAttribute('aria-pressed', x === b); });
});
document.getElementById('d-reset').addEventListener('click', function () { S.dec = { a: REC.a, b: REC.b, c: REC.c, d: REC.d, e: REC.e }; go('list-compare'); });
var rsz = null;
window.addEventListener('resize', function () { clearTimeout(rsz); rsz = setTimeout(applyScale, 120); });
stageEl.addEventListener('scroll', function (e) { if (e.target.hasAttribute && e.target.hasAttribute('data-scroll')) { clearTimeout(rsz); rsz = setTimeout(measure, 80); } }, true);

/* 시작: 주소 #<id> 가 있으면 그 상태로(QA·가이드 인용용) */
var start = (location.hash || '').replace('#', '');
var known = false; PRESETS.forEach(function (g) { g[1].forEach(function (p) { if (p[0] === start) known = true; }); });
go(known ? start : 'list-compare');
window.addEventListener('hashchange', function () {
  var id = (location.hash || '').replace('#', ''), ok = false;
  PRESETS.forEach(function (g) { g[1].forEach(function (p) { if (p[0] === id) ok = true; }); });
  if (ok && id !== S.preset) go(id);
});
})();
