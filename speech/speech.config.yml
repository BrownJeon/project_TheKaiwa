# =============================================================================
# speech.config.yml — TheKaiwa 음성 플랫폼의 APPLICATION_CONFIG 층 (설정 해석 규칙 3순위)
#
# 이 파일은 "런타임 진실"이 아니다. 설정은 아래 8층 순서로 합성되며(정본:
# docs/design/configuration-resolution.md) 이 파일은 그중 3번째 층이다.
#
#   1 DEFAULT(ConfigurationSchema 기본값, 코드)
#   2 SOURCE_CODE(어댑터 상수·tutor.md v0)
#   3 APPLICATION_CONFIG  ← 이 파일 (speech/speech.config.yml, 앱은 app.config.yml)
#   4 ENVIRONMENT(env 변수: SPEECH_* / TTS_SERVICE_URL / WHISPER_SERVICE_URL …)
#   5 DATABASE(ConfigurationVersion ACTIVE — 콘솔에서 Apply 한 값)
#   6 CONNECTION_PROFILE(EngineConnection.connection / runtime JSON)
#   7 USER_SETTING(UserVoiceSetting·UserSpeechSetting — 사용자 요청 시에만)
#   8 RUNTIME_OVERRIDE(TEMPORARY·SESSION, TTL 만료 시 자동 무효)
#
# 읽는 주체: Next.js 앱(src/modules/infra/config → engine/configuration/resolver),
#           speech/gateway, speech/worker (speech/common/config.py). tts-service 는 읽지 않는다
#           (AGPL 경계 — 자기 env 만 읽음).
# 첫 기동 시 seed(prisma/seed-data/engines.json)와 이 파일로 EngineConnection 6종이 만들어지고,
# 그 뒤 콘솔 변경은 DATABASE/CONNECTION_PROFILE 층에 쌓여 이 파일을 덮어쓴다.
# DB 를 못 읽는 상황(degraded)에서는 1~4층만으로 부팅한다.
#
# 규칙
# - 시크릿 값 금지. 자격증명은 credentialRef 이름만(예: "env:OPENAI_API_KEY") 쓰고 값은
#   SecretResolver 가 해석한다. 이 파일에는 ref 조차 두지 않는다(Connection Profile 의 몫).
# - 각 키의 편집성(editability)을 주석에 표기한다:
#     [RO]  READ_ONLY         — 콘솔에서 보기만, 변경은 코드
#     [RT]  RUNTIME_EDITABLE  — 콘솔 Apply 즉시 반영(서비스는 POST /admin/config/apply 수신)
#     [RS]  RESTART_REQUIRED  — Apply 는 되지만 pm2 restart 뒤 반영(콘솔이 안내)
#     [RD]  REDEPLOY_REQUIRED — 코드·모델 배포가 필요, 콘솔은 거부
# - engineId 와 connectionId 는 서로 다른 네임스페이스다(둘 다 "claude-cli"일 수 있다).
#   engineId: reazon-sherpa · whisper · style-bert-vits2 · claude-cli · home-m4
#   connectionId(seed 6종): reazon-ondevice · reazon-gateway · whisper-voicevault · style-bert-m4 · claude-cli · home-m4
# - 이 파일에 엔진명이 등장하는 것은 정상이다(엔진명 허용 위치 = engine/adapters·seed·speech/**).
# =============================================================================

version: 1                       # [RO] 파일 스키마 버전. 파서가 모르는 버전이면 부팅 거부

speech:
  # ---------------------------------------------------------------------------
  # STT — 실시간(대화용)과 검증(분석용)을 분리한다 (기획안 §3.1·§3.2)
  # ---------------------------------------------------------------------------
  stt:
    realtime:
      engine: reazon-sherpa                                   # [RD] 실시간 엔진 engineId. 바꾸면 어댑터·모델 배포가 필요
      model: zipformer-ja-reazonspeech-2024-08-01-int8        # [RD] sherpa-onnx 모델 이름 = /models/<name>/manifest.json 의 model
      vad: silero                                             # [RD] VAD 모델(sherpa-onnx 내장 silero_vad.onnx)
      endpoint_silence_ms: 500                                # [RT] 발화 종료로 판정하는 무음 길이. P0 실측 ①·② 로 400~600 사이 튜닝
      vad_threshold: 0.5                                      # [RT] silero 확률 임계
      min_speech_ms: 250                                      # [RT] 이보다 짧은 세그먼트는 버림(숨소리·잡음)
      max_segment_sec: 30                                     # [RT] 세그먼트 강제 분할 상한(오프라인 디코더 입력 상한)
      sample_rate: 16000                                      # [RO] 모델 고정값
      num_threads: 2                                          # [RS] 디코더 스레드. 온디바이스(Connection reazon-ondevice.runtime)와 gateway 각각 실측
      decoding_method: greedy_search                          # [RS] greedy_search | modified_beam_search(느림·정확)
      partial: true                                           # [RT] 세그먼트 단위 partial 이벤트 송출
    validation:
      engine: whisper                                         # [RD] 분석(검증) 엔진 engineId
      mode: http                                              # [RS] http(VoiceVault whisper-service 재사용) | local(faster-whisper 직접 로드)
      endpoint: http://127.0.0.1:8090                         # [RS] http 모드 대상. env WHISPER_SERVICE_URL 이 4순위로 덮어씀
      model: medium                                           # [RD] http 모드에선 서비스 쪽 값이라 읽기 전용에 가깝다. local 전환 시 large-v3-turbo 검토
      compute_type: int8                                      # [RS] local 모드 전용
      beam_size: 5                                            # [RT] local 모드 전용
      language: ja                                            # [RT] 언어 고정(자동 감지 끔 — 한국어 섞임 오인 방지)
      timeout_ms: 60000                                       # [RT] 한 발화(≤60s) 전사 상한

  # ---------------------------------------------------------------------------
  # TTS — Style-Bert-VITS2 (M4 tts-service) — 파라미터 이름은 엔진 중립 (기획안 §10·§11·§69)
  # 최종 파라미터는 TTS Parameter Resolver 가 정한다:
  #   UserVoiceSetting > VoiceProfile.defaults > Persona 힌트 > 대화 컨텍스트 > LLM speech.style
  # 여기 값은 그 어느 층도 값을 주지 않았을 때의 바닥값이다.
  # ---------------------------------------------------------------------------
  tts:
    engine: style-bert-vits2                                  # [RD]
    endpoint: http://m4.lan:8200                              # [RS] M4 tts-service. env TTS_SERVICE_URL 이 덮어씀. 실제 호스트명은 배포 시 확정
    timeout_ms: 8000                                          # [RT] 문장 1건 합성 상한(P0 ③ 목표 ≤1.0s 의 8배 = 이상 징후 컷)
    default_voice: jvnv-F1-jp                                 # [RT] VoiceProfile 시드 중 기본. 사용자 설정이 없을 때
    styles:                                                   # [RT] 의미적 스타일 → 모델 스타일 이름 매핑의 바닥값(VoiceProfile.defaults 가 우선)
      teacher: Neutral
      friendly: Happy
    modes:                                                    # [RT] 재생 속도 모드(기획안 §11). Learning 은 사용자가 고르는 3단계
      native: 1.0
      learning: [0.6, 0.8, 1.0]
    max_sentence_chars: 100                                   # [RO] SBV2 기본 100자 제한 → 문장 분할 기준(sentenceSplit)
    style_weight_default: 1.0                                 # [RT] 0~2 범위
    cache:
      dir: tts-cache                                          # [RS] DATA_ROOT 기준 상대경로 → DATA_ROOT/tts-cache/<key[0:2]>/<key>.wav
      max_bytes: 2147483648                                   # [RT] 2GB 넘으면 hits 낮은 순 LRU 제거(별도 정리 잡)
    preview:
      text_key: voice.preview.defaultText                     # [RO] 미리듣기 문장은 AppSetting 에서 읽는다(콘솔에서 편집)
      text_version_key: voice.preview.textVersion             # [RO] 캐시 키에 포함되는 문장 버전

  # ---------------------------------------------------------------------------
  # Router / Fallback — 역할별 primary·fallback connectionId (기획안 §14·§60·§61)
  # DB 의 EngineFallbackPolicy(5·6순위)가 있으면 그것이 이긴다. 여기는 seed 겸 바닥값.
  # 상태가 UNAVAILABLE·DISABLED·MISCONFIGURED 인 connection 은 순회에서 제외, 실패 시 다음으로 1회 재시도.
  # ---------------------------------------------------------------------------
  router:
    rules: []                                                 # [RT] 조건 라우팅(device capability·network·latency·confidence·subscription) 슬롯. Phase 1 은 device capability 만 코드로 구현(클라 RealtimeSttClient 선택)
    retry_once: true                                          # [RT] 실패 시 다음 connection 으로 1회 재시도
    health_interval_sec: 300                                  # [RT] HEALTH 주기(기능 테스트는 수동/배포 후)
  fallback:
    REALTIME_STT:
      primary: reazon-ondevice                                # 온디바이스 플러그인(connectionType ONDEVICE)
      fallbacks: [reazon-gateway]                             # 웹·모델 미설치·플러그인 오류 2회 → gateway WS
    ANALYSIS_STT:
      primary: whisper-voicevault
      fallbacks: []                                           # 전용 whisper 인스턴스는 추가 시 여기에
    TTS:
      primary: style-bert-m4
      fallbacks: []                                           # Phase 4: style-bert-gateway(WS 내 푸시) 후보
    LLM:
      primary: claude-cli
      fallbacks: [home-m4]                                    # 회화·채팅·ask 는 capabilities 제약으로 home-m4 배정 불가(A10·보기 생성만)

  # ---------------------------------------------------------------------------
  # Transcript Ensemble (기획안 §8) — worker 의 TranscriptComparator 임계
  # ---------------------------------------------------------------------------
  ensemble:
    review_threshold: 0.85                                    # [RT] transcriptConfidence < 0.85 → requiresReview
    accurate_mode_threshold: 0.90                             # [RT] recognitionMode=ACCURATE 일 때 임계
    normalize:
      nfkc: true                                              # [RO] 정규화 단계 고정(비교 규칙은 worker/README.md)
      strip_punctuation: true
      kana_fold: true                                         # 카타카나→히라가나 + 한자→읽기(pyopenjtalk) — 미결: 라이브러리 확정

  # ---------------------------------------------------------------------------
  # gateway / worker 프로세스 설정
  # ---------------------------------------------------------------------------
  gateway:
    host: 127.0.0.1                                           # [RS] nginx 뒤에서만 듣는다
    port: 8100                                                # [RS]
    ticket_ttl_sec: 60                                        # [RT] POST /api/v1/speech/ticket JWT 수명(아래로는 못 줄인다: 앱이 발급 후 연결까지 여유)
    ticket_audience: ws-speech                                # [RO] 티켓 aud 클레임(api-contract §0-3 정본 — gateway 코드는 상수로 고정, task-003e)
    max_sessions: 8                                           # [RT] 동시 WS 세션 상한(초과 429). 우분투 CPU 실측 후 조정
    frame_ms: 40                                              # [RO] 클라 PCM16 프레임 길이
    max_utterance_sec: 60                                     # [RT] 한 발화 상한(초과 시 강제 final)
    session_idle_timeout_sec: 120                             # [RT] 프레임이 끊긴 세션 정리
    utterance_dir: users                                      # [RO] DATA_ROOT/users/<userId>/utterances/YYYY-MM/<utteranceId>.wav
    internal_callback_timeout_ms: 5000                        # [RT] POST /api/internal/speech/utterances 상한
    tts_proxy_enabled: false                                  # [RS] Phase 4 슬롯: WS 세션 내 문장 오디오 푸시(POST /tts). 기본 꺼짐
  worker:
    poll_interval_ms: 1000                                    # [RT] SpeechJob 폴링 간격(유휴 시 최대 5000 까지 백오프)
    batch_size: 1                                             # [RT] 한 번에 클레임하는 잡 수(직렬 처리 원칙)
    max_attempts: 3                                           # [RT] 초과 시 FAILED 확정
    stale_after_sec: 900                                      # [RT] 기동 시 RUNNING 이 이보다 오래됐으면 QUEUED 로 복귀
    kinds: [ANALYSIS_STT]                                     # [RS] 소비하는 잡 종류. Phase 3 에 PRONUNCIATION 추가
    pronunciation:
      enabled: false                                          # [RS] Phase 3: narabas + pyopenjtalk + pyworld(F0)
      aligner_model: narabas                                  # [RD]

  # ---------------------------------------------------------------------------
  # 저장·보존·로깅
  # ---------------------------------------------------------------------------
  storage:
    utterance_retention_days: 30                              # [RT] 원본 wav 보존(분석 결과·텍스트는 영구, 사용자 삭제 시 파일 즉시 삭제)
    max_upload_bytes: 2097152                                 # [RT] POST /api/v1/speech/utterances 2MB(≈60s PCM16 16k 는 1.9MB)
  logging:
    level: INFO                                               # [RT] POST /admin/log-level 로 런타임 변경. 전문 텍스트는 DebugSession 에서만 DEBUG
    mask_transcripts: true                                    # [RO] INFO 이상에서 전사 전문 금지(길이·sha1[:8] 만)
