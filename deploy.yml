# TheKaiwa 배포 매니페스트
# 스키마: ../docs/dev-deploy-workflow.md §3 · 도입 절차: ../docs/deployer-integration-procedure.md
# 이 프로젝트의 배포 정본(선결 조건·컷오버·배포 후 확인·롤백): docs/deploy-order.md
#
# 현재 사실 (2026-09-28, task-009 R1)
#   · 저장소: origin = Gitea project_TheKaiwa (push 는 https://git.미라클펭귄.com, 서버 fetch 는 아래 LAN 주소 — 같은 저장소).
#   · build 는 `npm run build` 가 아니다. package.json 의 build 는 scripts/sync-local.sh 로 ~/.node-local/thekaiwa 미러에서
#     빌드하므로, 그대로 쓰면 모든 릴리스가 단일 미러를 공유해 blue/green 이 무의미해진다(dev-deploy-workflow §7-1).
#     운영 경로(/home/brownjeon/apps)는 ext4 라 noexec 우회가 필요 없으므로 릴리스 디렉토리에서 직접 빌드한다.
#     개발은 계속 미러(`npm run dev`·`npm run build`)를 쓴다.
#   · 앱 2개를 함께 배포한다: Next 앱(thekaiwa, 3010) + 실시간 STT 폴백 gateway(thekaiwa-speech-gateway, 127.0.0.1:8100).
#     ecosystem.config.js 는 릴리스 안에서 평가되면 두 앱 모두 그 릴리스를 cwd 로 잡는다(`__dirname`).
#
# §workspace — `@workspace/auth-oauth` 는 NFS 절대경로 `file:` 의존성이다. package-lock.json 은 이를 lock 을 만든
#   미러(~/.node-local/thekaiwa, /home/brownjeon 기준 2단계) 기준 **상대경로** `file:../../NFS/...` 로 굳힌다.
#   릴리스(<base>/releases/<id>)에서 `../../` 는 <base> 라서 `npm ci` 가 <base>/NFS/... 를 찾는다.
#   → 서버에 호환 링크가 **미리** 있어야 한다(release.sh 는 만들지 않는다 — 컷오버 때 사람이 1회):
#       ln -s /home/brownjeon/NFS /home/brownjeon/apps/thekaiwa/NFS
#   `.npmrc` install-links=true 라 설치 후에는 실제 파일로 복사되므로 이 경로는 설치 시점에만 필요하다.
#   링크가 없으면 build_failed(ENOENT)로 시끄럽게 실패하고 운영은 영향받지 않는다.
#   `@thekaiwa/sherpa-stt`(file:plugins/sherpa-stt)는 저장소 안 경로라 깊이와 무관하다.
#
# §공유 자원 — 롤백으로 되돌아가지 않는다(DB 마이그레이션과 같은 등급, 배포가 건드리지 않는다)
#   · Python venv ~/.node-local/thekaiwa-speech/venv (gateway). requirements.txt 변경은 별도 승인 작업.
#   · DATA_ROOT(.env) — STT 모델(DATA_ROOT/models)·발화 wav·TTS 캐시·APK 배포본(DATA_ROOT/releases). 개발과 공유.
#   · 워크스페이스 공용 패키지 shared/auth-oauth(NAS 상주, git 밖).
#   · 맥 M4 tts-service(:8200) — 별도 배포(git push 웹훅, 사용자 승인).
#   · shared/.env — 운영 전용 사본. APP_ENV=PRODUCTION 이 개발(NFS .env, LOCAL)과 다른 유일한 값이다.

name: thekaiwa

target:
  host: 125.177.194.26
  # sshd 가 22 가 아니라 993 에서 돈다 (~/.ssh/config 의 home_ubuntu 별칭과 동일).
  # 우분투 서버 자신에서 실행하면 deploy.sh 가 SSH 없이 로컬로 돈다(dev-deploy-workflow §1).
  port: 993
  user: brownjeon
  base: /home/brownjeon/apps/thekaiwa

source:
  repo: http://192.168.219.154:3000/brownjeon/project_TheKaiwa.git
  ref: main

runtime:
  manager: pm2
  apps:
    - thekaiwa
    - thekaiwa-speech-gateway
  # 헬스체크 대상 포트 하나(Next 앱). gateway 의 상태는 /api/health 의 checks.stt_gateway 로 보인다(degraded — 배포를 막지 않음).
  port: 3010
  ecosystem: ecosystem.config.js

build:
  install: npm ci --no-audit --no-fund
  # @prisma/client 는 postinstall 이 없으므로 generate 를 명시한다
  command: node node_modules/.bin/prisma generate && node node_modules/next/dist/bin/next build

shared:
  - .env
  - logs

# /api/health: 필수 의존성(DB 접속·DATABASE_URL·JWT_SECRET·Google OAuth·DATA_ROOT)이 하나라도 안 되면 503 →
# release.sh(curl -fsS)가 실패로 보고 이전 릴리스로 자동 롤백한다. 음성·LLM 등 선택 의존성(stt_gateway·tts·llm…)만
# 빠지면 200 + status "degraded" — M4 TTS 가 잠시 꺼져 있어도 웹 배포는 막히지 않는다. 배포 후 본문을 따로 확인한다.
health:
  path: /api/health
  timeout: 30

# prisma migrations 디렉토리가 비어 있고(0건) 스키마는 `prisma db push` 로만 반영한다(CLAUDE.md — 개발·운영 공유 DB,
# `migrate dev` 금지). 운영용 `prisma migrate deploy` 는 마이그레이션 이력을 먼저 갖춰야 한다.
# 그때까지 migrate 항목을 비워 둔다 → --with-migrate 를 주면 deploy.sh 가 거부한다.
# 스키마 변경은 배포와 별개로 사용자 승인 후 db push(백업 먼저) — docs/deploy-order.md §7.
# migrate:
#   command: node node_modules/.bin/prisma migrate deploy
#   requires_approval: true

keep_releases: 5
